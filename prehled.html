  function epsonSoapEnvelope(innerXml){
    return '<?xml version="1.0" encoding="utf-8"?>' +
      '<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/">' +
      '<s:Body>' +
      '<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">' +
      innerXml +
      '</epos-print>' +
      '</s:Body>' +
      '</s:Envelope>';
  }

  function epsonPrinterEndpoint(){
    const host = getPrinterHost();
    if(!host) return '';
    const base = /^https?:\/\//i.test(host) ? host.replace(/\/+$/, '') : 'https://' + host;
    return base + '/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000';
  }

  // Vrací Promise<boolean> — true jen když tiskárna potvrdí úspěšný tisk.
  // Díky tomu může volající (tlačítko Tisk i potvrzovací dialog u tlačítka
  // zpět) čekat na výsledek a reagovat na něj (např. teprve po úspěchu
  // opustit obrazovku detailu).
  function printViaEpson(record){
    return new Promise(async (resolve)=>{
      const host = getPrinterHost();
      if(!host){
        setDetailNote('Tiskárna není nastavená — otevři index.html appky a nastav IP tiskárny (⚙ Nastavit tiskárnu).', 'err');
        resolve(false);
        return;
      }
      setDetailNote('Tisknu…', '');

      const endpoint = epsonPrinterEndpoint();
      const body = epsonSoapEnvelope(buildEposPrintXml(record));

      async function attempt(mode){
        const controller = new AbortController();
        const timeoutId = setTimeout(()=>controller.abort(), 12000);
        try{
          const resp = await fetch(endpoint, {
            method: 'POST',
            mode,
            headers: { 'Content-Type': 'text/plain' },
            body,
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          return { ok: true, resp };
        }catch(e){
          clearTimeout(timeoutId);
          return { ok: false, error: e };
        }
      }

      let result = await attempt('cors');
      if(result.ok){
        try{
          const text = await result.resp.text();
          const xml = new DOMParser().parseFromString(text, 'text/xml');
          const responseEl = xml.getElementsByTagName('response')[0];
          const success = !!responseEl && /^(1|true)$/i.test(responseEl.getAttribute('success') || '');
          if(success){
            setDetailNote('✓ Vytištěno', 'ok');
            currentRecordPrinted = true;
            resolve(true);
            return;
          }
          const code = responseEl ? responseEl.getAttribute('code') : null;
          setDetailNote('Tiskárna nahlásila chybu' + (code ? ' (' + code + ')' : '') + '.', 'err');
          resolve(false);
          return;
        }catch(e){
          // Odpověď dorazila, ale nešla přečíst (typicky CORS) — spadneme
          // do "no-cors" pokusu níže.
        }
      }

      const fallback = await attempt('no-cors');
      if(fallback.ok){
        setDetailNote('⚠ Tisk odeslán, ale tiskárna potvrzení nevrátila (CORS). Zkontroluj výtisk.', 'ok');
        currentRecordPrinted = true;
        resolve(true);
        return;
      }

      const bareHost = host.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
      const msg = fallback.error && fallback.error.name === 'AbortError'
        ? 'Tiskárna neodpověděla včas — zkontroluj, že je zapnutá a telefon je připojený na stejnou síť/Wi-Fi Direct.'
        : 'Spojení s tiskárnou selhalo. Pokud jsi ještě v Safari nenavštívil https://' + bareHost + '/ ' +
          'a nepotvrdil certifikát tiskárny, udělej to nejdřív (stačí jednou).';
      setDetailNote(msg, 'err');
      resolve(false);
    });
  }


  function renderList(filterText){
    const container = document.getElementById('listBody');
    const statusEl = document.getElementById('listStatus');
    const q = (filterText || '').trim().toLowerCase();

    const filtered = !q ? allRecords : allRecords.filter(r=>
      (r.plate || '').toLowerCase().includes(q) ||
      (r.address || '').toLowerCase().includes(q) ||
      (r.noticeNumber || '').toLowerCase().includes(q) ||
      (r.officerName || '').toLowerCase().includes(q) ||
      (r.offenseLabel || '').toLowerCase().includes(q) ||
      (r.date || '').toLowerCase().includes(q) ||
      formatDateCz(r.date).toLowerCase().includes(q)
    );

    container.innerHTML = '';
    if(allRecords.length === 0){
      statusEl.textContent = 'Zatím žádné odeslané přestupky.';
      container.appendChild(statusEl);
      return;
    }
    if(filtered.length === 0){
      statusEl.textContent = 'Žádná shoda pro „' + filterText + '“.';
      container.appendChild(statusEl);
      return;
    }

    filtered.forEach(r=>{
      const item = document.createElement('div');
      item.className = 'record-item' + (r.resolved ? ' resolved' : '') + (r.docType === 'boticka' ? ' boticka' : '');

      const topRow = document.createElement('div');
      topRow.className = 'record-top-row';

      const plateRow = document.createElement('div');
      plateRow.className = 'record-plate-row';

      const plate = document.createElement('div');
      plate.className = 'record-plate';
      plate.textContent = r.plate || 'NEZNÁMÁ SPZ';
      plateRow.appendChild(plate);

      const docTypeBadge = document.createElement('div');
      docTypeBadge.className = 'record-doctype-badge' + (r.docType === 'boticka' ? ' boticka' : '');
      docTypeBadge.textContent = r.docType === 'boticka' ? 'Botička' : 'Parkovačka';
      plateRow.appendChild(docTypeBadge);

      if(r.resolved){
        const badge = document.createElement('div');
        badge.className = 'record-resolved-badge';
        badge.textContent = r.resolvedMethod === 'oznameni' ? 'Oznámeno'
          : r.resolvedMethod === 'vyzva' ? 'Zaslána výzva'
          : r.resolvedMethod === 'prikaz' ? 'Dořešeno příkazem'
          : r.resolvedMethod === 'domluva' ? 'Dořešeno domluvou'
          : 'Dořešeno';
        plateRow.appendChild(badge);
      }
      topRow.appendChild(plateRow);

      if(r.noticeNumber || (r.pachatel && (r.pachatel.jmeno || r.pachatel.prijmeni))){
        const numRow = document.createElement('div');
        numRow.className = 'record-notice-row';
        if(r.noticeNumber){
          const num = document.createElement('span');
          num.className = 'record-notice-number';
          num.textContent = r.noticeNumber;
          numRow.appendChild(num);
        }
        // Pachatel appka ukáže jen když ho z dialogu "Pachatel" zná
        // (jméno/příjmení + obec) — obec appka bere ze stejného
        // uloženého "PSČ, Obec" formátu, jen bez té PSČ části.
        if(r.pachatel && (r.pachatel.jmeno || r.pachatel.prijmeni)){
          const jmenoPrijmeni = [r.pachatel.jmeno, r.pachatel.prijmeni].filter(Boolean).join(' ');
          const mesto = r.pachatel.mesto || '';
          const commaIdx = mesto.indexOf(', ');
          const obecName = commaIdx !== -1 ? mesto.slice(commaIdx + 2) : mesto;
          const pachatelInfo = document.createElement('span');
          pachatelInfo.className = 'record-pachatel-info';

  function getOffensePenaltyText(record){
    const penalty = record && record.offenseLabel ? OFFENSE_PENALTIES[record.offenseLabel] : null;
    return penalty ? ('Příkaz na místě (' + penalty + ')') : 'Příkaz na místě';
  }

  // Přestupky s finančním rozmezím (např. "2 500–3 500 Kč") jsou závažnější
  // — u nich domluva jako způsob řešení nepřipadá v úvahu, jen u přestupků
  // s pevným stropem ("do X Kč").
  function offenseHasPenaltyRange(record){
    const penalty = record && record.offenseLabel ? OFFENSE_PENALTIES[record.offenseLabel] : null;
    return !!(penalty && penalty.indexOf('–') !== -1);
  }

  // Ukládá skutečnou fotku (ne screenshot obrazovky) do Fotek. Atribut
  // "download" na <a href="data:..."> je na iOS Safari (obzvlášť v appce
  // přidané na plochu) nespolehlivý — tap na něj místo staženého souboru
  // často jen zobrazí obrázek a to, co se pak reálně uloží do Fotek, je
  // screenshot aktuální obrazovky. Nativní sdílecí okno (Web Share API se
  // skutečným File objektem) ukládá spolehlivě přímo fotku; když ho telefon
  // nepodporuje, otevřeme fotku v nové kartě, odkud jde uložit podržením prstu.
  async function shareOrOpenPhoto(dataUrl, filename){
    try{
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      const file = new File([blob], filename, { type: blob.type || 'image/jpeg' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file] });
        return;
      }
    }catch(e){
      // Uživatel sdílení zrušil, nebo API není k dispozici — zkusíme fallback.
    }
    window.open(dataUrl, '_blank');
  }

    // Older records still keep photos inline on the main document; newer
    // ones only have a `hasPhotos` flag and the actual bytes live in a
    // subcollection, fetched lazily below when "Foto" is tapped — this is
    // what keeps opening a record (and loading the list before it) fast.
    const legacyPhotos = record.photos && record.photos.length ? record.photos
      : (record.photoBase64 ? [record.photoBase64] : []);

    if(record._resolvedPhotos){
      // Fotky už byly v této session jednou staženy (ze subkolekce nebo

      record._resolvedPhotos = legacyPhotos;
      record._resolvedMime = record.photoMime || 'image/jpeg';

      photoToggleRow.style.display = 'block';

  function updateResolveBtn(record){
    const menuBtn = document.getElementById('resolveMenuBtn');
    const vyresenoBtn = document.getElementById('menuVyresenoBtn');
    const domluvaBtn = document.getElementById('menuDomluvaBtn');
    const penaltyText = getOffensePenaltyText(record);
    // U přestupků s finančním rozmezím (viz offenseHasPenaltyRange výše)
    // domluva jako způsob řešení nepřipadá v úvahu — tlačítko se v nabídce
    // vůbec nezobrazí, aby si ho strážník nemohl omylem zvolit.
    domluvaBtn.style.display = offenseHasPenaltyRange(record) ? 'none' : '';
    if(record.resolved){
      // Text u horního tlačítka "Dořešit" se liší podle toho, jak byl
      // přestupek doopravdy vyřešen — starší záznamy bez uloženého
      // resolvedMethod (z appky před touhle úpravou) spadnou na obecné
      // "Dořešeno".
      if(record.resolvedMethod === 'oznameni'){
        menuBtn.textContent = '✓ Oznámeno';
      } else if(record.resolvedMethod === 'vyzva'){
        menuBtn.textContent = '✓ Odeslána výzva';
      } else if(record.resolvedMethod === 'prikaz'){
        menuBtn.textContent = '✓ Dořešeno příkazem';
      } else if(record.resolvedMethod === 'domluva'){
        menuBtn.textContent = '✓ Dořešeno domluvou';
      } else {
        menuBtn.textContent = '✓ Dořešeno';
      }
      // Tlačítka v nabídce appka NEzakazuje, i když je přestupek už
      // vyřešený — klik na jinou možnost teď slouží k dodatečné změně
      // způsobu řešení (viz markResolved níž, umí i editaci), jen appka
      // u toho aktuálně platného způsobu nechává značku ✓ pro přehled.
      vyresenoBtn.textContent = (record.resolvedMethod === 'prikaz' ? '✓ ' : '') + penaltyText;
      vyresenoBtn.disabled = false;
      domluvaBtn.textContent = record.resolvedMethod === 'domluva' ? '✓ Domluva' : 'Domluva';
      domluvaBtn.disabled = false;
    } else {
      menuBtn.textContent = 'Dořešit';
      vyresenoBtn.textContent = penaltyText;
      vyresenoBtn.disabled = false;
      domluvaBtn.textContent = 'Domluva';
      domluvaBtn.disabled = false;
    }

  // Sdílené označení přestupku jako vyřešeného — volá se jak po úspěšném
  // otevření dokumentu "Oznámení", tak po klepnutí na "Příkaz na místě".
  // "method" rozlišuje, jaký text appka pak zobrazí (viz updateResolveBtn
  // a vykreslení odznaku v seznamu). Funguje i na už vyřešený přestupek —
  // to je "editace" (změna způsobu řešení, klik na jinou možnost v
  // nabídce Dořešit) — appka pak jen posune resolvedMethod/resolvedAt na
  // novou hodnotu a předchozí řešení nechá zaznamenané v
  // resolutionHistory (log appka zobrazuje jen v přehledu desktop, ale
  // appka ho zapisuje z obou appek stejně, ať je úplný, ať se řeší
  // odkudkoliv).
  async function markResolved(record, method, extra){
    if(!record) return;
    // TTL appka počítá vždycky od VYTVOŘENÍ (ne od okamžiku řešení/
    // editace) — Příkaz/Domluva/Oznámení dostanou kratší 60denní lhůtu,
    // Výzva a nevyřešené zůstávají na 180 dnech (6 měsíců, stejně jako při
    // založení v index.html). Appka to přepočítává při každém volání,
    // takže i zpětná editace (např. Výzva → Příkaz, nebo naopak) lhůtu
    // vždy správně přenastaví.
    const createdDate = (record.createdAt && typeof record.createdAt.toDate === 'function')
      ? record.createdAt.toDate() : new Date();
    const KEEP_DAYS_BY_METHOD = { prikaz: 60, domluva: 60, oznameni: 60, vyzva: 180 };
    const keepDays = KEEP_DAYS_BY_METHOD[method] != null ? KEEP_DAYS_BY_METHOD[method] : 180;
    const expireAt = firebase.firestore.Timestamp.fromDate(new Date(createdDate.getTime() + keepDays*24*60*60*1000));
    const officerName = currentOfficerName() || record.officerName || '';
    // FieldValue.serverTimestamp() nejde použít jako prvek pole
    // (arrayUnion) — Firestore ho tam nechá vyhodnotit jako null. Pro
    // záznam v historii proto appka bere aktuální čas z klienta; pro
    // "resolvedAt" nahoře (aktuální/poslední řešení) zůstává serverAt.
    const historyEntry = { method, resolvedAt: firebase.firestore.Timestamp.now(), officerName };
    const updateData = {
      resolved: true,
      resolvedMethod: method,
      resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
      resolvedByOfficer: officerName,
      resolutionHistory: firebase.firestore.FieldValue.arrayUnion(historyEntry),
      expireAt: expireAt
    };
    // "Příkaz na místě" nese navíc částku, způsob platby a údaje
    // o pachateli (viz modál prikazOverlay) — posílá se jen když
    // skutečně existují.
    if(extra && extra.castka != null) updateData.castka = extra.castka;
    if(extra && extra.platba) updateData.platba = extra.platba;
    if(extra && extra.pachatel) updateData.pachatel = extra.pachatel;
    await db.collection('prestupky').doc(record.id).update(updateData);
    record.resolved = true;
    record.resolvedMethod = method;
    record.resolvedByOfficer = officerName;
    record.resolvedAt = new Date();
    record.resolutionHistory = (record.resolutionHistory || []).concat([historyEntry]);
    if(extra && extra.castka != null) record.castka = extra.castka;
    if(extra && extra.platba) record.platba = extra.platba;
    if(extra && extra.pachatel) record.pachatel = extra.pachatel;
    updateResolveBtn(record);
    renderList(document.getElementById('searchInput').value);
  }

  async function exportVyzva(record, pachatel, filenameOverride, dostaveniTermin){
    try{
      if(typeof JSZip === 'undefined'){
        setDetailNote('Export do Wordu se nepodařilo načíst (chybí knihovna JSZip — zkontrolujte připojení k internetu).', 'err');
        return false;
      }
      const blob = await buildVyzvaDopisDocx(record, pachatel, dostaveniTermin);
      const filename = filenameOverride || ('Vyzva_' + (record.plate || 'prestupek').replace(/\s+/g,'') + '.docx');
      try{
        const file = new File([blob], filename, { type: blob.type });
        if(navigator.canShare && navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file] });
          return true;
        }
      }catch(e){
        // Uživatel sdílení zrušil nebo API není k dispozici — spadneme na
        // otevření v nové kartě, stejně jako u Oznámení.
      }
      downloadBlobWithFilename(blob, filename);
      return true;
    }catch(e){
      console.error('Export Výzvy selhal:', e);
      setDetailNote('Vytvoření dokumentu se nezdařilo (' + e.message + ').', 'err');
      return false;
    }
  }

  // Stejná logika jako v prehled-desktop.html — viz tam podrobný komentář.
  const PRIKAZ_MODE_TITLES = {
    prikaz: 'Příkaz na místě',
    vyzva: 'Výzva k podání vysvětlení',
    oznameni: 'Oznámení správnímu orgánu'

  function openPrikazModal(mode){
    prikazMode = mode || 'prikaz';

  // ---------- Adresa trvalého pobytu — Mapy.com Suggest API ----------
  // Zdarma 250 000 kreditů/měsíc (adresní dotaz = 4 kredity → 62 500
  // dotazů/měsíc zdarma), pro objem téhle appky by to reálně mělo vyjít
  // na 0 Kč. Klíč se získá zdarma na developer.mapy.com — DOPLŇ HO SEM
  // (stejná hodnota jako v prehled-desktop.html):
  const MAPY_API_KEY = 'nY-91216wSSQ5waRO4ABMmtDldTuDGTPzp8kd8WcsQM';

  function debounce(fn, wait){
    let t;
    return function(...args){
      clearTimeout(t);
      t = setTimeout(()=> fn.apply(this, args), wait);
    };
  }

  // allowEmpty: použije se pro "sonda má obec vůbec ulice?" dotaz, kde
  // se schválně posílá prázdný query jen s filtrem locality+type.
  // allowEmpty: použije se pro "sonda má obec vůbec ulice?" dotaz, kde
  // se schválně posílá prázdný query jen s filtrem locality+type.
  // Vrací { items, error } — error je čitelný text k zobrazení přímo
  // v seznamu nabídek (na mobilu nejde snadno do DevTools), ať jde
  // chybu poznat i jen podle screenshotu z appky.
  async function mapySuggest(query, types, opts){
    opts = opts || {};
    if(!opts.allowEmpty && (!query || query.trim().length < 2)) return { items: [], error: null };
    if(!MAPY_API_KEY || MAPY_API_KEY === 'DOPLNIT_API_KLIC'){
      return { items: [], error: 'Chybí API klíč Mapy.com v kódu appky.' };
    }
    const params = new URLSearchParams();
    params.set('apikey', MAPY_API_KEY);
    params.set('query', query || '');
    params.set('lang', 'cs');
    params.set('limit', String(opts.limit || 8));
    types.forEach(t => params.append('type', t));
    if(opts.locality) params.append('locality', opts.locality);
    const url = 'https://api.mapy.com/v1/suggest?' + params.toString();
    try{
      const res = await fetch(url);
      if(!res.ok){
        let bodyText = '';
        try{ bodyText = await res.text(); }catch(e2){}
        console.error('Mapy.com suggest HTTP chyba', res.status, bodyText, url);
        return { items: [], error: 'Mapy.com chyba ' + res.status + (bodyText ? ': ' + bodyText.slice(0, 140) : '') };
      }
      const data = await res.json();
      return { items: data.items || [], error: null };
    }catch(e){
      console.error('Mapy.com suggest selhal:', e, url);
      return { items: [], error: 'Síťová/CORS chyba: ' + (e && e.message ? e.message : String(e)) };
    }
  }

  // ---------- Vlastní kalendář (Datum narození / Dostavit se dne) ----------
  // Kompletně ve vlastní režii appky (žádný nativní <input type="date">),
  // takže se nespoléhá na to, jak si který Android/iOS s posunem layoutu
  // poradí — appka si sama vykresluje mřížku dnů a čeká na klik.
  const DP_MONTHS_CS = ['Leden','Únor','Březen','Duben','Květen','Červen','Červenec','Srpen','Září','Říjen','Listopad','Prosinec'];
  const DP_DOW_CS = ['Po','Út','St','Čt','Pá','So','Ne'];

  function initDatePicker(input, panel, opts){
    opts = opts || {};
    const today = new Date();
    const minYear = opts.minYear || (today.getFullYear() - 100);
    const maxYear = opts.maxYear || (today.getFullYear() + 1);
    let viewYear = today.getFullYear();
    let viewMonth = today.getMonth();

    function pad2(n){ return String(n).padStart(2, '0'); }
    function isoOf(y, m, d){ return y + '-' + pad2(m + 1) + '-' + pad2(d); }
    function todayIso(){ return isoOf(today.getFullYear(), today.getMonth(), today.getDate()); }
    // Pole navenek zobrazuje DD.MM.RRRR (stejně jako zbytek appky) —
    // interní ISO (kvůli výpočtům/řazení jinde v appce, viz formatDateCz
    // a vyzvaDatumRaw) appka drží v data-iso atributu.
    function setValue(iso){
      input.dataset.iso = iso || '';
      input.value = iso ? isoToDotted(iso) : '';
    }

    function render(){
      const selectedIso = input.dataset.iso || '';
      let html = '<div class="prikaz-datepicker-head">';
      html += '<select class="dp-month">';
      for(let m = 0; m < 12; m++){
        html += '<option value="' + m + '"' + (m === viewMonth ? ' selected' : '') + '>' + DP_MONTHS_CS[m] + '</option>';
      }
      html += '</select><select class="dp-year">';
      for(let y = maxYear; y >= minYear; y--){
        html += '<option value="' + y + '"' + (y === viewYear ? ' selected' : '') + '>' + y + '</option>';
      }
      html += '</select></div><div class="prikaz-datepicker-grid">';
      DP_DOW_CS.forEach(d => { html += '<div class="prikaz-datepicker-dow">' + d + '</div>'; });

      // getDay(): 0=neděle..6=sobota; appka chce pondělí jako první sloupec.
      const leadingEmpty = (new Date(viewYear, viewMonth, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      for(let i = 0; i < leadingEmpty; i++){ html += '<div class="prikaz-datepicker-day is-empty"></div>'; }
      for(let d = 1; d <= daysInMonth; d++){
        const iso = isoOf(viewYear, viewMonth, d);
        let cls = 'prikaz-datepicker-day';
        if(iso === todayIso()) cls += ' is-today';
        if(iso === selectedIso) cls += ' is-selected';
        html += '<div class="' + cls + '" data-iso="' + iso + '">' + d + '</div>';
      }
      html += '</div><div class="prikaz-datepicker-foot"><button type="button" class="dp-today">Dnes</button><button type="button" class="dp-clear">Vymazat</button></div>';
      panel.innerHTML = html;

      panel.querySelector('.dp-month').addEventListener('change', e => { viewMonth = Number(e.target.value); render(); });
      panel.querySelector('.dp-year').addEventListener('change', e => { viewYear = Number(e.target.value); render(); });
      panel.querySelectorAll('.prikaz-datepicker-day[data-iso]').forEach(el => {
        el.addEventListener('click', () => pick(el.getAttribute('data-iso')));
      });
      panel.querySelector('.dp-today').addEventListener('click', () => pick(todayIso()));
      panel.querySelector('.dp-clear').addEventListener('click', () => {
        setValue('');
        input.dispatchEvent(new Event('change', { bubbles: true }));
        close();
      });
    }

    function pick(iso){
      setValue(iso);
      input.dispatchEvent(new Event('change', { bubbles: true }));
      close();
    }
    function onOutside(e){ if(!panel.contains(e.target) && e.target !== input) close(); }
    function open(){
      const base = input.dataset.iso ? input.dataset.iso.split('-').map(Number) : null;
      // Bez existující hodnoty appka kalendář neotvírá na aktuálním roce
      // (u data narození nedává smysl — appka rovnou skočí blíž
      // typickému věku pachatele, viz opts.defaultYear).
      viewYear = base ? base[0] : (opts.defaultYear || today.getFullYear());
      viewMonth = base ? base[1] - 1 : today.getMonth();
      render();
      panel.classList.add('open');
      setTimeout(() => document.addEventListener('mousedown', onOutside), 0);
    }
    function close(){
      panel.classList.remove('open');
      document.removeEventListener('mousedown', onOutside);
    }
    input.addEventListener('click', () => {
      if(panel.classList.contains('open')) close(); else open();
    });
    // Appka umí pole i otevřít programově (řetězec automatických skoků
    // mezi poli po Jméno/Příjmení atd., viz focusField) a nastavit
    // hodnotu zvenčí (reset formuláře, vyplnění ze skenu OP).
    input._openDatePicker = open;
    input._setDatePickerIso = setValue;
    return { open, close, setValue };
  }

  // Malá prodleva mezi opuštěním jednoho pole a zaostřením dalšího — na
  // iOS Safari se bez ní umí klávesnice krátce zavřít a znovu otevřít
  // (probliknutí), místo aby plynule zůstala nahoře. Tahle prodleva ale
  // funguje JEN jako pokračování gesta, když už předtím něco skutečně
  // mělo fokus (klávesnice/kolečko běželo) — appka tomu říká "teplý"
  // přechod.
  //
  // "Studený" přechod (z kalendáře nebo z předchozího selectu nic
  // fokus nemělo — typicky Datum narození → Číslo dokladu, nebo
  // Dostavit se dne → Čas od) je jiný případ: appka tam musí zaostřit
  // úplně SYNCHRONNĚ, přímo v obslužné funkci kliknutí/change, bez
  // jakéhokoli zpoždění — jakmile appka fokus o zlomek vteřiny odloží
  // (byť jen přes setTimeout), iOS už to nebere jako přímé pokračování
  // klepnutí a klávesnici/kolečko vůbec neukáže (ověřeno, přesně tenhle
  // případ appka dřív poflakovala — po výběru data z kalendáře nic
  // nezaostřilo).
  //
  // Explicitní blur() předchozího pole appka volá jen u "teplého"
  // přechodu na kalendář/select — tam je potřeba (jinak, typicky po
  // numerickém poli jako Č. p., zůstane klávesnice z předchozího pole
  // otevřená a překrývá se s kalendářem/selectem, který appka otevírá
  // pod ní). U běžného teplého přechodu mezi textovými poli appka
  // blur() NEvolá a jen rovnou (po krátké prodlevě) fokusuje další pole
  // — to je to "plynulé" navázání, na kterém iOS pozná pokračování
  // téhož gesta. Přidat tam blur() navíc tenhle řetězec spolehlivě
  // přeruší (ověřeno, byla to regrese).
  function focusField(el){
    if(!el) return;
    const wasLive = document.activeElement && document.activeElement !== document.body && document.activeElement !== el;
    if(el.classList && el.classList.contains('js-date-field')){
      if(wasLive){
        document.activeElement.blur();
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if(el._openDatePicker) setTimeout(()=> el._openDatePicker(), 250);
      } else {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if(el._openDatePicker) el._openDatePicker();
      }
      return;
    }
    if(el.tagName === 'SELECT'){
      // Na rozdíl od kalendáře tu appka žádnou vizuální kolizi s
      // klávesnicí neřeší (select žádnou klávesnici neotvírá), takže
      // syntéza "teplý → počkej" tu není potřeba a jen škodí: po výběru
      // hodnoty zůstává předchozí select sám fokusovaný (wasLive=true),
      // a odložené .focus() o 250 ms iOS bere stejně jako u kalendáře —
      // jako přerušení gesta — a druhé kolečko neotevře (přesně tenhle
      // případ, Čas od → Čas do). Appka proto vždy jen blurne (je-li
      // co) a hned synchronně zaostří další select.
      if(wasLive) document.activeElement.blur();
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.focus();
      return;
    }
    if(wasLive){
      setTimeout(()=>{ el.focus(); }, 60);
    } else {
      el.focus();
    }
  }

  // Klávesa Return/Next na klávesnici u textových/číselných polí dělá
  // totéž, jako by se z pole odešlo (blur) — sjednocuje to "potvrdím" a
  // "klepnu jinam" na jedno chování, viz blur listenery níž u
  // jednotlivých polí.
  function advanceOnEnter(input){
    input.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); input.blur(); }
    });
  }

  // U polí bez reálného zdroje nabídek (jméno, příjmení, čísla) appka
  // aspoň napodobí STEJNÝ způsob potvrzení, jaký spolehlivě funguje u
  // adresy/ulice — jak píšeš, pod polem se objeví jedna "nabídka" s tím,
  // co jsi právě napsal, a klik na ni potvrdí a přeskočí dál (na rozdíl
  // od "blur" při odchodu z pole, který se na některých polích nespouští
  // spolehlivě, tohle je vždy explicitní klik).
  function attachConfirmChip(input, listEl, onConfirm){
    function render(){
      const v = input.value.trim();
      if(!v){ listEl.classList.remove('open'); listEl.innerHTML = ''; return; }
      listEl.innerHTML = '';
      const row = document.createElement('div');
      row.className = 'prikaz-suggest-item';
      row.innerHTML = escapeHtml(v) + '<span class="sub">Potvrdit a pokračovat</span>';
      row.addEventListener('mousedown', (e)=>{
        e.preventDefault();
        listEl.classList.remove('open');
        listEl.innerHTML = '';
        onConfirm();
      });
      listEl.appendChild(row);
      listEl.classList.add('open');
    }
    input.addEventListener('input', render);
    input.addEventListener('focus', render);
    input.addEventListener('blur', ()=>{
      setTimeout(()=> listEl.classList.remove('open'), 150);
    });
  }

  // Jméno → Příjmení → Datum narození → Číslo dokladu → Adresa (obec).
  advanceOnEnter(prikazJmenoInput);
  attachConfirmChip(prikazJmenoInput, prikazJmenoList, ()=> focusField(prikazPrijmeniInput));
  prikazJmenoInput.addEventListener('blur', ()=>{
    if(prikazJmenoInput.value.trim()) focusField(prikazPrijmeniInput);
  });
  advanceOnEnter(prikazPrijmeniInput);
  attachConfirmChip(prikazPrijmeniInput, prikazPrijmeniList, ()=> focusField(prikazNarozeniInput));
  prikazPrijmeniInput.addEventListener('blur', ()=>{
    if(prikazPrijmeniInput.value.trim()) focusField(prikazNarozeniInput);

  // Datum narození je appkou vykreslený kalendář (viz initDatePicker výš)
  // — výběr dne vyvolá 'change', a appka jede dál na Číslo dokladu.
  prikazNarozeniInput.addEventListener('change', ()=>{

  advanceOnEnter(prikazDokladInput);

  prikazDokladInput.addEventListener('blur', ()=>{

  async function checkStreetsAndAdvance(){
    prikazUliceInput.value = '';
    prikazCisloDomuInput.value = '';
    // Mapy.com Suggest je čistě full-textové vyhledávání — na prázdný
    // dotaz ("má tahle obec vůbec nějaké ulice?") spolehlivě nevrací nic,
    // takže dřívější "sonda" hlásila "obec nemá ulice" úplně vždy (i pro
    // Brno). Automatické zjištění tímhle API nejde, tak pole vždy rovnou
    // odemkneme — strážník ulici buď napíše (funguje běžný, neprázdný

    // vyplnil ručně bez kliknutí na nabídku), nebo nechá prázdné, pokud
    // obec fakt ulice nemá.
    prikazUliceInput.disabled = false;
    prikazUliceInput.placeholder = 'ulice (nepovinné)';
    focusField(prikazUliceInput);
  }

  // Suggest API u obce PSČ nevrací (ověřeno — appka ho dřív čekala v
  // item.zip, ale to pole tam prostě není). PSČ appka dotáhne zvlášť
  // přes rgeocode na souřadnice vybrané obce (position ze Suggest
  // odpovědi) — stejný endpoint, jaký appka používá v index.html pro
  // určení místa podle GPS, jen appka teď hledá "zip"/"psc" v odpovědi
  // místo jména ulice/obce. Zkouší víc možných názvů pole, protože bez
  // funkčního API klíče appka nemohla ověřit přesný tvar odpovědi naživo.
  function extractZipFromRgeoEntity(entity){
    if(!entity) return '';
    const candidates = [entity, ...(entity.regionalStructure || [])];
    for(const c of candidates){
      if(c && c.zip) return String(c.zip);
      if(c && c.psc) return String(c.psc);
      if(c && c.postalCode) return String(c.postalCode);
    }
    return '';
  }
  async function mapyLookupZip(position){
    if(!position || typeof position.lat !== 'number' || typeof position.lon !== 'number') return '';
    try{
      const url = 'https://api.mapy.com/v1/rgeocode?' + new URLSearchParams({
        lon: String(position.lon), lat: String(position.lat), lang: 'cs', apikey: MAPY_API_KEY
      }).toString();
      const res = await fetch(url);
      if(!res.ok) return '';
      const data = await res.json();
      const items = data.items || [];
      if(!items.length) return '';
      return extractZipFromRgeoEntity(items[0]);
    }catch(e){
      console.error('Mapy.com rgeocode (PSČ) selhal:', e);
      return '';
    }
  }
  let mestoZipRequestId = 0;

  const debouncedMestoSearch = debounce(async ()=>{
    const q = prikazMestoInput.value.trim();
    if(q.length < 2){ prikazMestoList.classList.remove('open'); return; }
    const { items, error } = await mapySuggest(q, ['regional.municipality', 'regional.municipality_part'], { limit: 8 });
    renderSuggestList(prikazMestoList, items, (item)=>{
      selectedMesto = { name: item.name, position: item.position };
      prikazMestoInput.value = item.name;
      document.getElementById('prikazPsc').value = '';
      // PSČ appka doplní automaticky (viz mapyLookupZip níž) — pole
      // pro PSČ appka proto při výběru obce vůbec nezaostřuje, jde
      // rovnou na Ulici (stejná logika jako dřív po ručním zadání PSČ).
      checkStreetsAndAdvance();
      // PSČ appka doplní na pozadí, jakmile rgeocode odpoví — pole
      // zůstává editovatelné, kdyby ho Mapy.com nevrátilo/bylo potřeba
      // opravit. requestId hlídá, aby pozdější (pomalejší) odpověď pro
      // dřív vybranou obec nepřepsala PSČ obce, kterou uživatel mezitím
      // vybral znovu. Mapy.com PSČ vrací s mezerou ("680 01") — appka ji
      // odstraní, ať se celé číslo vejde do úzkého pole PSČ.
      const requestId = ++mestoZipRequestId;
      mapyLookupZip(item.position).then(zip=>{
        if(zip && requestId === mestoZipRequestId) document.getElementById('prikazPsc').value = zip.replace(/\s+/g, '');
      });
    }, error);
  }, 400);
  advanceOnEnter(prikazMestoInput);
  prikazMestoInput.addEventListener('input', ()=>{
    selectedMesto = null;
    debouncedMestoSearch();
  });
  prikazMestoInput.addEventListener('blur', ()=>{
    setTimeout(()=> prikazMestoList.classList.remove('open'), 150);
    // PSČ appka doplňuje sama (viz debouncedMestoSearch výš), takže i
    // tady po opuštění pole Obec (typicky po ručním napsání obce beze
    // kliknutí na nabídku) appka jde rovnou na Ulici — ne na PSČ. Dřív
    // tu byl focusField(prikazPscInput), který furt vyhrával nad novým
    // skokem na Ulici (viz onPick výš) — obec ztratila fokus kvůli
    // naplánovanému přeskoku na Ulici, což spustilo TENHLE blur, a ten
    // fokus poslal zpátky na PSČ (ověřeno, byla to regrese).
    if(prikazMestoInput.value.trim()) checkStreetsAndAdvance();
  });

  // PSČ → Ulice (odemkne pole, viz checkStreetsAndAdvance výš).
  advanceOnEnter(prikazPscInput);
  attachConfirmChip(prikazPscInput, prikazPscList, ()=> checkStreetsAndAdvance());
  prikazPscInput.addEventListener('blur', ()=>{
    if(prikazPscInput.value.trim()) checkStreetsAndAdvance();
  });

  const debouncedUliceSearch = debounce(async ()=>{
    if(!selectedMesto || prikazUliceInput.disabled) return;
    const q = prikazUliceInput.value.trim();
    if(q.length < 2){ prikazUliceList.classList.remove('open'); return; }
    const { items, error } = await mapySuggest(q, ['regional.street'], { locality: selectedMesto.name, limit: 8 });
    renderSuggestList(prikazUliceList, items, (item)=>{
      prikazUliceInput.value = item.name;
      focusField(prikazCisloDomuInput);
    }, error);
  }, 400);
  advanceOnEnter(prikazUliceInput);
  prikazUliceInput.addEventListener('input', debouncedUliceSearch);
  prikazUliceInput.addEventListener('blur', ()=>{
    setTimeout(()=> prikazUliceList.classList.remove('open'), 150);
    if(!prikazUliceInput.disabled && prikazUliceInput.value.trim()) focusField(prikazCisloDomuInput);
  });

  // Č.p. → Datum dostavení se (jen u Výzvy — jinde je pole skryté, takže
  // se prostě zavře klávesnice a strážník si dialog jen vizuálně zkontroluje).
  advanceOnEnter(prikazCisloDomuInput);
  attachConfirmChip(prikazCisloDomuInput, prikazCisloDomuList, ()=>{
    if(prikazMode === 'vyzva') focusField(prikazVyzvaDatumInput);
  });
  prikazCisloDomuInput.addEventListener('blur', ()=>{
    if(prikazMode === 'vyzva' && prikazCisloDomuInput.value.trim()) focusField(prikazVyzvaDatumInput);
  });

  // Datum → Čas od → Čas do (Čas od/do mají už přednastavené 8:00/16:00 —
  // viz reset v openPrikazModal — takže tady stačí jen zvolit, a je to
  // poslední krok řetězce, po němž appka nechává jen vizuální kontrolu
  // celého dialogu.
  prikazVyzvaDatumInput.addEventListener('change', ()=>{
    if(prikazVyzvaDatumInput.value) focusField(prikazVyzvaCasOdInput);
  });
  prikazVyzvaCasOdInput.addEventListener('change', ()=>{
    if(prikazVyzvaCasOdInput.value) focusField(prikazVyzvaCasDoInput);
  });

  // Vlastní kalendář (initDatePicker výš) drží interní hodnotu v ISO
  // (RRRR-MM-DD, kvůli řazení/výpočtům jinde v appce — viz formatDateCz a
  // vyzvaDatumRaw) a v poli zobrazuje tečkovaný zápis (DD.MM.RRRR — stejný
  // formát, jaký čte i OCR sken OP a jaký appka ukládá/tiskne). Tyhle dvě
  // funkce mezi formáty převádí.
  function isoToDotted(iso){
    if(!iso) return '';
    const [y, m, d] = iso.split('-');
    if(!y || !m || !d) return '';
    return d + '.' + m + '.' + y;
  }
  function dottedToIso(dotted){
    if(!dotted) return '';
    const parts = dotted.split('.');
    if(parts.length !== 3) return '';
    const [d, m, y] = parts.map(s => s.trim());
    if(!d || !m || !y || y.length !== 4) return '';
    return y + '-' + m.padStart(2, '0') + '-' + d.padStart(2, '0');
  }

  // Jméno souboru: "Výzva/Oznámení rr-mm-dd - číslo přestupku - spz - příjmení"
  // (datum = den vygenerování dokumentu, ne den přestupku).
  function buildDocFilename(prefix, record, pachatel){
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const rrMmDd = pad(now.getFullYear() % 100) + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    const bits = [];
    if(record.noticeNumber) bits.push(record.noticeNumber);
    if(record.plate) bits.push(record.plate);
    if(pachatel && pachatel.prijmeni) bits.push(pachatel.prijmeni);
    const name = prefix + ' ' + rrMmDd + (bits.length ? ' - ' + bits.join(' - ') : '');
    return name.replace(/[\\/:*?"<>|]/g, '') + '.docx';
  }

  document.getElementById('prikazConfirmBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record) return;
    const castkaRaw = document.getElementById('prikazCastka').value.trim();

    // U příkazu na místě je částka povinná — bez ní appka neuloží a
    // rovnou skočí na pole (s číselnou klávesnicí, díky inputmode).
    if(prikazMode === 'prikaz' && castkaRaw === ''){
      const castkaInput = document.getElementById('prikazCastka');
      castkaInput.focus();
      return;
    }

    const jmeno = document.getElementById('prikazJmeno').value.trim();
    const prijmeni = document.getElementById('prikazPrijmeni').value.trim();
    // Vlastní kalendář ukládá do .value už rovnou tečkovaný formát
    // (DD.MM.RRRR) — appka ho tak i ukládá/tiskne, žádný převod netřeba.
    const narozeni = document.getElementById('prikazNarozeni').value.trim();
    const doklad = document.getElementById('prikazDoklad').value.trim();
    const mestoObec = document.getElementById('prikazMesto').value.trim();
    const psc = document.getElementById('prikazPsc').value.trim();
    const mesto = [psc, mestoObec].filter(Boolean).join(', ');
    const ulice = document.getElementById('prikazUlice').value.trim();
    const cisloDomu = document.getElementById('prikazCisloDomu').value.trim();
    const pachatel = (jmeno || prijmeni || narozeni || doklad || mesto) ? {
      jmeno: jmeno || null,
      prijmeni: prijmeni || null,
      datumNarozeni: narozeni || null,
      cisloDokladu: doklad || null,
      mesto: mesto || null,
      ulice: ulice || null,
      cisloDomu: cisloDomu || null
    } : null;

    const btn = document.getElementById('prikazConfirmBtn');
    btn.disabled = true;
    btn.textContent = 'Ukládám…';
    try{
      if(prikazMode === 'prikaz'){
        const extra = {};
        if(castkaRaw !== '' && !isNaN(Number(castkaRaw))) extra.castka = Number(castkaRaw);
        if(pachatel) extra.pachatel = pachatel;
        if(prikazPlatbaMetoda) extra.platba = prikazPlatbaMetoda;
        document.getElementById('prikazOverlay').classList.remove('open');
        await markResolved(record, 'prikaz', extra);
      } else if(prikazMode === 'vyzva'){
        document.getElementById('prikazOverlay').classList.remove('open');
        const vyzvaDatumRaw = document.getElementById('prikazVyzvaDatum').dataset.iso || '';
        const dostaveniTermin = vyzvaDatumRaw ? {
          datum: formatDateCz(vyzvaDatumRaw),
          casOd: document.getElementById('prikazVyzvaCasOd').value || null,
          casDo: document.getElementById('prikazVyzvaCasDo').value || null
        } : null;
        const filename = buildDocFilename('Výzva', record, pachatel);
        const opened = await exportVyzva(record, pachatel, filename, dostaveniTermin);
        if(opened) await markResolved(record, 'vyzva', pachatel ? { pachatel } : undefined);
      } else if(prikazMode === 'oznameni'){
        document.getElementById('prikazOverlay').classList.remove('open');
        const filename = buildDocFilename('Oznámení', record, pachatel);
        const opened = await exportOznameni(record, pachatel, filename);
        if(opened) await markResolved(record, 'oznameni', pachatel ? { pachatel } : undefined);
      }
    }catch(e){
      console.error('Označení jako dořešeno selhalo:', e);
      alert('Uložení se nezdařilo (' + e.message + '). Zkus to prosím znovu.');
      document.getElementById('prikazOverlay').classList.add('open');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Potvrdit a uložit';
    }
  });

  // ---------- Kamera + OCR pro sken MRZ (strojově čitelné zóny) OP ----------
  // Stejná logika jako v prehled-desktop.html — viz tam podrobný komentář.
  // OCR běží celé v prohlížeči (Tesseract.js, dotažený líně až při prvním
  // použití), fotka občanky nikam neodchází. Appka data VŽDY jen
  // předvyplní k ruční kontrole, nikdy je neukládá bez potvrzení.
  let mrzStream = null;
  let tesseractLoadPromise = null;

  function loadTesseract(){
    if(window.Tesseract) return Promise.resolve();
    if(tesseractLoadPromise) return tesseractLoadPromise;
    tesseractLoadPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Nepodařilo se načíst OCR knihovnu — zkontroluj připojení k internetu.'));
      document.head.appendChild(s);
    });
    return tesseractLoadPromise;
  }

  async function openMrzCamera(){
    const overlay = document.getElementById('mrzCameraOverlay');
    const video = document.getElementById('mrzVideo');
    const status = document.getElementById('mrzStatus');
    status.textContent = '';
    overlay.classList.add('open');
    try{
      mrzStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } },
        audio:false
      });
      video.srcObject = mrzStream;
      await video.play().catch(()=>{});
    }catch(e){
      status.textContent = 'Kameru se nepodařilo spustit (' + e.message + ').';
    }
  }

  function closeMrzCamera(){
    if(mrzStream){
      mrzStream.getTracks().forEach(t => t.stop());
      mrzStream = null;
    }
    document.getElementById('mrzVideo').srcObject = null;
    document.getElementById('mrzCameraOverlay').classList.remove('open');
  }

  document.getElementById('prikazScanBtn').addEventListener('click', openMrzCamera);
  document.getElementById('mrzCancelBtn').addEventListener('click', closeMrzCamera);

  // Mapa pro odstranění diakritiky BEZ změny délky řetězce — viz
  // podrobný komentář u stejné logiky v prehled-desktop.html.
  const OP_DIACRITICS_MAP = {
    'Á':'A','Č':'C','Ď':'D','É':'E','Ě':'E','Í':'I','Ň':'N','Ó':'O','Ř':'R','Š':'S','Ť':'T','Ú':'U','Ů':'U','Ý':'Y','Ž':'Z',
    'á':'a','č':'c','ď':'d','é':'e','ě':'e','í':'i','ň':'n','ó':'o','ř':'r','š':'s','ť':'t','ú':'u','ů':'u','ý':'y','ž':'z'
  };
  function stripDiacriticsSameLength(s){
    return s.split('').map(ch => OP_DIACRITICS_MAP[ch] || ch).join('');
  }

  function captureAfterLabel(rawText, normText, labelRegex, valueRegex, windowLen){
    const m = labelRegex.exec(normText);
    if(!m) return null;
    const start = m.index + m[0].length;
    const windowNorm = normText.slice(start, start + (windowLen || 40));
    const windowOrig = rawText.slice(start, start + (windowLen || 40));
    const vm = valueRegex.exec(windowNorm);
    if(!vm) return null;
    return windowOrig.slice(vm.index, vm.index + vm[0].length).trim();
  }

  // Rozparsuje syrový OCR text z PŘEDNÍ strany občanky — viz podrobný
  // komentář u stejné funkce v prehled-desktop.html.
  // OCR čte jméno/příjmení z OP velkými písmeny (JURAČKA) — appka je pro
  // pole formuláře převede na "První velké, zbytek malá" (Juračka).
  function toNameCase(s){
    if(!s) return s;
    return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
  }

  // Živé psaní do Jméno/Příjmení — první písmeno se samo přehodí na
  // velké, zbytek se nechává tak, jak strážník napsal (na rozdíl od
  // toNameCase výše, která se používá po skenu OP a shazuje zbytek
  // na malá písmena — u ručního psaní by to bylo otravné).
  function capitalizeFirstLetterLive(input){
    input.addEventListener('input', ()=>{
      const v = input.value;
      if(!v) return;
      const capitalized = v.charAt(0).toUpperCase() + v.slice(1);
      if(capitalized === v) return;
      const pos = input.selectionStart;
      input.value = capitalized;
      input.setSelectionRange(pos, pos);
    });
  }
  capitalizeFirstLetterLive(document.getElementById('prikazJmeno'));
  capitalizeFirstLetterLive(document.getElementById('prikazPrijmeni'));

  function parseOpFront(rawText){
    console.log('OP OCR raw text:', rawText); // pro ladění při špatném rozpoznání — viz DevTools konzole

    const norm = stripDiacriticsSameLength(rawText).toUpperCase();

    const cisloDokladu = captureAfterLabel(
      rawText, norm,
      /CISLO\s*DOKLADU|DOCUMENT\s*NO\.?/,
      /\d{6,9}/,
      30
    );
    const datumNarozeniRaw = captureAfterLabel(
      rawText, norm,
      /DATUM\s*NAROZENI|DATE\s*OF\s*BIRTH/,
      /\d{1,2}\s*\.\s*\d{1,2}\s*\.\s*\d{4}/,
      40
    );
    const prijmeni = captureAfterLabel(
      rawText, norm,
      /PRIJMENI\s*\/?\s*SURNAME/,
      /[A-Z][A-Z\-]{1,25}/,
      40
    );
    const jmeno = captureAfterLabel(
      rawText, norm,
      /JMENO\s*\/?\s*GIVEN\s*NAMES?/,
      /[A-Z][A-Z\-]{1,25}/,
      40
    );

    if(!cisloDokladu && !datumNarozeniRaw && !prijmeni && !jmeno) return null;
    return {
      jmeno: jmeno || null,
      prijmeni: prijmeni || null,
      datumNarozeni: datumNarozeniRaw ? datumNarozeniRaw.replace(/\s+/g, '') : null,
      cisloDokladu: cisloDokladu || null
    };
  }

  document.getElementById('mrzShootBtn').addEventListener('click', async ()=>{
    const video = document.getElementById('mrzVideo');
    const status = document.getElementById('mrzStatus');
    const shootBtn = document.getElementById('mrzShootBtn');
    if(!video.videoWidth){
      status.textContent = 'Kamera ještě není připravená, zkus to za chvíli.';
      return;
    }

    shootBtn.disabled = true;
    status.textContent = 'Načítám OCR knihovnu…';
    try{
      await loadTesseract();

      // Ořízne se stejná oblast, kterou appka vizuálně ukazuje jako
      // vodítko (skoro celý snímek s malým okrajem) — souřadnice musí
      // odpovídat .mrz-camera-guide v CSS výše.
      const vw = video.videoWidth, vh = video.videoHeight;
      const cropX = Math.round(vw * 0.04);
      const cropW = Math.round(vw * 0.92);
      const cropY = Math.round(vh * 0.08);
      const cropH = Math.round(vh * 0.84);

      const canvas = document.createElement('canvas');
      canvas.width = cropW; canvas.height = cropH;
      canvas.getContext('2d').drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      status.textContent = 'Rozpoznávám text…';
      // Čeština (ne MRZ zóna) — běžný tiskový font s diakritikou, proto
      // český jazykový model a bez omezení na znakovou sadu.
      const result = await window.Tesseract.recognize(canvas, 'ces');
      const rawText = (result && result.data && result.data.text) || '';
      const parsed = parseOpFront(rawText);

      if(!parsed){
        status.textContent = 'Nepodařilo se rozpoznat údaje — zkus to znovu, blíž, rovněji a s lepším osvětlením.';
        shootBtn.disabled = false;
        return;
      }

      if(parsed.jmeno) document.getElementById('prikazJmeno').value = toNameCase(parsed.jmeno);
      if(parsed.prijmeni) document.getElementById('prikazPrijmeni').value = toNameCase(parsed.prijmeni);
      if(parsed.datumNarozeni) document.getElementById('prikazNarozeni')._setDatePickerIso(dottedToIso(parsed.datumNarozeni));
      if(parsed.cisloDokladu) document.getElementById('prikazDoklad').value = parsed.cisloDokladu;

      const note = document.getElementById('prikazScanNote');
      note.style.display = 'block';
      note.style.color = 'var(--bad)';
      note.textContent = 'Zkontroluj správnost všech polí.';

      closeMrzCamera();
    }catch(e){
      console.error('OCR skenu OP selhalo:', e);
      status.textContent = 'Rozpoznání se nezdařilo (' + e.message + ').';
    }finally{
      shootBtn.disabled = false;
    }
  });

  document.getElementById('menuDomluvaBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record) return;
    document.getElementById('resolveMenuOverlay').classList.remove('open');
    const btn = document.getElementById('menuDomluvaBtn');
    btn.disabled = true;
    btn.textContent = 'Ukládám…';
    try{
      await markResolved(record, 'domluva');
    }catch(e){
      console.error('Označení jako dořešeno selhalo:', e);
      btn.disabled = false;
      btn.textContent = 'Domluva (chyba, zkuste znovu)';
    }
  });

  // Sdílená logika stažení fotek ze subkolekce — volá ji jak automatické
  // otevření detailu (viz openDetail), tak ruční klik na tlačítko "Foto"
  // (např. po chybě, kdy je potřeba zkusit znovu).
  async function loadAndShowPhotos(record){
    const photoWrap = document.getElementById('photoWrap');
    const photoToggleBtn = document.getElementById('photoToggleBtn');
    photoToggleBtn.disabled = true;
    photoToggleBtn.textContent = 'Načítám…';
    try{
      const doc = await db.collection('prestupky').doc(record.id).collection('data').doc('photos').get();
      const data = doc.exists ? doc.data() : null;
      const photos = (data && data.photos) || [];
      const mime = (data && data.photoMime) || 'image/jpeg';
      record._resolvedPhotos = photos;
      record._resolvedMime = mime;
      renderPhotoGallery(record, photos, mime);
      photoToggleBtn.textContent = 'Foto' + (photos.length > 1 ? ' (' + photos.length + ')' : '');
      photoToggleBtn.disabled = false;
      photoWrap.classList.add('open');
    }catch(e){
      console.error('Načtení fotek selhalo:', e);
      photoToggleBtn.textContent = 'Foto (chyba)';
      photoToggleBtn.disabled = false;
    }
  }

  document.getElementById('photoToggleBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record) return;
    const photoWrap = document.getElementById('photoWrap');

    if(record._resolvedPhotos){
      photoWrap.classList.toggle('open');
      return;
    }

    await loadAndShowPhotos(record);
  });

  document.getElementById('detailCloseBtn').addEventListener('click', ()=>{
    show('list');
  });

})();
</script>
<script>
  // Registrace service workeru jen kvůli instalovatelnosti appky na
  // Androidu (viz sw.js) — na iOS Safari se appka na plochu přidává
  // stejně jako dřív.
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>
</body>
</html>
