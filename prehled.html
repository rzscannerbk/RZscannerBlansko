<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RZ Scanner — Přehled</title>
<meta name="theme-color" content="#0A0C10">
<meta name="apple-mobile-web-app-title" content="Přehled">
<link rel="manifest" href="manifest-prehled.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" onerror="console.warn('JSZip se nenačetl — export Oznámení jako .docx nebude funkční.')"></script>
<!--
  Tisk na Epson TM-P20II přes ePOS-Print XML — stejná logika jako v
  index.html, žádný externí SDK soubor tu není potřeba (viz komentář
  u printViaEpson() níže).
-->
<style>
  :root{
    --asphalt:#0A0C10;
    --asphalt-2:#14171D;
    --asphalt-3:#1D2129;
    --ink:#111214;
    --amber:#FFB020;
    --amber-dim:#7A5713;
    --text:#ECEDEF;
    --muted:#8B92A0;
    --good:#33D399;
    --bad:#FF6058;
    --line:#262B33;
  }
  /* Stejný skrytý světlý režim jako v index.html — volba se přebírá přes
     localStorage (rzTheme), gesto se ovládá jen na úvodní obrazovce
     appky, tady se jen respektuje. */
  html.light-theme{
    --asphalt:#F4F5F7;
    --asphalt-2:#FFFFFF;
    --asphalt-3:#ECEDF0;
    --ink:#F4F5F7;
    --amber:#C77800;
    --amber-dim:#E8B26B;
    --text:#14161A;
    --muted:#5B6472;
    --good:#0E9A6E;
    --bad:#D4342A;
    --line:#DDE1E6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow-x:hidden; max-width:100vw;}
  body{
    margin:0; background:var(--asphalt); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
  }
  #app{min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden;}
  .screen{position:fixed; top:0; left:0; right:0; height:calc(var(--app-height, 100dvh)); display:none; flex-direction:column; overflow-x:hidden;}
  .screen.active{display:flex;}

  h1,h2{font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.02em; margin:0;}

  .btn{
    padding:12px 20px; border-radius:14px; font-size:14.5px; font-weight:600;
    border:none; cursor:pointer; font-family:inherit;
  }
  .btn-primary{background:var(--amber); color:#241a00;}
  .btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--text);}
  .submit-note{margin-top:10px; text-align:center; font-size:12.5px; font-family:'Roboto Mono',monospace; display:none;}
  .submit-note.ok{color:var(--good);}
  .submit-note.err{color:var(--bad);}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.5; pointer-events:none;}

  /* ---------- LOGIN ---------- */
  #loginScreen{align-items:center; justify-content:center; padding:32px;}
  #loginScreen .login-box{width:100%; max-width:340px;}
  #loginScreen h1{font-size:22px; text-transform:uppercase; margin-bottom:6px;}
  #loginScreen p.hint{color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 24px;}
  .field{background:var(--asphalt-2); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:14px;}
  .field label{display:block; font-size:10.5px; color:var(--muted); font-family:'Roboto Mono',monospace; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px;}
  .field input{width:100%; background:transparent; border:none; color:var(--text); font-size:15px; font-family:'Inter',sans-serif; padding:2px 0; outline:none;}
  #loginError{color:var(--bad); font-size:12.5px; margin:10px 0 0; display:none; line-height:1.4;}

  /* ---------- LIST ---------- */
  #listScreen{overflow:hidden;}
  .list-top{
    display:flex; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 14px; background:var(--asphalt-2);
    border-bottom:1px solid var(--line);
  }
  .list-top h1{
    font-size:17px; text-transform:uppercase; text-align:center;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .list-bottom-bar{
    flex-shrink:0;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 14px);
    background:var(--asphalt-2); border-top:1px solid var(--line);
  }
  .list-bottom-btn{
    flex:1 1 0; padding:12px 10px; border-radius:10px; font-family:'Inter',sans-serif;
    font-weight:600; font-size:14px; cursor:pointer; text-decoration:none; text-align:center;
    border:1.5px solid var(--line); color:var(--text); background:transparent;
  }
  .list-bottom-btn.print{background:#5B8DEF; border-color:#5B8DEF; color:#000;}
  .list-bottom-btn.oznameni{background:#5B8DEF; border-color:#5B8DEF; color:#000;}
  .list-bottom-btn.resolve{background:var(--good); border-color:var(--good); color:#000;}
  .list-bottom-btn.resolve[disabled]{background:var(--good); color:#000; opacity:1;}
  .list-bottom-btn.back{background:var(--amber); border-color:var(--amber); color:#241a00;}
  .list-bottom-btn:active{transform:scale(.96);}
  /* "Zpět" na seznamu je <a href>, ne <button> — bez tohohle by iOS po
     zhruba půl vteřině podržení sám spustil svoje kontextové menu
     (Otevřít v nové kartě / Kopírovat odkaz / Sdílet), dřív než by stihlo
     naběhnout těch 4 s pro skryté odhlášení, a rozbilo by to celé gesto. */
  #listBackBtn{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  /* Na seznamu (na rozdíl od detailu, kde je "Zpět" jedno ze tří tlačítek
     vedle sebe) je "Zpět" jediné tlačítko v liště — nemá tedy smysl ho
     roztahovat na celou šířku jako v detailu, stačí na velikost textu,
     na střed. Navíc plave přímo nad obsahem (bez vlastního pozadí/pruhu),
     ať pod ním není zbytečný černý pás — seznam pod ním prosvítá a jde
     skrz něj i normálně scrollovat. */
  #listScreen .list-bottom-bar{
    justify-content:center; position:absolute; left:0; right:0; bottom:0;
    background:none; border-top:none; pointer-events:none;
    padding:0 18px calc(env(safe-area-inset-bottom,0px) + 14px);
  }
  #listScreen .list-bottom-btn.back{
    flex:0 0 auto; padding:12px 34px; pointer-events:all;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #listScreen{position:relative;}
  .confirm-overlay{
    display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55);
    align-items:center; justify-content:center; padding:24px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    background:var(--asphalt-2); border:1px solid var(--line); border-radius:16px;
    padding:22px 20px; max-width:320px; width:100%; text-align:center;
  }
  .confirm-text{font-size:15.5px; color:var(--text); margin-bottom:18px; line-height:1.4;}
  .confirm-btns{display:flex; gap:12px;}
  .confirm-btns-col{flex-direction:column;}
  .confirm-btn{
    flex:1; padding:11px 12px; border-radius:10px; font-family:'Inter',sans-serif;
    font-weight:600; font-size:14.5px; cursor:pointer; line-height:1.3;
  }
  .confirm-no{background:transparent; border:1.5px solid var(--line); color:var(--text);}
  .confirm-yes{background:#2F6FED; border:1.5px solid #2F6FED; color:#fff;}
  .confirm-cancel{background:transparent; border:none; color:var(--muted); font-size:13.5px; margin-top:4px;}

  /* ---------- Modál "Příkaz na místě" (částka + pachatel) ---------- */
  .prikaz-box{
    background:var(--asphalt-2); border:1px solid var(--line); border-radius:16px;
    padding:22px 20px; max-width:400px; width:100%; text-align:left; max-height:86vh; overflow-y:auto;
  }
  .prikaz-box h3{font-size:16px; margin:0 0 16px; color:var(--text); text-align:center;}
  .prikaz-box .field{margin-bottom:12px;}
  .prikaz-row2{display:flex; gap:10px;}
  .prikaz-row2 .field{flex:1; min-width:0;}
  .prikaz-row-address{display:flex; gap:10px;}
  .prikaz-street-field{flex:4; min-width:0;}
  .prikaz-housenum-field{flex:1; min-width:0;}
  .prikaz-suggest-wrap{position:relative;}
  .prikaz-suggest-list{
    display:none; position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:30;
    background:var(--asphalt-4); border:1px solid var(--line); border-radius:9px;
    max-height:190px; overflow-y:auto; box-shadow:0 10px 26px rgba(0,0,0,.45);
  }
  .prikaz-suggest-list.open{display:block;}
  .prikaz-suggest-item{padding:11px 12px; font-size:13.5px; color:var(--text); cursor:pointer; border-bottom:1px solid var(--line);}
  .prikaz-suggest-item:last-child{border-bottom:none;}
  .prikaz-suggest-item:active{background:var(--asphalt-3);}
  .prikaz-suggest-item .sub{display:block; font-size:11px; color:var(--muted); margin-top:1px;}
  .prikaz-box input:disabled{opacity:.4;}
  .prikaz-pachatel-head{display:flex; align-items:center; justify-content:space-between; margin:14px 0 10px;}
  .prikaz-pachatel-head span{font-size:12.5px; color:var(--muted); font-weight:600;}
  .prikaz-scan-btn{
    display:flex; align-items:center; gap:6px; background:transparent; border:1.5px solid var(--line);
    color:var(--text); border-radius:9px; padding:8px 13px; font-size:13px; font-family:inherit;
    cursor:pointer; font-weight:600;
  }
  .prikaz-scan-btn:active{border-color:#2F6FED; color:#2F6FED;}
  .prikaz-scan-btn .cam-icon{font-size:16px; line-height:1;}
  .prikaz-note{font-size:11.5px; color:var(--faint); margin:-4px 0 14px; line-height:1.4; text-align:center;}
  .prikaz-actions{display:flex; gap:12px; margin-top:6px;}

  /* ---------- Kamera pro sken MRZ (strojově čitelné zóny) občanky ---------- */
  .mrz-camera-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:120;
    align-items:center; justify-content:center; flex-direction:column; padding:16px;
  }
  .mrz-camera-overlay.open{display:flex;}
  .mrz-camera-frame{position:relative; width:100%; max-width:520px; border-radius:14px; overflow:hidden; background:#000;}
  .mrz-camera-frame video{width:100%; display:block;}
  .mrz-camera-guide{
    position:absolute; left:4%; right:4%; top:8%; bottom:8%;
    border:2px dashed rgba(255,255,255,.85); border-radius:10px; pointer-events:none;
  }
  .mrz-camera-guide::after{
    content:'Zarovnej sem celou přední stranu občanky'; position:absolute; left:0; right:0; top:-24px;
    text-align:center; color:#fff; font-size:11.5px; text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  .mrz-camera-actions{display:flex; gap:14px; margin-top:16px; width:100%; max-width:520px;}
  .mrz-camera-actions button{
    flex:1; padding:13px 16px; border-radius:10px; font-family:inherit; font-weight:600; font-size:14.5px; cursor:pointer;
  }
  .mrz-shoot-btn{background:#2F6FED; border:1.5px solid #2F6FED; color:#fff;}
  .mrz-cancel-btn{background:transparent; border:1.5px solid rgba(255,255,255,.4); color:#fff;}
  .mrz-camera-status{color:#fff; font-size:13px; margin-top:12px; min-height:18px; text-align:center;}
  .detail-fixed-bottom{
    flex-shrink:0;
    position:absolute; left:0; right:0; bottom:0;
    background:none; border-top:none; pointer-events:none;
  }
  .detail-fixed-bottom .list-bottom-bar{
    position:static; background:transparent; border-top:none;
  }
  .detail-fixed-bottom .list-bottom-btn{
    pointer-events:all;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .detail-fixed-bottom .submit-note{margin:10px 18px 0;}
  .search-row{padding:14px 18px 0;}
  .search-row input{
    width:100%; background:var(--asphalt-2); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; color:var(--text); font-size:16px; font-family:inherit; outline:none;
  }
  #listBody{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:14px 18px 76px;}
  .list-empty{text-align:center; color:var(--muted); font-size:13.5px; margin-top:60px; line-height:1.6;}
  .record-item{
    position:relative; background:rgba(91,141,239,.07); border:1.5px solid rgba(91,141,239,.55);
    border-radius:14px; padding:14px 16px 12px; margin-bottom:14px; cursor:pointer; overflow:hidden;
  }
  .record-item.boticka{background:rgba(255,176,32,.07); border-color:rgba(255,176,32,.55);}
  .record-item:active{transform:scale(.98);}
  .record-item.resolved{background:rgba(51,211,153,.07); border-color:rgba(51,211,153,.5); opacity:.75;}
  .record-top-row{display:flex; flex-direction:column; gap:6px;}
  .record-notice-number{
    font-family:'Roboto Mono',monospace; font-size:10px; color:var(--muted);
    letter-spacing:.03em; white-space:nowrap;
  }
  .record-plate-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .record-plate{font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; letter-spacing:.05em;}
  .record-resolved-badge{
    font-size:10px; font-weight:700; color:var(--good); text-transform:uppercase; letter-spacing:.05em;
    border:1px solid var(--good); border-radius:20px; padding:3px 8px;
  }
  .record-doctype-badge{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:3px 8px; border-radius:20px; color:#5B8DEF; border:1px solid #5B8DEF;
  }
  .record-doctype-badge.boticka{color:var(--amber); border-color:var(--amber);}
  .record-meta{
    font-family:'Roboto Mono',monospace; font-size:11.5px; color:var(--muted);
    margin-top:8px; letter-spacing:.02em; overflow-wrap:anywhere;
  }
  .record-offense{
    font-size:13.5px; color:var(--text); margin-top:10px; padding-top:10px;
    border-top:1px solid var(--line); line-height:1.4; overflow-wrap:anywhere;
  }
  .record-footer{
    display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:4px 12px;
    margin-top:10px; padding-top:9px; border-top:1px solid var(--line);
  }
  .record-officer{font-size:11.5px; color:var(--text); font-weight:600;}
  .record-submitted{font-size:10.5px; color:var(--muted); overflow-wrap:anywhere; text-align:right;}

  /* ---------- DETAIL ---------- */
  #detailScreen{background:#111; position:relative;}
  .detail-top{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 14px; background:var(--asphalt-2);
    border-bottom:1px solid var(--line);
  }
  .detail-top span{font-size:18px !important; letter-spacing:.08em;}
  #detailPreviewWrap{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#3a3a3a; padding:22px 16px 90px;}

  /* ---------- NOTICE CARD (same look used in the app's own preview) ---------- */
  .notice-card{
    background:#ffffff; color:#141414; border-radius:14px; padding:30px 22px 26px;
    font-family:'Inter',sans-serif; text-align:center; max-width:440px; margin:0 auto;
  }
  .notice-title{font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; letter-spacing:.03em; margin:0 0 4px; text-transform:uppercase;}
  .notice-subtitle{color:#777; font-size:12.5px; margin:0 0 18px;}
  .notice-subtitle-boticka{font-size:18.75px; font-weight:700; color:#333;}
  .notice-number{color:#666; font-size:22px; letter-spacing:.03em; margin:-10px 0 18px; font-weight:800;}
  .notice-officer{font-weight:600; font-size:11px; color:#555; margin-bottom:4px;}
  .notice-label{color:#999; font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px;}
  .notice-platebox{
    display:inline-block; border:1.6px solid #181818; border-radius:10px;
    padding:12px 26px; font-family:'Oswald',sans-serif; font-weight:700; font-size:30px;
    letter-spacing:.04em; margin-bottom:16px;
  }
  .notice-vehicle{font-size:14px; color:#555; margin:-8px 0 18px; font-weight:600;}
  .notice-datetime{font-size:15.5px; margin-bottom:20px; color:#222;}
  .notice-section{margin-bottom:16px;}
  .notice-heading{font-weight:700; font-size:12px; display:inline-block; border-bottom:1.5px solid #181818; padding-bottom:3px; margin-bottom:8px;}
  .notice-address{font-size:14.5px; color:#333;}
  .notice-offense-label{font-size:13.5px; color:#333; line-height:1.45;}
  .notice-offense-ref{font-size:12px; color:#555; margin-top:4px;}
  .notice-instructions{margin-top:18px; padding-top:14px; border-top:1px solid #eee; font-size:11.5px; line-height:1.55; color:#333; text-align:center;}
  .notice-instructions b{font-weight:700;}
  .notice-instructions .heading-caps{font-weight:700; letter-spacing:.04em; text-transform:uppercase; display:block; margin:10px 0 6px;}
  .notice-footer{margin-top:22px; padding-top:14px; border-top:1px solid #eee;}
  .notice-footer .authority{font-weight:700; font-size:10px; color:#555;}
  .notice-footer .authority-addr{font-size:9.5px; color:#999; margin-top:2px;}
  .notice-footer .authority-phone{font-size:9.5px; color:#999; margin-top:2px;}
  .notice-footer .generated-by{font-size:9.5px; color:#aaa; margin-top:10px;}

  .photo-toggle-row{text-align:center; margin-top:20px;}
  .photo-toggle-row .btn-ghost{color:#fff; border-color:rgba(255,255,255,.45);}
  .notice-photo-wrap{margin-top:14px; display:none; max-width:440px; margin-left:auto; margin-right:auto;}
  .notice-photo-wrap.open{display:block;}
  .photo-item{margin-bottom:20px;}
  .photo-item:last-child{margin-bottom:0;}
  .photo-item img{width:100%; border-radius:12px; display:block;}
  .photo-item a.download-link, .photo-item button.download-link{
    display:block; width:100%; text-align:center; margin-top:8px; font-size:12.5px;
    color:#fff; text-decoration:underline; background:none; border:none;
    font-family:inherit; cursor:pointer; padding:6px 0;
  }

</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="loginScreen" class="screen active">
    <div class="login-box">
      <h1>RZ Scanner</h1>
      <p class="hint">Přehled odeslaných přestupků. Přihlaste se svým účtem.</p>
      <div class="field"><label>E-mail</label><input type="email" id="loginEmail" autocapitalize="off" autocomplete="username"></div>
      <div class="field"><label>Heslo</label><input type="password" id="loginPassword" autocomplete="current-password"></div>
      <button class="btn btn-primary" id="loginSubmitBtn" style="width:100%;">Přihlásit se</button>
      <div id="loginError"></div>
      <a href="https://rzscannerbk.github.io/RZscannerBlansko/index.html" class="btn btn-ghost" style="width:100%; display:block; box-sizing:border-box; text-align:center; text-decoration:none; margin-top:12px;">Zpět</a>
    </div>
  </div>

  <!-- LIST -->
  <div id="listScreen" class="screen">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Hledat podle RZ, čísla, kvalifikace, strážníka, data…" autocomplete="off">
    </div>
    <div id="listBody">
      <div class="list-empty" id="listStatus">Načítám…</div>
    </div>
    <div class="list-bottom-bar">
      <a href="https://rzscannerbk.github.io/RZscannerBlansko/index.html" class="list-bottom-btn back" id="listBackBtn">Zpět</a>
    </div>
  </div>

  <!-- DETAIL -->
  <div id="detailScreen" class="screen">
    <div class="detail-top">
      <span style="font-family:'Roboto Mono',monospace; font-size:12px; color:var(--muted); letter-spacing:.05em;" id="detailPlateLabel">DETAIL</span>
    </div>
    <div id="detailPreviewWrap">
      <div id="noticeCardContainer"></div>
      <div class="photo-toggle-row" id="photoToggleRow" style="display:none;">
        <button class="btn btn-ghost" id="photoToggleBtn">Foto</button>
      </div>
      <div class="notice-photo-wrap" id="photoWrap">
        <div id="photoGallery"></div>
      </div>
    </div>
    <div class="detail-fixed-bottom">
      <div class="submit-note" id="detailNote"></div>
      <div class="list-bottom-bar">
        <button class="list-bottom-btn print" id="printBtn" title="Vytisknout">Tisk</button>
        <button class="list-bottom-btn resolve" id="resolveMenuBtn">Dořešit</button>
        <button class="list-bottom-btn back" id="detailCloseBtn">Zpět</button>
      </div>
    </div>
    <div class="confirm-overlay" id="resolveMenuOverlay">
      <div class="confirm-box">
        <div class="confirm-btns confirm-btns-col">
          <button class="confirm-btn confirm-no" id="menuOznameniBtn">Oznámení</button>

<script>
(function(){
  // ---------- Oprava výšky viewportu na iOS Safari ----------
  // Stejný fix jako v index.html — iOS Safari nespolehlivě počítá výšku
  // pro position:fixed;inset:0, po sbalení adresního řádku appka
  // nezaplní celou obrazovku a dole zůstane černá mezera. JS změří
  // skutečnou výšku viditelné plochy a uloží ji do CSS proměnné
  // --app-height, na kterou jsou obrazovky (.screen) navázané.
  function setAppHeight(){
    const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', ()=>setTimeout(setAppHeight, 100));
  window.addEventListener('load', setAppHeight);
  document.addEventListener('pageshow', setAppHeight);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setAppHeight(); });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', setAppHeight);
  }
  // Appka spuštěná z plochy (standalone) hlásí při startu na iOS občas
  // ještě neustálenou výšku (probíhá spouštěcí animace) — přeměříme
  // ještě několikrát s prodlevou, ať se appka doopravdy natáhne na celou
  // obrazovku i po doběhnutí přechodu.
  [50, 150, 300, 600, 1000, 1500].forEach(ms => setTimeout(setAppHeight, ms));

  // Respektuje volbu tématu nastavenou v index.html (4s podržení loga na
  // úvodní obrazovce appky) — samotné gesto tady není, jen se drží stejná
  // paleta jako zbytek appky.
  try{
    if(localStorage.getItem('rzTheme') === 'light'){
      document.documentElement.classList.add('light-theme');
    }
  }catch(e){}

  const screens = {
    login: document.getElementById('loginScreen'),
    list: document.getElementById('listScreen'),
    detail: document.getElementById('detailScreen'),
  };
  function show(name){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // ---------- Firebase ----------
  const firebaseConfig = {
    apiKey: "AIzaSyCXin_qIc785nooY8Qqejt5BU_X6f9it6c",
    authDomain: "rz-scanner.firebaseapp.com",
    projectId: "rz-scanner",
    storageBucket: "rz-scanner.firebasestorage.app",
    messagingSenderId: "299287620862",
    appId: "1:299287620862:web:bd3b7b2d7304ecb27149af",
    measurementId: "G-0V2HSNXW2L"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let allRecords = [];

  // ---------- Auth ----------
  // Proklik z RZ Scanneru (upozornění na duplicitní RZ) může appku otevřít
  // s parametrem ?q=<RZ> v URL — předvyplní pole hledání, ať se rovnou
  // zobrazí ten (nebo ty) záznam(y), na které se to upozornění vztahovalo.
  try{
    const q = new URLSearchParams(window.location.search).get('q');
    if(q) document.getElementById('searchInput').value = q;
  }catch(e){}

  auth.onAuthStateChanged(user=>{
    if(user){
      show('list');
      loadRecords();
    } else {
      show('login');
    }
  });

  document.getElementById('loginSubmitBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    if(!email || !password){
      errEl.textContent = 'Vyplňte e-mail i heslo.';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('loginSubmitBtn');
    btn.disabled = true;
    try{
      await auth.signInWithEmailAndPassword(email, password);
      document.getElementById('loginPassword').value = '';
    }catch(e){
      errEl.textContent = 'Přihlášení se nezdařilo — zkontrolujte e-mail a heslo.';
      errEl.style.display = 'block';
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById('loginPassword').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('loginSubmitBtn').click();
  });

  // Skryté odhlašovací gesto: podržení tlačítka "Zpět" na seznamu 4 s.
  // Žádné tlačítko odhlášení v UI záměrně není — appka je sdílená mezi
  // strážníky na jednom telefonu, takže odhlášení nemá být na první pohled
  // dostupné/omylem stisknutelné. Tlačítko "Zpět" je normálně odkaz (běžný
  // klik/tap appku opustí zpátky na RZ Scanner) — dlouhé podržení tenhle
  // odkaz "překryje" a místo přechodu appku rovnou odhlásí.
  (function setupHiddenLogout(){
    const btn = document.getElementById('listBackBtn');
    if(!btn) return;
    let holdTimer = null;
    let triggered = false;
    function start(){
      triggered = false;
      cancel();
      holdTimer = setTimeout(()=>{ triggered = true; auth.signOut(); }, 4000);
    }
    function cancel(){
      if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    }
    btn.addEventListener('touchstart', start, { passive: true });
    btn.addEventListener('touchend', cancel);
    btn.addEventListener('touchcancel', cancel);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', cancel);
    btn.addEventListener('mouseleave', cancel);
    btn.addEventListener('click', (e)=>{
      if(triggered){
        e.preventDefault();
        triggered = false;
      }
    });
  })();

  // ---------- List ----------
  // Real-time listener — appka se sama překreslí, kdykoliv se ve Firestore
  // něco změní (nový přestupek odeslaný z RZ Scanner, dořešení odjinud,
  // změna z desktopové appky apod.), bez nutnosti stránku ručně obnovovat.
  // onSnapshot se navíc jednou zavolá hned na začátku se stávajícími daty,
  // takže nahrazuje i původní jednorázové načtení.
  function loadRecords(){
    const statusEl = document.getElementById('listStatus');
    statusEl.style.display = 'block';
    statusEl.textContent = 'Načítám…';
    let first = true;
    let t0 = performance.now();
    db.collection('prestupky').orderBy('createdAt', 'desc').limit(500)
      .onSnapshot(snap=>{
        const t1 = performance.now();
        allRecords = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        // Temporary diagnostics — helps pin down whether the slowness is
        // the network fetch itself or something else, and whether older
        // records still carrying inline photos (from before photos moved
        // to a subcollection) are the culprit.
        let legacyPhotoBytes = 0, legacyCount = 0;
        allRecords.forEach(r=>{
          if(r.photos && r.photos.length){
            legacyCount++;
            legacyPhotoBytes += r.photos.reduce((s,p)=> s + (p ? p.length : 0), 0);
          } else if(r.photoBase64){
            legacyCount++;
            legacyPhotoBytes += r.photoBase64.length;
          }
        });
        const totalKB = Math.round(JSON.stringify(snap.docs.map(d=>d.data())).length / 1024);
        const legacyKB = Math.round(legacyPhotoBytes / 1024);
        console.log('[živý přenos]', first ? 'počáteční načtení' : 'změna dat', '—',
          Math.round(t1-t0), 'ms, počet záznamů:', allRecords.length,
          ', celková velikost payloadu:', totalKB, 'KB, z toho staré vložené fotky:', legacyKB, 'KB v', legacyCount, 'záznamech');
        first = false;

        renderList(document.getElementById('searchInput').value);

        const t2 = performance.now();
        const diag = document.createElement('div');
        diag.style.cssText = 'text-align:center; color:var(--muted); font-size:10.5px; font-family:monospace; margin-top:14px; opacity:.7; overflow-wrap:anywhere;';
        diag.textContent = 'Diagnostika: fetch ' + Math.round(t1-t0) + ' ms, render ' + Math.round(t2-t1) + ' ms, ' +
          allRecords.length + ' záznamů, ' + totalKB + ' KB celkem (' + legacyKB + ' KB staré fotky v ' + legacyCount + ' záznamech)';
        document.getElementById('listBody').appendChild(diag);

        t0 = performance.now();
      }, e=>{
        console.error('Načtení přehledu selhalo:', e);
        statusEl.textContent = 'Načtení se nezdařilo (' + (e && e.message ? e.message : 'chyba sítě') + ').';
        statusEl.style.display = 'block';
      });
  }

  function formatCreatedAt(ts){
    if(!ts || !ts.toDate) return '';
    const d = ts.toDate();
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function formatDateCz(iso){
    if(!iso) return '—';
    const parts = iso.split('-');
    if(parts.length !== 3) return iso;
    const [y, m, d] = parts.map(Number);
    if(!y || !m || !d) return iso;
    return d + '. ' + m + '. ' + y;
  }

  function escapeHtml(s){
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function buildNoticeHtml(record){
    const isBoticka = record.docType === 'boticka';
    const addressBlock = record.address ? `
      <div class="notice-section">
        <div class="notice-heading">Místo přestupku</div>
        <div class="notice-address">${escapeHtml(record.address)}</div>
      </div>` : '';
    const offenseBlock = record.offenseLabel ? `
      <div class="notice-section">
        <div class="notice-heading">Právní kvalifikace přestupku</div>
        <div class="notice-offense-label">${escapeHtml(record.offenseLabel)}</div>
        ${record.offenseCitation ? `<div class="notice-offense-ref">${escapeHtml(record.offenseCitation)}</div>` : ''}
      </div>` : '';
    const numberBlock = record.noticeNumber ? `
      <div class="notice-number"><b>${escapeHtml(record.noticeNumber)}</b></div>` : '';
    const officerBlock = record.officerName ? `
      <div class="notice-officer">str. ${escapeHtml(record.officerName)}</div>` : '';
    const vehicleBlock = (record.brand || record.color) ? `
      <div class="notice-vehicle">${escapeHtml([record.brand, record.color].filter(Boolean).join(', '))}</div>` : '';
    const instructionsHtml = isBoticka ? `
          Oznamuji Vám, že na výše uvedeném vozidle byl <b>umístěn technický prostředek k zabránění odjezdu vozidla (TPZOV)</b> dle § 17a zákona č. 553/1991 Sb., o obecní policii, a to z důvodu porušení pravidel uvedených výše.
          <b style="display:block; margin:10px 0 6px;">pořízena fotodokumentace</b>
          <span class="heading-caps">Poučení</span>
          Technický prostředek bude odstraněn po projednání přestupku, nebo po zjištění totožnosti osoby, která vozidlo na místě ponechala, nebo po provedení nezbytných úkonů ke zjištění totožnosti této osoby.
        ` : `
          Dostavte se proto ve vlastním zájmu, <b>a to neprodleně</b> na Městskou policii Blansko, Sadová 2. Tuto výzvu vezměte s sebou.
          <b style="display:block; margin:10px 0 6px;">pořízena fotodokumentace</b>
          <span class="heading-caps">Poučení</span>
          Dle § 11/odst. 1 a 2, zák. 553/1991 Sb., o obecní policii je osoba povinna výzvě vyhovět. Nedostavíte-li se bez dostatečné omluvy, můžete být dle § 11/odst. 8 výše uvedeného zákona předveden(a) nebo může být přestupek oznámen příslušnému správnímu orgánu k projednání.
        `;
    return `
      <div class="notice-card">
        <div class="notice-title">${isBoticka ? 'Oznámení' : 'Výzva'}</div>
        <div class="notice-subtitle${isBoticka ? ' notice-subtitle-boticka' : ''}">${isBoticka ? 'o použití technického prostředku k zabránění odjezdu vozidla' : 'pro nepřítomného pachatele přestupku'}</div>
        ${numberBlock}
        <div class="notice-label">Registrační značka</div>
        <div class="notice-platebox">${escapeHtml(record.plate || '')}</div>
        ${vehicleBlock}
        <div class="notice-datetime">Datum: ${escapeHtml(formatDateCz(record.date))}&nbsp;&nbsp;&nbsp;Čas: ${escapeHtml(record.time || '—')}</div>
        ${addressBlock}
        ${offenseBlock}
        <div class="notice-instructions">
          ${instructionsHtml}
        </div>
        <div class="notice-footer">
          ${officerBlock}
          <div class="authority">Městská policie Blansko</div>
          <div class="authority-addr">Sadová 149/2, 678 01 Blansko</div>
          <div class="authority-phone">Tel.: 775 859 486, 516 418 418</div>
          <div class="generated-by">Vygenerováno aplikací RZ Scanner</div>
        </div>
      </div>`;
  }

  function setDetailNote(text, kind){
    const note = document.getElementById('detailNote');
    note.textContent = text;
    note.className = 'submit-note' + (kind ? ' ' + kind : '');
    note.style.display = text ? 'block' : 'none';
  }

  // ---------- Export "Oznámení přestupku" jako skutečný .docx ----------
  // Skutečný OOXML (.docx) balíček přes JSZip (CDN, žádný build krok) —
  // ne RTF ani HTML převlečené za .doc. Dvousloupcové rozvržení hlavičky
  // (adresa úřadu vlevo, č.j./vyřizuje/tel/e-mail/datum vpravo) je běžná
  // Word tabulka bez viditelných ohraničení.
  //
  // Šablona vychází z reálného vzoru "Oznámení přestupku" (Městský úřad
  // Blansko, odbor dopravy). Appka doplní jen to, co sama zná — číslo
  // jednací, strážníka, dnešní datum vytvoření, a v textu datum/čas/značku/
  // adresu (+GPS pokud je uložené)/přestupek. Údaje o provozovateli vozidla
  // (jméno, datum narození, bydliště) appka nemá k dispozici (zjišťují se
  // až lustrací na úřadě) — zůstávají prázdné pro ruční doplnění.
  const OZNAMENI_TEL = '775 859 486, 516 418 418';
  const OZNAMENI_EMAIL = 'mp@blansko.cz';

  function xmlEscape(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }

  function todayCz(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear();
  }

  function mmToTwips(mm){ return Math.round(mm * 56.6929); }
  function mmToEmu(mm){ return Math.round(mm * 36000); }

  function docxRun(text, opts){
    opts = opts || {};
    let props = '<w:sz w:val="' + (opts.size || 20) + '"/>';
    if(opts.bold) props += '<w:b/>';
    if(opts.italic) props += '<w:i/>';
    if(opts.underline) props += '<w:u w:val="single"/>';
    return '<w:r><w:rPr>' + props + '</w:rPr><w:t xml:space="preserve">' + xmlEscape(text) + '</w:t></w:r>';
  }

  function docxPara(text, opts){
    opts = opts || {};
    let pPr = '';
    if(opts.align) pPr += '<w:jc w:val="' + opts.align + '"/>';
    if(opts.pageBreakBefore) pPr += '<w:pageBreakBefore/>';
    pPr += '<w:spacing w:before="' + (opts.spacingBefore != null ? opts.spacingBefore : 0) +
           '" w:after="' + (opts.spacingAfter != null ? opts.spacingAfter : 0) + '"/>';
    const r = text != null ? docxRun(text, opts) : '';
    return '<w:p><w:pPr>' + pPr + '</w:pPr>' + r + '</w:p>';
  }

  // Odstavec "štítek" + skutečný tabulátor na pevnou pozici + "hodnota" —
  // na rozdíl od ručně vyťukaných mezer se tak hodnoty u různě dlouhých
  // štítků (RZ vs. tovární značka/barva) zarovnají přesně pod sebe.
  function docxLabelValuePara(label, value, opts){
    opts = opts || {};
    const tabPos = opts.tabPos != null ? opts.tabPos : 2600;
    const pPr = '<w:tabs><w:tab w:val="left" w:pos="' + tabPos + '"/></w:tabs>' +
      '<w:spacing w:before="' + (opts.spacingBefore != null ? opts.spacingBefore : 0) +
      '" w:after="' + (opts.spacingAfter != null ? opts.spacingAfter : 0) + '"/>';
    const labelRun = docxRun(label, { size: opts.size || 20 });
    const tabRun = '<w:r><w:rPr><w:sz w:val="' + (opts.size || 20) + '"/></w:rPr><w:tab/></w:r>';
    const valueRun = docxRun(value, { size: opts.size || 20, bold: opts.valueBold });
    return '<w:p><w:pPr>' + pPr + '</w:pPr>' + labelRun + tabRun + valueRun + '</w:p>';
  }

  function docxHeaderTable(leftLines, rightLines, leftBold){
    // Mezisloupec (gutter) mezi adresou úřadu a blokem s č.j. — bez něj by
    // sloupce splývaly těsně vedle sebe. Pravý blok tak začíná výrazně
    // víc vpravo, blíž k pravému okraji stránky.
    const leftW = 3600, gutterW = 2200, rightW = 3226;
    const cell = (lines, w, bold) => '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/></w:tcPr>' +
      lines.map(t => docxPara(t, { size: 19, spacingAfter: 20, bold: !!bold })).join('') + '</w:tc>';
    const emptyCell = (w) => '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/></w:tcPr>' + docxPara('', { size: 19 }) + '</w:tc>';
    return '<w:tbl><w:tblPr><w:tblW w:w="9026" w:type="dxa"/><w:tblBorders>' +
      '<w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/>' +
      '<w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>' +
      '<w:tblLayout w:type="fixed"/></w:tblPr>' +
      '<w:tblGrid><w:gridCol w:w="' + leftW + '"/><w:gridCol w:w="' + gutterW + '"/><w:gridCol w:w="' + rightW + '"/></w:tblGrid>' +
      '<w:tr>' + cell(leftLines, leftW, leftBold) + emptyCell(gutterW) + cell(rightLines, rightW, false) + '</w:tr></w:tbl>';
  }

  function docxNarrowBoxTable(widthMm, innerXml){
    const w = mmToTwips(widthMm);
    return '<w:tbl><w:tblPr><w:tblW w:w="' + w + '" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>' +
      '<w:top w:val="single" w:sz="8" w:color="000000"/><w:left w:val="single" w:sz="8" w:color="000000"/>' +
      '<w:bottom w:val="single" w:sz="8" w:color="000000"/><w:right w:val="single" w:sz="8" w:color="000000"/>' +
      '</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr>' +

  function docxImageParagraph(relId, widthPx, heightPx, maxWmm, maxHmm, docId, pageBreakBefore){
    const aspect = heightPx / widthPx;
    let wMm = maxWmm, hMm = wMm * aspect;
    if(hMm > maxHmm){ hMm = maxHmm; wMm = hMm / aspect; }
    const emuW = mmToEmu(wMm), emuH = mmToEmu(hMm);
    const drawing = '<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">' +
      '<wp:extent cx="' + emuW + '" cy="' + emuH + '"/>' +
      '<wp:docPr id="' + docId + '" name="Photo' + docId + '"/>' +
      '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">' +
      '<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:nvPicPr><pic:cNvPr id="' + docId + '" name="Photo' + docId + '"/><pic:cNvPicPr/></pic:nvPicPr>' +
      '<pic:blipFill><a:blip r:embed="rId' + relId + '" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>' +
      '<a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
      '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + emuW + '" cy="' + emuH + '"/></a:xfrm>' +
      '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>' +
      '</a:graphicData></a:graphic></wp:inline></w:drawing>';
    const pPr = '<w:pPr>' + (pageBreakBefore ? '<w:pageBreakBefore/>' : '') + '<w:jc w:val="center"/></w:pPr>';
    return '<w:p>' + pPr + '<w:r>' + drawing + '</w:r></w:p>';
  }

  function getImagePixelSize(dataUrl){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=> resolve({ w: img.naturalWidth || 800, h: img.naturalHeight || 600 });
      img.onerror = ()=> resolve({ w: 800, h: 600 });
      img.src = dataUrl;
    });
  }

  function base64ToUint8Array(base64){
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  // Appka ukládá do Firestore jen spojenou citaci (např. "§ 27 odst. 1
  // písm. a) — přestupek dle § 125c odst. 1 písm. k) (zákon č. 361/2000
  // Sb.)"), ne samostatně základní paragraf a sankci. Pro "Popis skutku"
  // je ale potřeba mít obě části zvlášť (základní paragraf hned za
  // "ustanovení", sankce až u "dle" na konci) — tahle funkce citaci zpět
  // rozparsuje. Funguje na starých i nových záznamech (formát citace se
  // neměnil, jen její použití v textu skutku).
  function parseOffenseCitation(citation){
    if(!citation) return null;
    const m = citation.match(/^(.+?)(?: — přestupek dle (.+?))? \(zákon č\. (.+?)\)$/);
    if(!m) return null;
    return { ref: m[1], sankce: m[2] || null, law: m[3] };
  }

  // ---------- Export "Výzva" (dopis konkrétní osobě) jako .docx ----------
  // Jiný dokument než ta "Výzva" v rámečku na Oznámení (ta je "na sklo",
  // pro nepřítomného pachatele bez known identity). Tahle jde poštou
  // konkrétní ztotožněné osobě (jméno, datum narození, adresa) — tu
  // identitu ale RZ Scanner nezná (má ji jen MP Manager po lustraci
  // v RSV), takže tahle tři pole a číslo jednací MP Manageru zůstávají
  // v dokumentu jako [DOPLNIT...] placeholder pro ruční doplnění před
  // odesláním. Termín dostavení se taky nechává na doplnění — jde
  // o právně závaznou lhůtu, kterou má určit strážník/vedoucí, ne appka
  // od oka. Vzor dodal Lukáš 28.8.2026 (Výzva_vzor.rtf).
  const VYZVA_LOCAL_PARTS = ['Těchov','Lažánky','Obůrka','Klepačov','Hořice',
    'Horní Lhota','Dolní Lhota','Olešná','Žižlavice','Skalní mlýn','Češkovice'];

  function addressForLetter(address){
    if(!address) return { city: 'Blansko', locationPhrase: '' };
    const first = address.split(',')[0].trim();
    if(VYZVA_LOCAL_PARTS.includes(first)){
      return { city: 'Blansko', locationPhrase: 'v místní části ' + first };
    }
    return { city: 'Blansko', locationPhrase: 'na ulici ' + first };
  }

  async function buildVyzvaDopisDocx(record, pachatel){
    const offenseLabel = record.offenseLabel || '';
    const offenseCitation = record.offenseCitation || '';
    const parsedCitation = parseOffenseCitation(offenseCitation);
    // mpmUdalostText (přesná cesta stromem MP Manageru, viz index.html)
    // sedí slovně nejblíž vzoru — když ho appka pro daný přestupek nezná,
    // poskládá se náhradní text stejným způsobem jako u Oznámení.
    const offenseFullText = record.mpmUdalostText ||
      ('Zákon č. 361/2000 Sb., o provozu na pozemních komunikacích – ' + offenseCitation + ' – ' + offenseLabel);
    const shortRef = parsedCitation ? parsedCitation.ref : offenseCitation;
    const loc = addressForLetter(record.address);

    // Jméno/příjmení, datum narození a adresa se vyplní, pokud je appka
    // má z dialogu "Pachatel" (ručně zadané, ze skenu OP, nebo z
    // našeptávače Mapy.com u adresy trvalého pobytu) — co chybí, zůstává
    // jako placeholder k ručnímu dopsání.
    const pachatelJmeno = pachatel ? [pachatel.jmeno, pachatel.prijmeni].filter(Boolean).join(' ') : '';
    const pachatelUlice = pachatel && (pachatel.ulice || pachatel.cisloDomu)
      ? [pachatel.ulice, pachatel.cisloDomu].filter(Boolean).join(' ')
      : '';
    const headerLeft = [
      pachatelJmeno || '[DOPLNIT JMÉNO A PŘÍJMENÍ]',
      '',
      (pachatel && pachatel.datumNarozeni) || '[DOPLNIT DATUM NAROZENÍ]',
      '',
      pachatelUlice || '[DOPLNIT ULICE A ČP]',
      '',
      (pachatel && pachatel.mesto) || '[DOPLNIT PSČ A OBEC]'
    ];

    let body = '';
    body += docxHeaderTable(
      headerLeft,
      [
        'Naše  č. j.: [DOPLNIT]',
        'Vyřizuje: str. ' + (record.officerName || ''),
        'Tel.: ' + OZNAMENI_TEL,
        'E-mail: ' + OZNAMENI_EMAIL,
        '',
        'Datum: ' + todayCz()
      ],
      true
    );
    body += docxPara('', { size: 20 });
    body += docxPara('VÝZVA', { bold: true, size: 28, align: 'center', spacingAfter: 200 });

    const text = 'Žádáme Vás, abyste se dostavil(a) dne [DOPLNIT DATUM A ČAS] na Městskou policii Blansko, Sadová č. 2, ' +
      'k podání vysvětlení podle § 11 odst. 1 zák. č. 553/91 Sb., o obecní policii, ve znění pozdějších předpisů, ve věci objasnění ' +
      'skutečností důležitých pro odhalení pachatele přestupku ' + offenseFullText + ', zjištěného dne ' + formatDateCz(record.date) +
      ' v ' + (record.time || '—') + ' hod v ' + loc.city + (loc.locationPhrase ? ', ' + loc.locationPhrase : '') +
      ', kdy došlo k porušení zákona o provozu na pozemních komunikacích' + (shortRef ? ' - ' + shortRef : '') +
      ' zák. č. 361/2000 Sb. a to řidičem vozidla ' + (record.brand ? (record.brand + ', ') : '') + 'RZ ' + (record.plate || '') + '.';
    body += docxPara(text, { size: 20, spacingAfter: 300 });

    body += docxPara('Přineste s sebou tyto doklady:', { size: 20, spacingAfter: 60 });
    body += docxPara('- tuto výzvu', { size: 20 });
    body += docxPara('- doklad totožnosti', { size: 20, spacingAfter: 300 });

    body += docxPara(
      'Nedostavíte-li se bez dostatečné omluvy nebo bez závažného důvodu, můžete být dle § 11 odst. 9 zák. č. 553/91 Sb., ' +
      'o obecní policii, ve znění pozdějších předpisů, předveden(a).',
      { size: 20, spacingAfter: 400 }
    );

    body += docxPara('Ing. Martin Lepka', { size: 20, spacingBefore: 600 });
    body += docxPara('ředitel MP Blansko', { size: 20 });

    const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<w:body>' + body +
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/>' +
      '</w:sectPr></w:body></w:document>';

    const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '</Types>';

    const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';

    const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';

    const zip = new JSZip();
    zip.file('[Content_Types].xml', contentTypes);
    zip.file('_rels/.rels', rootRels);
    zip.file('word/document.xml', documentXml);
    zip.file('word/_rels/document.xml.rels', docRels);

    return zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  async function buildOznameniDocx(record, photosB64, pachatel){
    const offenseCitation = record.offenseCitation || '';

    let body = '';

    const intro = 'Podle § 10 odst. 2 zák. č. 553/91 Sb., o obecní policii, ve znění pozdějších předpisů, ' +

    body += docxLabelValuePara('Provozovatel vozidla RZ:', record.plate || '', { size: 20, spacingAfter: 200, valueBold: true });

    }
    // Jméno/datum narození/číslo OP se vyplní, pokud je má appka
    // z dialogu "Pachatel" (ručně zadané nebo ze skenu OP).
    const pachatelJmeno = pachatel ? [pachatel.prijmeni, pachatel.jmeno].filter(Boolean).join(' ') : '';
    body += docxLabelValuePara('Příjmení a jméno:', pachatelJmeno, { size: 20, spacingAfter: 200, valueBold: true });

      body += docxLabelValuePara('Číslo OP:', pachatel.cisloDokladu, { size: 20, spacingAfter: 200, valueBold: true });
    }
    const bydlisteAdresa = pachatel && (pachatel.ulice || pachatel.cisloDomu || pachatel.mesto)
      ? [[pachatel.ulice, pachatel.cisloDomu].filter(Boolean).join(' '), pachatel.mesto].filter(Boolean).join(', ')
      : '';
    body += docxPara('Bydliště: ' + bydlisteAdresa, { size: 20, spacingAfter: 200 });

    body += docxPara('Popis skutku:', { bold: true, size: 20, spacingAfter: 100 });
    let gpsPart = '';
    if(record.lat != null && record.lng != null){
      gpsPart = ' (GPS: ' + Number(record.lat).toFixed(6) + ', ' + Number(record.lng).toFixed(6) + ')';
    }
    // Základní ustanovení (např. § 27 odst. 1 písm. a)) hned za "ustanovení",
    // sankční ustanovení (§ 125c...) až na konci u "dle" — viz komentář u
    // parseOffenseCitation výše. Když se citaci z nějakého důvodu nepodaří
    // rozparsovat (neobvyklý/ruční formát), appka se vrátí k původnímu
    // chování a použije celou citaci na obou místech.
    const parsedCitation = parseOffenseCitation(offenseCitation);
    const baseCite = parsedCitation ? (parsedCitation.ref + ' (zákon č. ' + parsedCitation.law + ')') : offenseCitation;
    const sankceCite = parsedCitation
      ? (parsedCitation.sankce ? (parsedCitation.sankce + ' (zákon č. ' + parsedCitation.law + ')') : baseCite)

      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Default Extension="jpeg" ContentType="image/jpeg"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '</Types>';

    const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';

    const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      relEntries.map(e => '<Relationship Id="rId' + e.id + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="' + e.target + '"/>').join('') +
      '</Relationships>';

    const zip = new JSZip();
    zip.file('[Content_Types].xml', contentTypes);
    zip.file('_rels/.rels', rootRels);
    zip.file('word/document.xml', documentXml);
    zip.file('word/_rels/document.xml.rels', docRels);
    mediaFiles.forEach(m => zip.file('word/media/' + m.name, m.bytes));

    return zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  async function exportOznameni(record, pachatel, filenameOverride){
    try{
      if(typeof JSZip === 'undefined'){
        setDetailNote('Export do Wordu se nepodařilo načíst (chybí knihovna JSZip — zkontrolujte připojení k internetu).', 'err');
        return false;
      }
      // Fotky mohly být v této session už dřív načtené (viz openDetail /
      // loadAndShowPhotos) — jinak je stejným způsobem dotáhneme teď.
      let photosB64 = record._resolvedPhotos;
      if(!photosB64 && record.hasPhotos){
        const doc = await db.collection('prestupky').doc(record.id).collection('data').doc('photos').get();
        const data = doc.exists ? doc.data() : null;
        photosB64 = (data && data.photos) || [];
        record._resolvedPhotos = photosB64;
        record._resolvedMime = (data && data.photoMime) || 'image/jpeg';
      }
      const blob = await buildOznameniDocx(record, photosB64 || [], pachatel);
      const filename = filenameOverride || ('Oznameni_' + (record.plate || 'prestupek').replace(/\s+/g,'') + '.docx');
      try{
        const file = new File([blob], filename, { type: blob.type });
        if(navigator.canShare && navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file] });
          return true;
        }
      }catch(e){
        // Uživatel sdílení zrušil nebo API není k dispozici — spadneme na
        // otevření v nové kartě, stejně jako u ukládání fotek.
      }
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=> URL.revokeObjectURL(url), 60000);
      return true;
    }catch(e){
      console.error('Export Oznámení selhal:', e);
      setDetailNote('Vytvoření dokumentu se nezdařilo (' + e.message + ').', 'err');
      return false;
    }
  }

  function escapeXml(str){
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Zalomí text na mezerách po ~32 znacích (šířka řádku na 58mm papíře
  // TM-P20II), ať tiskárna nedělí slova napůl — viz stejná funkce a
  // podrobný komentář v index.html.
  function wrapWords(text, width){
    width = width || 32;
    return String(text == null ? '' : text).split('\n').map(function(line){
      if(line.length <= width) return line;
      const words = line.split(' ');
      const lines = [];
      let cur = '';
      words.forEach(function(w){
        if(cur === ''){
          cur = w;
        } else if((cur + ' ' + w).length <= width){
          cur += ' ' + w;
        } else {
          lines.push(cur);
          cur = w;
        }
      });
      if(cur) lines.push(cur);
      return lines.join('\n');
    }).join('\n');
  }

  function textEl(data, opts){
    opts = opts || {};
    const align = opts.align || 'left';
    const em = opts.em ? 'true' : 'false';
    const width = opts.width || 1;
    const height = opts.height || 1;
    return '<text align="' + align + '" em="' + em + '" width="' + width + '" height="' + height + '">' +
      escapeXml(data) + '</text>';
  }

  function epsonSoapEnvelope(innerXml){
    return '<?xml version="1.0" encoding="utf-8"?>' +
      '<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/">' +
      '<s:Body>' +
      '<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">' +
      innerXml +
      '</epos-print>' +
      '</s:Body>' +
      '</s:Envelope>';
  }

  function epsonPrinterEndpoint(){
    const host = getPrinterHost();
    if(!host) return '';
    const base = /^https?:\/\//i.test(host) ? host.replace(/\/+$/, '') : 'https://' + host;
    return base + '/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000';
  }

  // Vrací Promise<boolean> — true jen když tiskárna potvrdí úspěšný tisk.
  // Díky tomu může volající (tlačítko Tisk i potvrzovací dialog u tlačítka
  // zpět) čekat na výsledek a reagovat na něj (např. teprve po úspěchu
  // opustit obrazovku detailu).
  function printViaEpson(record){
    return new Promise(async (resolve)=>{
      const host = getPrinterHost();
      if(!host){
        setDetailNote('Tiskárna není nastavená — otevři index.html appky a nastav IP tiskárny (⚙ Nastavit tiskárnu).', 'err');
        resolve(false);
        return;
      }
      setDetailNote('Tisknu…', '');

      const endpoint = epsonPrinterEndpoint();
      const body = epsonSoapEnvelope(buildEposPrintXml(record));

      async function attempt(mode){
        const controller = new AbortController();
        const timeoutId = setTimeout(()=>controller.abort(), 12000);
        try{
          const resp = await fetch(endpoint, {
            method: 'POST',
            mode,
            headers: { 'Content-Type': 'text/plain' },
            body,
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          return { ok: true, resp };
        }catch(e){
          clearTimeout(timeoutId);
          return { ok: false, error: e };
        }
      }

      let result = await attempt('cors');
      if(result.ok){
        try{
          const text = await result.resp.text();
          const xml = new DOMParser().parseFromString(text, 'text/xml');
          const responseEl = xml.getElementsByTagName('response')[0];
          const success = !!responseEl && /^(1|true)$/i.test(responseEl.getAttribute('success') || '');
          if(success){
            setDetailNote('✓ Vytištěno', 'ok');
            currentRecordPrinted = true;
            resolve(true);
            return;
          }
          const code = responseEl ? responseEl.getAttribute('code') : null;
          setDetailNote('Tiskárna nahlásila chybu' + (code ? ' (' + code + ')' : '') + '.', 'err');
          resolve(false);
          return;
        }catch(e){
          // Odpověď dorazila, ale nešla přečíst (typicky CORS) — spadneme
          // do "no-cors" pokusu níže.
        }
      }

      const fallback = await attempt('no-cors');
      if(fallback.ok){
        setDetailNote('⚠ Tisk odeslán, ale tiskárna potvrzení nevrátila (CORS). Zkontroluj výtisk.', 'ok');
        currentRecordPrinted = true;
        resolve(true);
        return;
      }

      const bareHost = host.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
      const msg = fallback.error && fallback.error.name === 'AbortError'
        ? 'Tiskárna neodpověděla včas — zkontroluj, že je zapnutá a telefon je připojený na stejnou síť/Wi-Fi Direct.'
        : 'Spojení s tiskárnou selhalo. Pokud jsi ještě v Safari nenavštívil https://' + bareHost + '/ ' +
          'a nepotvrdil certifikát tiskárny, udělej to nejdřív (stačí jednou).';
      setDetailNote(msg, 'err');
      resolve(false);
    });
  }


  function renderList(filterText){
    const container = document.getElementById('listBody');
    const statusEl = document.getElementById('listStatus');
    const q = (filterText || '').trim().toLowerCase();

    const filtered = !q ? allRecords : allRecords.filter(r=>
      (r.plate || '').toLowerCase().includes(q) ||
      (r.address || '').toLowerCase().includes(q) ||
      (r.noticeNumber || '').toLowerCase().includes(q) ||
      (r.officerName || '').toLowerCase().includes(q) ||
      (r.offenseLabel || '').toLowerCase().includes(q) ||
      (r.date || '').toLowerCase().includes(q) ||
      formatDateCz(r.date).toLowerCase().includes(q)
    );

    container.innerHTML = '';
    if(allRecords.length === 0){
      statusEl.textContent = 'Zatím žádné odeslané přestupky.';
      container.appendChild(statusEl);
      return;
    }
    if(filtered.length === 0){
      statusEl.textContent = 'Žádná shoda pro „' + filterText + '“.';
      container.appendChild(statusEl);
      return;
    }

    filtered.forEach(r=>{
      const item = document.createElement('div');
      item.className = 'record-item' + (r.resolved ? ' resolved' : '') + (r.docType === 'boticka' ? ' boticka' : '');

      const topRow = document.createElement('div');
      topRow.className = 'record-top-row';

      const plateRow = document.createElement('div');
      plateRow.className = 'record-plate-row';

      const plate = document.createElement('div');
      plate.className = 'record-plate';
      plate.textContent = r.plate || 'NEZNÁMÁ SPZ';
      plateRow.appendChild(plate);

      const docTypeBadge = document.createElement('div');
      docTypeBadge.className = 'record-doctype-badge' + (r.docType === 'boticka' ? ' boticka' : '');
      docTypeBadge.textContent = r.docType === 'boticka' ? 'Botička' : 'Parkovačka';
      plateRow.appendChild(docTypeBadge);

      if(r.resolved){
        const badge = document.createElement('div');
        badge.className = 'record-resolved-badge';
        badge.textContent = r.resolvedMethod === 'oznameni' ? 'Oznámeno'
          : r.resolvedMethod === 'prikaz' ? 'Dořešeno příkazem'
          : r.resolvedMethod === 'domluva' ? 'Dořešeno domluvou'
          : 'Dořešeno';
        plateRow.appendChild(badge);
      }
      topRow.appendChild(plateRow);

      if(r.noticeNumber){
        const num = document.createElement('div');
        num.className = 'record-notice-number';
        num.textContent = r.noticeNumber;
        topRow.appendChild(num);
      }
      item.appendChild(topRow);

      const meta = document.createElement('div');
      meta.className = 'record-meta';
      meta.textContent = (r.time || '') + ' · ' + formatDateCz(r.date) + (r.address ? ' · ' + r.address : '');
      item.appendChild(meta);

      if(r.offenseLabel){
        const off = document.createElement('div');
        off.className = 'record-offense';
        off.textContent = r.offenseLabel;
        item.appendChild(off);
      }

      const footer = document.createElement('div');
      footer.className = 'record-footer';

      if(r.officerName){
        const officer = document.createElement('div');
        officer.className = 'record-officer';
        officer.textContent = 'str. ' + r.officerName;
        footer.appendChild(officer);
      }

      const sub = document.createElement('div');
      sub.className = 'record-submitted';
      sub.textContent = 'Odesláno ' + formatCreatedAt(r.createdAt) + (r.submittedBy ? ' · ' + r.submittedBy : '');
      footer.appendChild(sub);

      if(footer.children.length) item.appendChild(footer);

      item.addEventListener('click', ()=> openDetail(r));
      container.appendChild(item);
    });
  }

  function getOffensePenaltyText(record){
    const penalty = record && record.offenseLabel ? OFFENSE_PENALTIES[record.offenseLabel] : null;
    return penalty ? ('Příkaz na místě (' + penalty + ')') : 'Příkaz na místě';
  }

  // Přestupky s finančním rozmezím (např. "2 500–3 500 Kč") jsou závažnější
  // — u nich domluva jako způsob řešení nepřipadá v úvahu, jen u přestupků
  // s pevným stropem ("do X Kč").
  function offenseHasPenaltyRange(record){
    const penalty = record && record.offenseLabel ? OFFENSE_PENALTIES[record.offenseLabel] : null;
    return !!(penalty && penalty.indexOf('–') !== -1);
  }

  // Ukládá skutečnou fotku (ne screenshot obrazovky) do Fotek. Atribut
  // "download" na <a href="data:..."> je na iOS Safari (obzvlášť v appce
  // přidané na plochu) nespolehlivý — tap na něj místo staženého souboru
  // často jen zobrazí obrázek a to, co se pak reálně uloží do Fotek, je
  // screenshot aktuální obrazovky. Nativní sdílecí okno (Web Share API se
  // skutečným File objektem) ukládá spolehlivě přímo fotku; když ho telefon
  // nepodporuje, otevřeme fotku v nové kartě, odkud jde uložit podržením prstu.
  async function shareOrOpenPhoto(dataUrl, filename){
    try{
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      const file = new File([blob], filename, { type: blob.type || 'image/jpeg' });
      if(navigator.canShare && navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file] });
        return;
      }
    }catch(e){
      // Uživatel sdílení zrušil, nebo API není k dispozici — zkusíme fallback.
    }
    window.open(dataUrl, '_blank');
  }

    domluvaBtn.style.display = offenseHasPenaltyRange(record) ? 'none' : '';

      if(record.resolvedMethod === 'oznameni'){

  // Sdílené označení přestupku jako vyřešeného — volá se jak po úspěšném
  // otevření dokumentu "Oznámení", tak po klepnutí na "Příkaz na místě".
  // "method" rozlišuje, jaký text appka pak zobrazí (viz updateResolveBtn
  // a vykreslení odznaku v seznamu).
  async function markResolved(record, method, extra){
    if(!record || record.resolved) return;
    // Shortens this record's Firestore TTL from the default 90 days
    // (set when it was created) to 60 days from now — the "expireAt"
    // field is what the TTL policy actually watches, so updating it is
    // enough; no need to move the document anywhere.
    const expireAt = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 60*24*60*60*1000));
    const updateData = {
      resolved: true,
      resolvedMethod: method,
      resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
      expireAt: expireAt
    };
    // "Příkaz na místě" nese navíc částku a údaje o pachateli (viz modál
    // prikazOverlay) — posílá se jen když skutečně existují.
    if(extra && extra.castka != null) updateData.castka = extra.castka;
    if(extra && extra.pachatel) updateData.pachatel = extra.pachatel;
    await db.collection('prestupky').doc(record.id).update(updateData);
    record.resolved = true;
    record.resolvedMethod = method;
    if(extra && extra.castka != null) record.castka = extra.castka;
    if(extra && extra.pachatel) record.pachatel = extra.pachatel;
    updateResolveBtn(record);
    renderList(document.getElementById('searchInput').value);
  }

  function debounce(fn, wait){
    let t;
    return function(...args){
      clearTimeout(t);
      t = setTimeout(()=> fn.apply(this, args), wait);
    };
  }

  // allowEmpty: použije se pro "sonda má obec vůbec ulice?" dotaz, kde
  // se schválně posílá prázdný query jen s filtrem locality+type.
  async function mapySuggest(query, types, opts){
    opts = opts || {};
    if(!opts.allowEmpty && (!query || query.trim().length < 2)) return [];
    const params = new URLSearchParams();
    params.set('apikey', MAPY_API_KEY);
    params.set('query', query || '');
    params.set('lang', 'cs');
    params.set('limit', String(opts.limit || 8));
    types.forEach(t => params.append('type', t));
    if(opts.locality) params.append('locality', opts.locality);
    try{
      const res = await fetch('https://api.mapy.com/v1/suggest?' + params.toString());
      if(!res.ok) return [];
      const data = await res.json();
      return data.items || [];
    }catch(e){
      console.error('Mapy.com suggest selhal:', e);
      return [];
    }
  }

  // ať se to na numerické klávesnici píše plynule), po opuštění pole se
  // přeformátuje na obvyklý zápis s tečkami (DD.MM.RRRR).
  function formatNarozeniDots(raw){
    const digits = (raw || '').replace(/\D/g, '');
    if(digits.length !== 8) return raw;
    return digits.slice(0,2) + '.' + digits.slice(2,4) + '.' + digits.slice(4,8);
  }

  });

  // Jméno souboru: "Výzva/Oznámení RR_MM_DD - číslo přestupku - spz - ulice"
  // (datum = den vygenerování dokumentu, ne den přestupku).
  function buildDocFilename(prefix, record){
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const rrMmDd = pad(now.getFullYear() % 100) + '_' + pad(now.getMonth() + 1) + '_' + pad(now.getDate());
    const bits = [];
    if(record.noticeNumber) bits.push(record.noticeNumber);
    if(record.plate) bits.push(record.plate);
    const street = record.address ? record.address.split(',')[0].trim() : '';
    if(street) bits.push(street);
    const name = prefix + ' ' + rrMmDd + (bits.length ? ' - ' + bits.join(' - ') : '');
    return name.replace(/[\\/:*?"<>|]/g, '') + '.docx';
  }

        document.getElementById('prikazOverlay').classList.remove('open');
        const filename = buildDocFilename('Oznámení', record);
        const opened = await exportOznameni(record, pachatel, filename);
        if(opened) await markResolved(record, 'oznameni', pachatel ? { pachatel } : undefined);
      }
    }catch(e){
      console.error('Označení jako dořešeno selhalo:', e);
      alert('Uložení se nezdařilo (' + e.message + '). Zkus to prosím znovu.');
      document.getElementById('prikazOverlay').classList.add('open');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Potvrdit a uložit';
    }
  });

  // ---------- Kamera + OCR pro sken MRZ (strojově čitelné zóny) OP ----------
  // Stejná logika jako v prehled-desktop.html — viz tam podrobný komentář.
  // OCR běží celé v prohlížeči (Tesseract.js, dotažený líně až při prvním
  // použití), fotka občanky nikam neodchází. Appka data VŽDY jen
  // předvyplní k ruční kontrole, nikdy je neukládá bez potvrzení.
  let mrzStream = null;
  let tesseractLoadPromise = null;

  function loadTesseract(){
    if(window.Tesseract) return Promise.resolve();
    if(tesseractLoadPromise) return tesseractLoadPromise;
    tesseractLoadPromise = new Promise((resolve, reject)=>{
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('Nepodařilo se načíst OCR knihovnu — zkontroluj připojení k internetu.'));
      document.head.appendChild(s);
    });
    return tesseractLoadPromise;
  }

  async function openMrzCamera(){
    const overlay = document.getElementById('mrzCameraOverlay');
    const video = document.getElementById('mrzVideo');
    const status = document.getElementById('mrzStatus');
    status.textContent = '';
    overlay.classList.add('open');
    try{
      mrzStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } },
        audio:false
      });
      video.srcObject = mrzStream;
      await video.play().catch(()=>{});
    }catch(e){
      status.textContent = 'Kameru se nepodařilo spustit (' + e.message + ').';
    }
  }

  function closeMrzCamera(){
    if(mrzStream){
      mrzStream.getTracks().forEach(t => t.stop());
      mrzStream = null;
    }
    document.getElementById('mrzVideo').srcObject = null;
    document.getElementById('mrzCameraOverlay').classList.remove('open');
  }

  document.getElementById('prikazScanBtn').addEventListener('click', openMrzCamera);
  document.getElementById('mrzCancelBtn').addEventListener('click', closeMrzCamera);

  // Mapa pro odstranění diakritiky BEZ změny délky řetězce — viz
  // podrobný komentář u stejné logiky v prehled-desktop.html.
  const OP_DIACRITICS_MAP = {
    'Á':'A','Č':'C','Ď':'D','É':'E','Ě':'E','Í':'I','Ň':'N','Ó':'O','Ř':'R','Š':'S','Ť':'T','Ú':'U','Ů':'U','Ý':'Y','Ž':'Z',
    'á':'a','č':'c','ď':'d','é':'e','ě':'e','í':'i','ň':'n','ó':'o','ř':'r','š':'s','ť':'t','ú':'u','ů':'u','ý':'y','ž':'z'
  };
  function stripDiacriticsSameLength(s){
    return s.split('').map(ch => OP_DIACRITICS_MAP[ch] || ch).join('');
  }

  function captureAfterLabel(rawText, normText, labelRegex, valueRegex, windowLen){
    const m = labelRegex.exec(normText);
    if(!m) return null;
    const start = m.index + m[0].length;
    const windowNorm = normText.slice(start, start + (windowLen || 40));
    const windowOrig = rawText.slice(start, start + (windowLen || 40));
    const vm = valueRegex.exec(windowNorm);
    if(!vm) return null;
    return windowOrig.slice(vm.index, vm.index + vm[0].length).trim();
  }

  // Rozparsuje syrový OCR text z PŘEDNÍ strany občanky — viz podrobný
  // komentář u stejné funkce v prehled-desktop.html.
  // OCR čte jméno/příjmení z OP velkými písmeny (JURAČKA) — appka je pro
  // pole formuláře převede na "První velké, zbytek malá" (Juračka).
  function toNameCase(s){
    if(!s) return s;
    return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
  }

  function parseOpFront(rawText){
    console.log('OP OCR raw text:', rawText); // pro ladění při špatném rozpoznání — viz DevTools konzole

    const norm = stripDiacriticsSameLength(rawText).toUpperCase();

    const cisloDokladu = captureAfterLabel(
      rawText, norm,
      /CISLO\s*DOKLADU|DOCUMENT\s*NO\.?/,
      /\d{6,9}/,
      30
    );
    const datumNarozeniRaw = captureAfterLabel(
      rawText, norm,
      /DATUM\s*NAROZENI|DATE\s*OF\s*BIRTH/,
      /\d{1,2}\s*\.\s*\d{1,2}\s*\.\s*\d{4}/,
      40
    );
    const prijmeni = captureAfterLabel(
      rawText, norm,
      /PRIJMENI\s*\/?\s*SURNAME/,
      /[A-Z][A-Z\-]{1,25}/,
      40
    );
    const jmeno = captureAfterLabel(
      rawText, norm,
      /JMENO\s*\/?\s*GIVEN\s*NAMES?/,
      /[A-Z][A-Z\-]{1,25}/,
      40
    );

    if(!cisloDokladu && !datumNarozeniRaw && !prijmeni && !jmeno) return null;
    return {
      jmeno: jmeno || null,
      prijmeni: prijmeni || null,
      datumNarozeni: datumNarozeniRaw ? datumNarozeniRaw.replace(/\s+/g, '') : null,
      cisloDokladu: cisloDokladu || null
    };
  }

  document.getElementById('mrzShootBtn').addEventListener('click', async ()=>{
    const video = document.getElementById('mrzVideo');
    const status = document.getElementById('mrzStatus');
    const shootBtn = document.getElementById('mrzShootBtn');
    if(!video.videoWidth){
      status.textContent = 'Kamera ještě není připravená, zkus to za chvíli.';
      return;
    }

    shootBtn.disabled = true;
    status.textContent = 'Načítám OCR knihovnu…';
    try{
      await loadTesseract();

      // Ořízne se stejná oblast, kterou appka vizuálně ukazuje jako
      // vodítko (skoro celý snímek s malým okrajem) — souřadnice musí
      // odpovídat .mrz-camera-guide v CSS výše.
      const vw = video.videoWidth, vh = video.videoHeight;
      const cropX = Math.round(vw * 0.04);
      const cropW = Math.round(vw * 0.92);
      const cropY = Math.round(vh * 0.08);
      const cropH = Math.round(vh * 0.84);

      const canvas = document.createElement('canvas');
      canvas.width = cropW; canvas.height = cropH;
      canvas.getContext('2d').drawImage(video, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);

      status.textContent = 'Rozpoznávám text…';
      // Čeština (ne MRZ zóna) — běžný tiskový font s diakritikou, proto
      // český jazykový model a bez omezení na znakovou sadu.
      const result = await window.Tesseract.recognize(canvas, 'ces');
      const rawText = (result && result.data && result.data.text) || '';
      const parsed = parseOpFront(rawText);

      if(!parsed){
        status.textContent = 'Nepodařilo se rozpoznat údaje — zkus to znovu, blíž, rovněji a s lepším osvětlením.';
        shootBtn.disabled = false;
        return;
      }

      if(parsed.jmeno) document.getElementById('prikazJmeno').value = toNameCase(parsed.jmeno);
      if(parsed.prijmeni) document.getElementById('prikazPrijmeni').value = toNameCase(parsed.prijmeni);
      if(parsed.datumNarozeni) document.getElementById('prikazNarozeni').value = parsed.datumNarozeni;
      if(parsed.cisloDokladu) document.getElementById('prikazDoklad').value = parsed.cisloDokladu;

      const note = document.getElementById('prikazScanNote');
      note.style.display = 'block';
      note.style.color = 'var(--bad)';
      note.textContent = 'Zkontroluj správnost všech polí.';

      closeMrzCamera();
    }catch(e){
      console.error('OCR skenu OP selhalo:', e);
      status.textContent = 'Rozpoznání se nezdařilo (' + e.message + ').';
    }finally{
      shootBtn.disabled = false;
    }
  });

  document.getElementById('menuDomluvaBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record || record.resolved) return;
    document.getElementById('resolveMenuOverlay').classList.remove('open');
    const btn = document.getElementById('menuDomluvaBtn');
    btn.disabled = true;
    btn.textContent = 'Ukládám…';
    try{
      await markResolved(record, 'domluva');
    }catch(e){
      console.error('Označení jako dořešeno selhalo:', e);
      btn.disabled = false;
      btn.textContent = 'Domluva (chyba, zkuste znovu)';
    }
  });

  // Sdílená logika stažení fotek ze subkolekce — volá ji jak automatické
  // otevření detailu (viz openDetail), tak ruční klik na tlačítko "Foto"
  // (např. po chybě, kdy je potřeba zkusit znovu).
  async function loadAndShowPhotos(record){
    const photoWrap = document.getElementById('photoWrap');
    const photoToggleBtn = document.getElementById('photoToggleBtn');
    photoToggleBtn.disabled = true;
    photoToggleBtn.textContent = 'Načítám…';
    try{
      const doc = await db.collection('prestupky').doc(record.id).collection('data').doc('photos').get();
      const data = doc.exists ? doc.data() : null;
      const photos = (data && data.photos) || [];
      const mime = (data && data.photoMime) || 'image/jpeg';
      record._resolvedPhotos = photos;
      record._resolvedMime = mime;
      renderPhotoGallery(record, photos, mime);
      photoToggleBtn.textContent = 'Foto' + (photos.length > 1 ? ' (' + photos.length + ')' : '');
      photoToggleBtn.disabled = false;
      photoWrap.classList.add('open');
    }catch(e){
      console.error('Načtení fotek selhalo:', e);
      photoToggleBtn.textContent = 'Foto (chyba)';
      photoToggleBtn.disabled = false;
    }
  }

  document.getElementById('photoToggleBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record) return;
    const photoWrap = document.getElementById('photoWrap');

    if(record._resolvedPhotos){
      photoWrap.classList.toggle('open');
      return;
    }

    await loadAndShowPhotos(record);
  });

  document.getElementById('detailCloseBtn').addEventListener('click', ()=>{
    show('list');
  });

})();
</script>
<script>
  // Registrace service workeru jen kvůli instalovatelnosti appky na
  // Androidu (viz sw.js) — na iOS Safari se appka na plochu přidává
  // stejně jako dřív.
  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
</script>
