<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RZ Scanner — Přehled</title>
<meta name="theme-color" content="#0A0C10">
<meta name="apple-mobile-web-app-title" content="Přehled">
<link rel="manifest" href="manifest-prehled.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" onerror="console.warn('JSZip se nenačetl — export Oznámení jako .docx nebude funkční.')"></script>
<!--
  Tisk na Epson TM-P20II přes ePOS-Print XML — stejná logika jako v
  index.html, žádný externí SDK soubor tu není potřeba (viz komentář
  u printViaEpson() níže).
-->
<style>
  :root{
    --asphalt:#0A0C10;
    --asphalt-2:#14171D;
    --asphalt-3:#1D2129;
    --ink:#111214;
    --amber:#FFB020;
    --amber-dim:#7A5713;
    --text:#ECEDEF;
    --muted:#8B92A0;
    --good:#33D399;
    --bad:#FF6058;
    --line:#262B33;
  }
  /* Stejný skrytý světlý režim jako v index.html — volba se přebírá přes
     localStorage (rzTheme), gesto se ovládá jen na úvodní obrazovce
     appky, tady se jen respektuje. */
  html.light-theme{
    --asphalt:#F4F5F7;
    --asphalt-2:#FFFFFF;
    --asphalt-3:#ECEDF0;
    --ink:#F4F5F7;
    --amber:#C77800;
    --amber-dim:#E8B26B;
    --text:#14161A;
    --muted:#5B6472;
    --good:#0E9A6E;
    --bad:#D4342A;
    --line:#DDE1E6;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow-x:hidden; max-width:100vw;}
  body{
    margin:0; background:var(--asphalt); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
  }
  #app{min-height:100dvh; display:flex; flex-direction:column; overflow-x:hidden;}
  .screen{position:fixed; top:0; left:0; right:0; height:calc(var(--app-height, 100dvh)); display:none; flex-direction:column; overflow-x:hidden;}
  .screen.active{display:flex;}

  h1,h2{font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.02em; margin:0;}

  .btn{
    padding:12px 20px; border-radius:14px; font-size:14.5px; font-weight:600;
    border:none; cursor:pointer; font-family:inherit;
  }
  .btn-primary{background:var(--amber); color:#241a00;}
  .btn-ghost{background:transparent; border:1.5px solid var(--line); color:var(--text);}
  .submit-note{margin-top:10px; text-align:center; font-size:12.5px; font-family:'Roboto Mono',monospace; display:none;}
  .submit-note.ok{color:var(--good);}
  .submit-note.err{color:var(--bad);}
  .btn:active{transform:scale(.97);}
  .btn[disabled]{opacity:.5; pointer-events:none;}

  /* ---------- LOGIN ---------- */
  #loginScreen{align-items:center; justify-content:center; padding:32px;}
  #loginScreen .login-box{width:100%; max-width:340px;}
  #loginScreen h1{font-size:22px; text-transform:uppercase; margin-bottom:6px;}
  #loginScreen p.hint{color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 24px;}
  .field{background:var(--asphalt-2); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:14px;}
  #prikazCastkaField{text-align:center;}
  #prikazCastkaField label{text-align:center;}
  #prikazCastkaField input{text-align:center;}
  #prikazCastkaField.prikaz-castka-missing{border-color:var(--bad);}
  .field label{display:block; font-size:10.5px; color:var(--muted); font-family:'Roboto Mono',monospace; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px;}
  .field input{width:100%; background:transparent; border:none; color:var(--text); font-size:16px; font-family:'Inter',sans-serif; padding:2px 0; outline:none;}
  .field select{width:100%; background:transparent; border:none; color:var(--text); font-size:16px; font-family:'Inter',sans-serif; padding:2px 0; outline:none;}
  .field select option{background:var(--asphalt-2); color:var(--text);}
  #loginError{color:var(--bad); font-size:12.5px; margin:10px 0 0; display:none; line-height:1.4;}

  /* ---------- LIST ---------- */
  #listScreen{overflow:hidden;}
  .list-top{
    display:flex; align-items:center; justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 14px; background:var(--asphalt-2);
    border-bottom:1px solid var(--line);
  }
  .list-top h1{
    font-size:17px; text-transform:uppercase; text-align:center;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  .list-bottom-bar{
    flex-shrink:0;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 14px);
    background:var(--asphalt-2); border-top:1px solid var(--line);
  }
  .list-bottom-btn{
    flex:1 1 0; padding:12px 10px; border-radius:10px; font-family:'Inter',sans-serif;
    font-weight:600; font-size:14px; cursor:pointer; text-decoration:none; text-align:center;
    border:1.5px solid var(--line); color:var(--text); background:transparent;
  }
  .list-bottom-btn.print{background:#5B8DEF; border-color:#5B8DEF; color:#000;}
  .list-bottom-btn.oznameni{background:#5B8DEF; border-color:#5B8DEF; color:#000;}
  .list-bottom-btn.resolve{background:var(--good); border-color:var(--good); color:#000;}
  .list-bottom-btn.resolve[disabled]{background:var(--good); color:#000; opacity:1;}
  .list-bottom-btn.back{background:var(--amber); border-color:var(--amber); color:#241a00;}
  .list-bottom-btn:active{transform:scale(.96);}
  /* "Zpět" na seznamu je <a href>, ne <button> — bez tohohle by iOS po
     zhruba půl vteřině podržení sám spustil svoje kontextové menu
     (Otevřít v nové kartě / Kopírovat odkaz / Sdílet), dřív než by stihlo
     naběhnout těch 4 s pro skryté odhlášení, a rozbilo by to celé gesto. */
  #listBackBtn{-webkit-touch-callout:none; -webkit-user-select:none; user-select:none;}
  /* Na seznamu (na rozdíl od detailu, kde je "Zpět" jedno ze tří tlačítek
     vedle sebe) je "Zpět" jediné tlačítko v liště — nemá tedy smysl ho
     roztahovat na celou šířku jako v detailu, stačí na velikost textu,
     na střed. Navíc plave přímo nad obsahem (bez vlastního pozadí/pruhu),
     ať pod ním není zbytečný černý pás — seznam pod ním prosvítá a jde
     skrz něj i normálně scrollovat. */
  #listScreen .list-bottom-bar{
    justify-content:center; position:absolute; left:0; right:0; bottom:0;
    background:none; border-top:none; pointer-events:none;
    padding:0 18px calc(env(safe-area-inset-bottom,0px) + 14px);
  }
  #listScreen .list-bottom-btn.back{
    flex:0 0 auto; padding:12px 34px; pointer-events:all;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  #listScreen{position:relative;}
  .confirm-overlay{
    display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55);
    align-items:center; justify-content:center; padding:24px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    background:var(--asphalt-2); border:1px solid var(--line); border-radius:16px;
    padding:22px 20px; max-width:320px; width:100%; text-align:center;
  }
  .confirm-text{font-size:15.5px; color:var(--text); margin-bottom:18px; line-height:1.4;}
  .confirm-btns{display:flex; gap:12px;}
  .confirm-btns-col{flex-direction:column;}
  .confirm-btn{
    flex:1; padding:11px 12px; border-radius:10px; font-family:'Inter',sans-serif;
    font-weight:600; font-size:14.5px; cursor:pointer; line-height:1.3;
  }
  .confirm-no{background:transparent; border:1.5px solid var(--line); color:var(--text);}
  .confirm-yes{background:#2F6FED; border:1.5px solid #2F6FED; color:#fff;}
  .confirm-cancel{background:transparent; border:none; color:var(--muted); font-size:13.5px; margin-top:4px;}

  /* ---------- Modál "Příkaz na místě" (částka + pachatel) ---------- */
  .prikaz-box{
    background:var(--asphalt-2); border:1px solid var(--line); border-radius:16px;
    padding:22px 20px; max-width:400px; width:100%; text-align:left; max-height:86vh;
    overflow-y:auto; overflow-x:hidden;
  }
  .prikaz-box h3{font-size:16px; margin:0 0 16px; color:var(--text); text-align:center;}
  .prikaz-box .field{margin-bottom:12px;}
  .prikaz-row2{display:flex; gap:10px;}
  .prikaz-row2 .field{flex:1; min-width:0;}
  .prikaz-row-address{display:flex; gap:10px;}
  .prikaz-street-field{flex:4; min-width:0;}
  .prikaz-housenum-field{flex:1; min-width:0;}
  .prikaz-suggest-wrap{position:relative;}
  .prikaz-suggest-list{
    display:none; position:absolute; left:0; right:0; top:100%; margin-top:4px; z-index:30;
    background:var(--asphalt-3); border:1px solid var(--line); border-radius:9px;
    max-height:190px; overflow-y:auto; box-shadow:0 10px 26px rgba(0,0,0,.45);
  }
  .prikaz-suggest-list.open{display:block;}
  .prikaz-suggest-item{padding:11px 12px; font-size:13.5px; color:var(--text); cursor:pointer; border-bottom:1px solid var(--line); background:var(--asphalt-3);}
  .prikaz-suggest-item:last-child{border-bottom:none;}
  .prikaz-suggest-item:active{background:var(--line);}
  .prikaz-suggest-item .sub{display:block; font-size:11px; color:var(--muted); margin-top:1px;}

  /* ---------- Vlastní kalendář pro Datum narození / Dostavit se dne ----------
     Nahrazuje nativní <input type="date">: appka si sama vykresluje
     měsíc/rok (přes select, kvůli rychlému skoku i desítky let zpátky) a
     mřížku dnů, takže se neotevírá žádná OS klávesnice ani nativní
     kalendář, které mohl vytlačit posun layoutu (viz setAppHeight výš). */
  .prikaz-datepicker-wrap{position:relative;}
  .js-date-field{cursor:pointer;}
  .prikaz-datepicker-panel{
    display:none; position:absolute; left:0; top:100%; margin-top:6px; z-index:40;
    width:252px; max-width:calc(100vw - 72px);
    background:var(--asphalt-3); border:1px solid var(--line); border-radius:12px;
    padding:10px; box-shadow:0 10px 26px rgba(0,0,0,.45);
  }
  .prikaz-datepicker-panel.open{display:block;}
  .prikaz-datepicker-head{display:flex; gap:6px; margin-bottom:8px;}
  .prikaz-datepicker-head select{
    flex:1; min-width:0; background:var(--asphalt-2); border:1px solid var(--line); border-radius:8px;
    color:var(--text); font-size:12.5px; font-family:'Inter',sans-serif; padding:6px 3px; outline:none;
  }
  .prikaz-datepicker-head select option{background:var(--asphalt-2); color:var(--text);}
  .prikaz-datepicker-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; text-align:center;}
  .prikaz-datepicker-dow{font-size:10px; color:var(--muted); font-family:'Roboto Mono',monospace; padding:4px 0;}
  .prikaz-datepicker-day{font-size:13px; color:var(--text); padding:7px 0; border-radius:7px; cursor:pointer; background:transparent;}
  .prikaz-datepicker-day:active{background:var(--line);}
  .prikaz-datepicker-day.is-today{border:1px solid var(--amber);}
  .prikaz-datepicker-day.is-selected{background:var(--amber); color:var(--ink); font-weight:700;}
  .prikaz-datepicker-day.is-empty{visibility:hidden; cursor:default;}
  .prikaz-datepicker-foot{display:flex; justify-content:space-between; margin-top:8px;}
  .prikaz-datepicker-foot button{background:transparent; border:none; color:var(--muted); font-size:12px; font-family:'Roboto Mono',monospace; cursor:pointer; padding:4px 6px;}
  .prikaz-datepicker-foot button:active{color:var(--text);}
  .prikaz-box input:disabled{opacity:.4;}
  .prikaz-pachatel-head{display:flex; align-items:center; justify-content:space-between; margin:14px 0 10px;}
  .prikaz-pachatel-head span{font-size:12.5px; color:var(--muted); font-weight:600;}
  .prikaz-scan-btn{
    display:flex; align-items:center; gap:6px; background:transparent; border:1.5px solid var(--line);
    color:var(--text); border-radius:9px; padding:8px 13px; font-size:13px; font-family:inherit;
    cursor:pointer; font-weight:600;
  }
  .prikaz-scan-btn:active{border-color:#2F6FED; color:#2F6FED;}
  .prikaz-scan-btn .cam-icon{font-size:16px; line-height:1;}
  .prikaz-note{font-size:11.5px; color:var(--faint); margin:-4px 0 14px; line-height:1.4; text-align:center;}
  .prikaz-actions{display:flex; gap:12px; margin-top:6px;}

  /* ---------- Kamera pro sken MRZ (strojově čitelné zóny) občanky ---------- */
  .mrz-camera-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:120;
    align-items:center; justify-content:center; flex-direction:column; padding:16px;
  }
  .mrz-camera-overlay.open{display:flex;}
  .mrz-camera-frame{position:relative; width:100%; max-width:520px; border-radius:14px; overflow:hidden; background:#000;}
  .mrz-camera-frame video{width:100%; display:block;}
  .mrz-camera-guide{
    position:absolute; left:4%; right:4%; top:8%; bottom:8%;
    border:2px dashed rgba(255,255,255,.85); border-radius:10px; pointer-events:none;
  }
  .mrz-camera-guide::after{
    content:'Zarovnej sem celou přední stranu občanky'; position:absolute; left:0; right:0; top:-24px;
    text-align:center; color:#fff; font-size:11.5px; text-shadow:0 1px 3px rgba(0,0,0,.8);
  }
  .mrz-camera-actions{display:flex; gap:14px; margin-top:16px; width:100%; max-width:520px;}
  .mrz-camera-actions button{
    flex:1; padding:13px 16px; border-radius:10px; font-family:inherit; font-weight:600; font-size:14.5px; cursor:pointer;
  }
  .mrz-shoot-btn{background:#2F6FED; border:1.5px solid #2F6FED; color:#fff;}
  .mrz-cancel-btn{background:transparent; border:1.5px solid rgba(255,255,255,.4); color:#fff;}
  .mrz-camera-status{color:#fff; font-size:13px; margin-top:12px; min-height:18px; text-align:center;}
  .detail-fixed-bottom{
    flex-shrink:0;
    position:absolute; left:0; right:0; bottom:0;
    background:none; border-top:none; pointer-events:none;
  }
  .detail-fixed-bottom .list-bottom-bar{
    position:static; background:transparent; border-top:none;
  }
  .detail-fixed-bottom .list-bottom-btn{
    pointer-events:all;
    box-shadow:0 8px 24px rgba(0,0,0,.45);
  }
  .detail-fixed-bottom .submit-note{margin:10px 18px 0;}
  .search-row{padding:14px 18px 0;}
  .search-row input{
    width:100%; background:var(--asphalt-2); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; color:var(--text); font-size:16px; font-family:inherit; outline:none;
  }
  #listBody{flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding:14px 18px 76px;}
  .list-empty{text-align:center; color:var(--muted); font-size:13.5px; margin-top:60px; line-height:1.6;}
  .record-item{
    position:relative; background:rgba(91,141,239,.07); border:1.5px solid rgba(91,141,239,.55);
    border-radius:14px; padding:14px 16px 12px; margin-bottom:14px; cursor:pointer; overflow:hidden;
  }
  .record-item.boticka{background:rgba(255,176,32,.07); border-color:rgba(255,176,32,.55);}
  .record-item:active{transform:scale(.98);}
  .record-item.resolved{background:rgba(51,211,153,.07); border-color:rgba(51,211,153,.5); opacity:.75;}
  .record-top-row{display:flex; flex-direction:column; gap:6px;}
  .record-notice-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .record-notice-number{
    font-family:'Roboto Mono',monospace; font-size:10px; color:var(--muted);
    letter-spacing:.03em; white-space:nowrap;
  }
  .record-pachatel-info{font-size:11px; color:var(--faint);}
  .record-plate-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .record-plate{font-family:'Oswald',sans-serif; font-weight:600; font-size:20px; letter-spacing:.05em;}
  .record-resolved-badge{
    font-size:10px; font-weight:700; color:var(--good); text-transform:uppercase; letter-spacing:.05em;
    border:1px solid var(--good); border-radius:20px; padding:3px 8px;
  }
  .record-doctype-badge{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:3px 8px; border-radius:20px; color:#5B8DEF; border:1px solid #5B8DEF;
  }
  .record-doctype-badge.boticka{color:var(--amber); border-color:var(--amber);}
  .record-meta{
    font-family:'Roboto Mono',monospace; font-size:11.5px; color:var(--muted);
    margin-top:8px; letter-spacing:.02em; overflow-wrap:anywhere;
  }
  .record-offense{
    font-size:13.5px; color:var(--text); margin-top:10px; padding-top:10px;
    border-top:1px solid var(--line); line-height:1.4; overflow-wrap:anywhere;
  }
  .record-footer{
    display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:4px 12px;
    margin-top:10px; padding-top:9px; border-top:1px solid var(--line);
  }
  .record-officer{font-size:11.5px; color:var(--text); font-weight:600;}
  .record-submitted{font-size:10.5px; color:var(--muted); overflow-wrap:anywhere; text-align:right;}
  .record-resolved-by{font-size:10.5px; color:var(--muted); overflow-wrap:anywhere; text-align:right;}

  /* ---------- DETAIL ---------- */
  #detailScreen{background:#111; position:relative;}
  .detail-top{
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 14px; background:var(--asphalt-2);
    border-bottom:1px solid var(--line);
  }
  .detail-top span{font-size:18px !important; letter-spacing:.08em;}
  #detailPreviewWrap{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; background:#3a3a3a; padding:22px 16px 90px;}

  /* ---------- NOTICE CARD (same look used in the app's own preview) ---------- */
  .notice-card{
    background:#ffffff; color:#141414; border-radius:14px; padding:30px 22px 26px;
    font-family:'Inter',sans-serif; text-align:center; max-width:440px; margin:0 auto;
  }
  .notice-title{font-family:'Oswald',sans-serif; font-weight:700; font-size:26px; letter-spacing:.03em; margin:0 0 4px; text-transform:uppercase;}
  .notice-subtitle{color:#777; font-size:12.5px; margin:0 0 18px;}
  .notice-subtitle-boticka{font-size:18.75px; font-weight:700; color:#333;}
  .notice-number{color:#666; font-size:22px; letter-spacing:.03em; margin:-10px 0 18px; font-weight:800;}
  .notice-officer{font-weight:600; font-size:11px; color:#555; margin-bottom:4px;}
  .notice-label{color:#999; font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px;}
  .notice-platebox{
    display:inline-block; border:1.6px solid #181818; border-radius:10px;
    padding:12px 26px; font-family:'Oswald',sans-serif; font-weight:700; font-size:30px;
    letter-spacing:.04em; margin-bottom:16px;
  }
  .notice-vehicle{font-size:14px; color:#555; margin:-8px 0 18px; font-weight:600;}
  .notice-datetime{font-size:15.5px; margin-bottom:20px; color:#222;}
  .notice-section{margin-bottom:16px;}
  .notice-heading{font-weight:700; font-size:12px; display:inline-block; border-bottom:1.5px solid #181818; padding-bottom:3px; margin-bottom:8px;}
  .notice-address{font-size:14.5px; color:#333;}
  .notice-offense-label{font-size:13.5px; color:#333; line-height:1.45;}
  .notice-offense-ref{font-size:12px; color:#555; margin-top:4px;}
  .notice-instructions{margin-top:18px; padding-top:14px; border-top:1px solid #eee; font-size:11.5px; line-height:1.55; color:#333; text-align:center;}
  .notice-instructions b{font-weight:700;}
  .notice-instructions .heading-caps{font-weight:700; letter-spacing:.04em; text-transform:uppercase; display:block; margin:10px 0 6px;}
  .notice-footer{margin-top:22px; padding-top:14px; border-top:1px solid #eee;}
  .notice-footer .authority{font-weight:700; font-size:10px; color:#555;}
  .notice-footer .authority-addr{font-size:9.5px; color:#999; margin-top:2px;}
  .notice-footer .authority-phone{font-size:9.5px; color:#999; margin-top:2px;}
  .notice-footer .generated-by{font-size:9.5px; color:#aaa; margin-top:10px;}

  .photo-toggle-row{text-align:center; margin-top:20px;}
  .photo-toggle-row .btn-ghost{color:#fff; border-color:rgba(255,255,255,.45);}
  .notice-photo-wrap{margin-top:14px; display:none; max-width:440px; margin-left:auto; margin-right:auto;}
  .notice-photo-wrap.open{display:block;}

<script>
(function(){
  // ---------- Oprava výšky viewportu na iOS Safari ----------
  // Stejný fix jako v index.html — iOS Safari nespolehlivě počítá výšku
  // pro position:fixed;inset:0, po sbalení adresního řádku appka
  // nezaplní celou obrazovku a dole zůstane černá mezera. JS změří
  // skutečnou výšku viditelné plochy a uloží ji do CSS proměnné
  // --app-height, na kterou jsou obrazovky (.screen) navázané.
  // Když má fokus nativní kalendář/čas (<input type="date"/"time">), přepočet
  // přeskočíme — na Androidu umí i drobný posun layoutu (typicky těsně po
  // zavření klávesnice z předchozího pole, což spustí právě
  // visualViewport 'resize') donutit prohlížeč nativní kalendář hned zavřít
  // a rovnou potvrdit to, co v něm bylo zrovna zvýrazněné (= dnešní datum) —
  // navenek to vypadá, že kalendář jen "problikne" a sám vyplní dnešek.
  // Výšku po odchodu z pole doženeme přes 'focusout' níž.
  function setAppHeight(){
    const active = document.activeElement;
    if(active && active.tagName === 'INPUT' && (active.type === 'date' || active.type === 'time')) return;
    const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', ()=>setTimeout(setAppHeight, 100));
  window.addEventListener('load', setAppHeight);
  document.addEventListener('pageshow', setAppHeight);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setAppHeight(); });
  document.addEventListener('focusout', (e)=>{
    const t = e.target;
    if(t && t.tagName === 'INPUT' && (t.type === 'date' || t.type === 'time')) setTimeout(setAppHeight, 50);
  });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', setAppHeight);
  }
  // Appka spuštěná z plochy (standalone) hlásí při startu na iOS občas
  // ještě neustálenou výšku (probíhá spouštěcí animace) — přeměříme
  // ještě několikrát s prodlevou, ať se appka doopravdy natáhne na celou
  // obrazovku i po doběhnutí přechodu.
  [50, 150, 300, 600, 1000, 1500].forEach(ms => setTimeout(setAppHeight, ms));

  // Respektuje volbu tématu nastavenou v index.html (4s podržení loga na
  // úvodní obrazovce appky) — samotné gesto tady není, jen se drží stejná
  // paleta jako zbytek appky.
  try{
    if(localStorage.getItem('rzTheme') === 'light'){
      document.documentElement.classList.add('light-theme');
    }
  }catch(e){}

  const screens = {
    login: document.getElementById('loginScreen'),
    list: document.getElementById('listScreen'),
    detail: document.getElementById('detailScreen'),
  };
  function show(name){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // ---------- Firebase ----------
  const firebaseConfig = {
    apiKey: "AIzaSyCXin_qIc785nooY8Qqejt5BU_X6f9it6c",
    authDomain: "rz-scanner.firebaseapp.com",
    projectId: "rz-scanner",
    storageBucket: "rz-scanner.firebasestorage.app",
    messagingSenderId: "299287620862",
    appId: "1:299287620862:web:bd3b7b2d7304ecb27149af",
    measurementId: "G-0V2HSNXW2L"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let allRecords = [];

  // ---------- Auth ----------
  // Proklik z RZ Scanneru (upozornění na duplicitní RZ) může appku otevřít
  // s parametrem ?q=<RZ> v URL — předvyplní pole hledání, ať se rovnou
  // zobrazí ten (nebo ty) záznam(y), na které se to upozornění vztahovalo.
  try{
    const q = new URLSearchParams(window.location.search).get('q');
    if(q) document.getElementById('searchInput').value = q;
  }catch(e){}

  auth.onAuthStateChanged(user=>{
    if(user){
      show('list');
      loadRecords();
    } else {
      show('login');
    }
  });

  document.getElementById('loginSubmitBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    if(!email || !password){
      errEl.textContent = 'Vyplňte e-mail i heslo.';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('loginSubmitBtn');
    btn.disabled = true;
    try{
      await auth.signInWithEmailAndPassword(email, password);
      document.getElementById('loginPassword').value = '';
    }catch(e){
      errEl.textContent = 'Přihlášení se nezdařilo — zkontrolujte e-mail a heslo.';
      errEl.style.display = 'block';
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById('loginPassword').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('loginSubmitBtn').click();
  });

  // Skryté odhlašovací gesto: podržení tlačítka "Zpět" na seznamu 4 s.
  // Žádné tlačítko odhlášení v UI záměrně není — appka je sdílená mezi
  // strážníky na jednom telefonu, takže odhlášení nemá být na první pohled
  // dostupné/omylem stisknutelné. Tlačítko "Zpět" je normálně odkaz (běžný
  // klik/tap appku opustí zpátky na RZ Scanner) — dlouhé podržení tenhle
  // odkaz "překryje" a místo přechodu appku rovnou odhlásí.
  (function setupHiddenLogout(){
    const btn = document.getElementById('listBackBtn');
    if(!btn) return;
    let holdTimer = null;
    let triggered = false;
    function start(){
      triggered = false;
      cancel();
      holdTimer = setTimeout(()=>{ triggered = true; auth.signOut(); }, 4000);
    }
    function cancel(){
      if(holdTimer){ clearTimeout(holdTimer); holdTimer = null; }
    }
    btn.addEventListener('touchstart', start, { passive: true });
    btn.addEventListener('touchend', cancel);
    btn.addEventListener('touchcancel', cancel);
    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', cancel);
    btn.addEventListener('mouseleave', cancel);
    btn.addEventListener('click', (e)=>{
      if(triggered){
        e.preventDefault();
        triggered = false;
      }
    });
  })();

  // ---------- List ----------
  // Real-time listener — appka se sama překreslí, kdykoliv se ve Firestore
  // něco změní (nový přestupek odeslaný z RZ Scanner, dořešení odjinud,
  // změna z desktopové appky apod.), bez nutnosti stránku ručně obnovovat.
  // onSnapshot se navíc jednou zavolá hned na začátku se stávajícími daty,
  // takže nahrazuje i původní jednorázové načtení.
  function loadRecords(){
    const statusEl = document.getElementById('listStatus');
    statusEl.style.display = 'block';
    statusEl.textContent = 'Načítám…';
    let first = true;
    let t0 = performance.now();
    db.collection('prestupky').orderBy('createdAt', 'desc').limit(500)
      .onSnapshot(snap=>{
        const t1 = performance.now();
        allRecords = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

        // Temporary diagnostics — helps pin down whether the slowness is
        // the network fetch itself or something else, and whether older
        // records still carrying inline photos (from before photos moved
        // to a subcollection) are the culprit.
        let legacyPhotoBytes = 0, legacyCount = 0;
        allRecords.forEach(r=>{
          if(r.photos && r.photos.length){
            legacyCount++;
            legacyPhotoBytes += r.photos.reduce((s,p)=> s + (p ? p.length : 0), 0);
          } else if(r.photoBase64){
            legacyCount++;
            legacyPhotoBytes += r.photoBase64.length;
          }
        });
        const totalKB = Math.round(JSON.stringify(snap.docs.map(d=>d.data())).length / 1024);
        const legacyKB = Math.round(legacyPhotoBytes / 1024);
        console.log('[živý přenos]', first ? 'počáteční načtení' : 'změna dat', '—',
          Math.round(t1-t0), 'ms, počet záznamů:', allRecords.length,
          ', celková velikost payloadu:', totalKB, 'KB, z toho staré vložené fotky:', legacyKB, 'KB v', legacyCount, 'záznamech');
        first = false;

        renderList(document.getElementById('searchInput').value);

        const t2 = performance.now();
        const diag = document.createElement('div');
        diag.style.cssText = 'text-align:center; color:var(--muted); font-size:10.5px; font-family:monospace; margin-top:14px; opacity:.7; overflow-wrap:anywhere;';
        diag.textContent = 'Diagnostika: fetch ' + Math.round(t1-t0) + ' ms, render ' + Math.round(t2-t1) + ' ms, ' +
          allRecords.length + ' záznamů, ' + totalKB + ' KB celkem (' + legacyKB + ' KB staré fotky v ' + legacyCount + ' záznamech)';
        document.getElementById('listBody').appendChild(diag);

        t0 = performance.now();
      }, e=>{
        console.error('Načtení přehledu selhalo:', e);
        statusEl.textContent = 'Načtení se nezdařilo (' + (e && e.message ? e.message : 'chyba sítě') + ').';
        statusEl.style.display = 'block';
      });
  }

  function formatCreatedAt(ts){
    if(!ts) return '';
    const d = typeof ts.toDate === 'function' ? ts.toDate() : ts;
    if(!(d instanceof Date) || isNaN(d)) return '';
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function formatDateCz(iso){
    if(!iso) return '—';
    const parts = iso.split('-');
    if(parts.length !== 3) return iso;
    const [y, m, d] = parts.map(Number);
    if(!y || !m || !d) return iso;
    return d + '. ' + m + '. ' + y;
  }

  function escapeHtml(s){
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function buildNoticeHtml(record){
    const isBoticka = record.docType === 'boticka';
    const addressBlock = record.address ? `
      <div class="notice-section">
        <div class="notice-heading">Místo přestupku</div>
        <div class="notice-address">${escapeHtml(record.address)}</div>
      </div>` : '';
    const offenseBlock = record.offenseLabel ? `
      <div class="notice-section">
        <div class="notice-heading">Právní kvalifikace přestupku</div>
        <div class="notice-offense-label">${escapeHtml(record.offenseLabel)}</div>
        ${record.offenseCitation ? `<div class="notice-offense-ref">${escapeHtml(record.offenseCitation)}</div>` : ''}
      </div>` : '';
    const numberBlock = record.noticeNumber ? `
      <div class="notice-number"><b>${escapeHtml(record.noticeNumber)}</b></div>` : '';
    const officerBlock = record.officerName ? `
      <div class="notice-officer">str. ${escapeHtml(record.officerName)}</div>` : '';
    const vehicleBlock = (record.brand || record.color) ? `
      <div class="notice-vehicle">${escapeHtml([record.brand, record.color].filter(Boolean).join(', '))}</div>` : '';
    const instructionsHtml = isBoticka ? `
          Oznamuji Vám, že na výše uvedeném vozidle byl <b>umístěn technický prostředek k zabránění odjezdu vozidla (TPZOV)</b> dle § 17a zákona č. 553/1991 Sb., o obecní policii, a to z důvodu porušení pravidel uvedených výše.
          <b style="display:block; margin:10px 0 6px;">pořízena fotodokumentace</b>
          <span class="heading-caps">Poučení</span>
          Technický prostředek bude odstraněn po projednání přestupku, nebo po zjištění totožnosti osoby, která vozidlo na místě ponechala, nebo po provedení nezbytných úkonů ke zjištění totožnosti této osoby.
        ` : `

  function xmlEscape(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }

  function todayCz(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear();
  }

  function mmToTwips(mm){ return Math.round(mm * 56.6929); }
  function mmToEmu(mm){ return Math.round(mm * 36000); }

  function docxRun(text, opts){
    opts = opts || {};
    let props = '<w:sz w:val="' + (opts.size || 20) + '"/>';
    if(opts.bold) props += '<w:b/>';
    if(opts.italic) props += '<w:i/>';
    if(opts.underline) props += '<w:u w:val="single"/>';
    return '<w:r><w:rPr>' + props + '</w:rPr><w:t xml:space="preserve">' + xmlEscape(text) + '</w:t></w:r>';
  }

  // Prokliknutelný text (modrý, podtržený) uvnitř odstavce — relId musí
  // být předem zaregistrované v relEntries dané appkou (viz volání níž,
  // typ 'hyperlink' + targetMode 'External').
  function docxHyperlinkRun(relId, text, opts){
    opts = opts || {};
    let props = '<w:color w:val="0563C1"/><w:u w:val="single"/><w:sz w:val="' + (opts.size || 20) + '"/>';
    if(opts.bold) props += '<w:b/>';
    return '<w:hyperlink r:id="rId' + relId + '"><w:r><w:rPr>' + props + '</w:rPr><w:t xml:space="preserve">' + xmlEscape(text) + '</w:t></w:r></w:hyperlink>';
  }

  function docxPara(text, opts){
    opts = opts || {};
    let pPr = '';
    if(opts.align) pPr += '<w:jc w:val="' + opts.align + '"/>';
    if(opts.pageBreakBefore) pPr += '<w:pageBreakBefore/>';
    pPr += '<w:spacing w:before="' + (opts.spacingBefore != null ? opts.spacingBefore : 0) +
           '" w:after="' + (opts.spacingAfter != null ? opts.spacingAfter : 0) + '"/>';
    const r = text != null ? docxRun(text, opts) : '';
    return '<w:p><w:pPr>' + pPr + '</w:pPr>' + r + '</w:p>';
  }

  // Jako docxPara, ale odstavec může mít víc úseků s různým tučným
  // stavem (např. jen datum/čas nebo jen SPZ tučně uprostřed běžné věty).
  // segments: [{ text, bold }, ...] — velikost/zarovnání se bere z opts
  // společně pro celý odstavec, bold se řídí jednotlivými segmenty.
  function docxParaRuns(segments, opts){
    opts = opts || {};
    let pPr = '';
    if(opts.align) pPr += '<w:jc w:val="' + opts.align + '"/>';
    if(opts.pageBreakBefore) pPr += '<w:pageBreakBefore/>';
    pPr += '<w:spacing w:before="' + (opts.spacingBefore != null ? opts.spacingBefore : 0) +
           '" w:after="' + (opts.spacingAfter != null ? opts.spacingAfter : 0) + '"/>';
    const runs = segments.map(seg => docxRun(seg.text, { size: opts.size || 20, bold: !!seg.bold })).join('');
    return '<w:p><w:pPr>' + pPr + '</w:pPr>' + runs + '</w:p>';
  }

  // Odstavec "štítek" + skutečný tabulátor na pevnou pozici + "hodnota" —
  // na rozdíl od ručně vyťukaných mezer se tak hodnoty u různě dlouhých
  // štítků (RZ vs. tovární značka/barva) zarovnají přesně pod sebe.
  function docxLabelValuePara(label, value, opts){
    opts = opts || {};
    const tabPos = opts.tabPos != null ? opts.tabPos : 2600;
    const pPr = '<w:tabs><w:tab w:val="left" w:pos="' + tabPos + '"/></w:tabs>' +
      '<w:spacing w:before="' + (opts.spacingBefore != null ? opts.spacingBefore : 0) +
      '" w:after="' + (opts.spacingAfter != null ? opts.spacingAfter : 0) + '"/>';
    const labelRun = docxRun(label, { size: opts.size || 20 });
    const tabRun = '<w:r><w:rPr><w:sz w:val="' + (opts.size || 20) + '"/></w:rPr><w:tab/></w:r>';
    const valueRun = docxRun(value, { size: opts.size || 20, bold: opts.valueBold });
    return '<w:p><w:pPr>' + pPr + '</w:pPr>' + labelRun + tabRun + valueRun + '</w:p>';
  }

  // První řádek bydliště pachatele — "ulice č.p." když obec ulice má,
  // jinak appka radši dá před číslo popisné jméno obce ("Obora 147"),
  // ať v dokumentu nezůstane osamocené číslo bez kontextu (u obcí bez
  // pojmenovaných ulic appka ulici nemá odkud vzít).
  function pachatelBydlisteRadek1(pachatel){
    if(!pachatel) return '';
    if(pachatel.ulice) return [pachatel.ulice, pachatel.cisloDomu].filter(Boolean).join(' ');
    const mesto = pachatel.mesto || '';
    const commaIdx = mesto.indexOf(', ');
    const obecName = commaIdx !== -1 ? mesto.slice(commaIdx + 2) : mesto;
    return [obecName, pachatel.cisloDomu].filter(Boolean).join(' ');
  }

  // Klikací "vyplňovací pole" v docx (Word content control / structured
  // document tag) — vypadá jako žlutě zvýrazněný text "doplň Č.j.:", ale
  // ve Wordu funguje jako placeholder: strážník do něj klikne, začne psát
  // číslo jednací a placeholder text se sám smaže (chování jako u
  // vestavěných formulářových polí Wordu, ne obyčejný zvýrazněný text).
  // w:id musí být v rámci dokumentu unikátní — appka generuje náhodně,
  // v jednom dokumentu se pole vyskytuje jen jednou, takže kolize nehrozí.
  function docxPlaceholderFieldPara(prefixText, placeholderText, opts){
    opts = opts || {};
    const size = opts.size || 19;
    // Kromě sdtEndPr appka nastavuje velikost i na "rPr" konce odstavce
    // (pPr/rPr) — sdtEndPr Word na nově napsaný text v praxi nepoužívá
    // spolehlivě (běžná nekonzistence content controlů), zatímco
    // formátování konce odstavce Word skutečně dědí, když nahrazuje
    // placeholder text napsaným.
    const pPr = '<w:spacing w:before="0" w:after="' + (opts.spacingAfter != null ? opts.spacingAfter : 20) + '"/><w:rPr><w:sz w:val="' + size + '"/></w:rPr>';
    const prefixRun = docxRun(prefixText, { size, bold: !!opts.bold });
    const sdtId = Math.floor(Math.random() * 2000000000) + 1;
    const sdt = '<w:sdt><w:sdtPr>' +
      '<w:alias w:val="Číslo jednací"/>' +
      '<w:tag w:val="cisloJednaci"/>' +
      '<w:id w:val="' + sdtId + '"/>' +
      '<w:placeholder><w:docPart w:val="DefaultPlaceholder_-1854013438"/></w:placeholder>' +
      '<w:showingPlcHdr/>' +
      '<w:text/>' +
      '</w:sdtPr><w:sdtEndPr><w:rPr><w:sz w:val="' + size + '"/></w:rPr></w:sdtEndPr><w:sdtContent>' +
      '<w:r><w:rPr><w:sz w:val="' + size + '"/><w:b/><w:highlight w:val="yellow"/></w:rPr>' +
      '<w:t xml:space="preserve">' + xmlEscape(placeholderText) + '</w:t></w:r>' +
      '</w:sdtContent></w:sdt>';
    return '<w:p><w:pPr>' + pPr + '</w:pPr>' + prefixRun + sdt + '</w:p>';
  }

  function docxHeaderTable(leftLines, rightLines, leftBold){

    // víc vpravo, blíž k pravému okraji stránky.
    const leftW = 3600, gutterW = 2200, rightW = 3226;

      '<w:tr>' + cell(leftLines, leftW, leftBold) + emptyCell(gutterW) + cell(rightLines, rightW, false) + '</w:tr></w:tbl>';

  function getImagePixelSize(dataUrl){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=> resolve({ w: img.naturalWidth || 800, h: img.naturalHeight || 600 });
      img.onerror = ()=> resolve({ w: 800, h: 600 });
      img.src = dataUrl;
    });
  }

  function base64ToUint8Array(base64){
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  // Opak base64ToUint8Array — appka to potřebuje pro obrázek mapy
  // stažený jako binární data z Mapy.com (fetch().arrayBuffer()), aby
  // ho mohla poslat do getImagePixelSize (ta čeká data URL).
  function uint8ArrayToBase64(bytes){
    let binary = '';
    for(let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  // Appka ukládá do Firestore jen spojenou citaci (např. "§ 27 odst. 1
  // písm. a) — přestupek dle § 125c odst. 1 písm. k) (zákon č. 361/2000
  // Sb.)"), ne samostatně základní paragraf a sankci. Pro "Popis skutku"
  // je ale potřeba mít obě části zvlášť (základní paragraf hned za
  // "ustanovení", sankce až u "dle" na konci) — tahle funkce citaci zpět
  // rozparsuje. Funguje na starých i nových záznamech (formát citace se
  // neměnil, jen její použití v textu skutku).
  function parseOffenseCitation(citation){
    if(!citation) return null;
    const m = citation.match(/^(.+?)(?: — přestupek dle (.+?))? \(zákon č\. (.+?)\)$/);
    if(!m) return null;
    return { ref: m[1], sankce: m[2] || null, law: m[3] };
  }

  // ---------- Export "Výzva" (dopis konkrétní osobě) jako .docx ----------
  // Jiný dokument než ta "Výzva" v rámečku na Oznámení (ta je "na sklo",
  // pro nepřítomného pachatele bez known identity). Tahle jde poštou
  // konkrétní ztotožněné osobě (jméno, datum narození, adresa) — tu
  // identitu ale RZ Scanner nezná (má ji jen MP Manager po lustraci
  // v RSV), takže tahle tři pole a číslo jednací MP Manageru zůstávají
  // v dokumentu jako [DOPLNIT...] placeholder pro ruční doplnění před
  // odesláním. Termín dostavení se taky nechává na doplnění — jde
  // o právně závaznou lhůtu, kterou má určit strážník/vedoucí, ne appka
  // od oka. Vzor dodal Lukáš 28.8.2026 (Výzva_vzor.rtf).
  const VYZVA_LOCAL_PARTS = ['Těchov','Lažánky','Obůrka','Klepačov','Hořice',
    'Horní Lhota','Dolní Lhota','Olešná','Žižlavice','Skalní mlýn','Češkovice'];

  function addressForLetter(address){
    if(!address) return { city: 'Blansko', locationPhrase: '' };
    const parts = address.split(',').map(s => s.trim()).filter(Boolean);
    const first = parts[0] || '';
    // Appka dřív město do dopisu dávala natvrdo "Blansko" bez ohledu na
    // to, co je v record.address uložené — u přestupků mimo Blansko
    // (Doubravice nad Svitavou, Rájec-Jestřebí…) to bylo špatně. Když
    // appka v adrese má i druhou část za čárkou (obec), použije ji;
    // jinak jde o místní část Blanska uloženou bez obce (jen "Těchov"
    // apod.), kde zůstává dosavadní výchozí "Blansko".
    const city = parts[1] || 'Blansko';
    if(VYZVA_LOCAL_PARTS.includes(first)){
      return { city, locationPhrase: 'v místní části ' + first };
    }
    return { city, locationPhrase: 'na ulici ' + first };
  }

  async function buildVyzvaDopisDocx(record, pachatel, dostaveniTermin){
    // Do hlavičky/podpisu dokumentu appka dává strážníka, který přestupek
    // PRÁVĚ dořešuje (přihlášený na tomhle zařízení), ne toho, kdo ho
    // kdysi založil (record.officerName) — dořešuje často jiný strážník,
    // než ten, co na místě udělal zápis. resolvedByOfficer je pojistka
    // pro případ, že by appka currentOfficerName() nepoznala.
    const officerForDoc = currentOfficerName() || record.resolvedByOfficer || record.officerName || '';
    const offenseLabel = record.offenseLabel || '';
    const offenseCitation = record.offenseCitation || '';
    // Stejné rozdělení "základní/sankční" citace jako u Oznámení (viz
    // buildOznameniDocx níž) — základní ustanovení (např. § 27 odst. 1
    // písm. l)) appka dá hned za "přestupku podle", sankční (§ 125c...)
    // až na konci jako "téhož zákona". Když se citaci nepodaří
    // rozparsovat (neobvyklý/ruční formát), použije se celá citace na
    // obou místech beze zkratky.
    const parsedCitation = parseOffenseCitation(offenseCitation);
    const offenseLabelLower = offenseLabel ? (offenseLabel.charAt(0).toLowerCase() + offenseLabel.slice(1)) : '';
    const skutekBaseCite = parsedCitation ? (parsedCitation.ref + ' zákona č. ' + parsedCitation.law) : offenseCitation;
    const skutekSankceCite = parsedCitation
      ? (parsedCitation.sankce ? (parsedCitation.sankce + ' téhož zákona') : ('§ 125c odst. 1 téhož zákona'))
      : offenseCitation;
    // Slovesný tvar appka dostává přímo ze záznamu (record.offenseVerb —
    // ukládá se už z index.html, viz katalog OFFENSES/offenseVerbForm) —
    // u starších záznamů bez tohoto pole appka spadne zpátky na
    // podstatné jméno (offenseLabelLower), aby dopis šel vygenerovat
    // i za cenu drobně horší gramatiky.
    const offenseVerbText = record.offenseVerb || offenseLabelLower;
    const loc = addressForLetter(record.address);

    // Termín dostavení se (datum + časové rozmezí) — appka ho teď bere
    // z pole v modálu "Výzva" (kalendář + čas od/do). Když by přesto
    // chybělo (starší volání funkce, chyba v UI), zůstává placeholder
    // k ručnímu dopsání, stejně jako dřív.
    const dostaveniDatumCasText = (dostaveniTermin && dostaveniTermin.datum)
      ? (dostaveniTermin.datum + (dostaveniTermin.casOd ? (' v čase ' + dostaveniTermin.casOd + (dostaveniTermin.casDo ? ' - ' + dostaveniTermin.casDo : '') + ' hod') : ''))
      : '[DOPLNIT DATUM A ČAS]';

    // Jméno/příjmení, datum narození a adresa se vyplní, pokud je appka
    // má z dialogu "Pachatel" (ručně zadané, ze skenu OP, nebo z
    // našeptávače Mapy.com u adresy trvalého pobytu) — co chybí, zůstává
    // jako placeholder k ručnímu dopsání.
    const pachatelJmeno = pachatel ? [pachatel.jmeno, pachatel.prijmeni].filter(Boolean).join(' ') : '';
    const pachatelUlice = pachatelBydlisteRadek1(pachatel);
    // PSČ + obec vedle sebe (appka posílá "PSČ obec" tak, jak ho vybral
    // z Mapy.com Suggest — pachatel.mesto tak už tenhle formát má).
    const headerLeft = [
      pachatelJmeno || '[DOPLNIT JMÉNO A PŘÍJMENÍ]',
      '',
      (pachatel && pachatel.datumNarozeni) || '[DOPLNIT DATUM NAROZENÍ]',
      '',
      pachatelUlice || '[DOPLNIT ULICE A ČP]',
      '',
      (pachatel && pachatel.mesto) || '[DOPLNIT PSČ A OBEC]'
    ];

    // GPS jako prokliknutelný odkaz na mapy.com — stejné bezklíčové URL
    // a stejný relEntries mechanismus jako u Oznámení (viz docRels níž).
    const relEntries = [];
    let relId = 100;
    let gpsRunXml = '';
    if(record.lat != null && record.lng != null){
      const gpsText = 'GPS: ' + Number(record.lat).toFixed(6) + ', ' + Number(record.lng).toFixed(6);
      const mapyUrl = 'https://mapy.com/fnc/v1/showmap?center=' + Number(record.lng) + ',' + Number(record.lat) + '&marker=true&zoom=17';
      relEntries.push({ id: relId, target: mapyUrl, type: 'hyperlink', targetMode: 'External' });
      gpsRunXml = docxHyperlinkRun(relId, gpsText, { size: 20 });
      relId++;
    }

    let body = '';
    body += docxHeaderTable(
      headerLeft,
      [
        { raw: docxPlaceholderFieldPara('Naše  č. j.: MP ' + new Date().getFullYear() + '/', 'doplň Č.j.:', { size: 19 }) },
        'Vyřizuje: str. ' + officerForDoc,
        'Tel.: ' + OZNAMENI_TEL,
        'E-mail: ' + OZNAMENI_EMAIL,
        '',
        'Datum: ' + todayCz()
      ],
      true
    );
    body += docxPara('', { size: 20 });
    body += docxPara('VÝZVA', { bold: true, size: 28, align: 'center', spacingAfter: 200 });

    // Stejná stavba věty jako u Oznámení (viz skutekRuns v
    // buildOznameniDocx) — datum+čas dostavení, popis skutku (slovesný
    // tvar) a vozidlo appka dává tučně, zbytek běžným řezem.
    const vehicleBoldPart = (record.brand ? (record.brand + ', ') : '') + 'RZ ' + (record.plate || '');
    let vyzvaRuns = docxRun('Žádáme Vás, abyste se dostavil(a) dne ', { size: 20 }) +
      docxRun(dostaveniDatumCasText, { size: 20, bold: true }) +
      docxRun(' na Městskou policii Blansko, Sadová č. 2, k podání vysvětlení podle § 11 odst. 1 zákona č. 553/1991 Sb., ' +
        'o obecní policii, ve znění pozdějších předpisů, ve věci objasnění skutečností důležitých pro odhalení pachatele ' +
        'přestupku podle ' + skutekBaseCite + ', kterého se dne ' + formatDateCz(record.date) + ' v ' + (record.time || '—') +
        ' hodin dopustil dosud neustanovený řidič vozidla ', { size: 20 }) +
      docxRun(vehicleBoldPart, { size: 20, bold: true }) +
      docxRun(' v ' + loc.city + (loc.locationPhrase ? ', ' + loc.locationPhrase : ''), { size: 20 });
    if(gpsRunXml){
      vyzvaRuns += docxRun(' (', { size: 20 }) + gpsRunXml + docxRun(')', { size: 20 });
    }
    vyzvaRuns += docxRun(' tím, že ', { size: 20 }) +
      docxRun(offenseVerbText, { size: 20, bold: true }) +
      docxRun(', čímž naplnil znaky přestupku podle ' + skutekSankceCite + '.', { size: 20 });
    body += '<w:p><w:pPr><w:spacing w:before="0" w:after="300"/></w:pPr>' + vyzvaRuns + '</w:p>';

    body += docxPara('Přineste s sebou tyto doklady:', { size: 20, spacingAfter: 60 });
    body += docxPara('- tuto výzvu', { size: 20 });
    body += docxPara('- doklad totožnosti', { size: 20, spacingAfter: 300 });

    body += docxPara(
      'Nedostavíte-li se bez dostatečné omluvy nebo bez závažného důvodu, můžete být dle § 11 odst. 9 zák. č. 553/91 Sb., ' +
      'o obecní policii, ve znění pozdějších předpisů, předveden(a).',
      { size: 20, spacingAfter: 400 }
    );

    body += docxPara('Ing. Martin Lepka', { size: 20, spacingBefore: 600 });
    body += docxPara('ředitel MP Blansko', { size: 20 });

    const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<w:body>' + body +
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/>' +
      '</w:sectPr></w:body></w:document>';

    const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '</Types>';

    const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';

    const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      relEntries.map(e => '<Relationship Id="rId' + e.id + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + xmlEscape(e.target) + '" TargetMode="External"/>').join('') +
      '</Relationships>';

    const zip = new JSZip();
    zip.file('[Content_Types].xml', contentTypes);
    zip.file('_rels/.rels', rootRels);
    zip.file('word/document.xml', documentXml);
    zip.file('word/_rels/document.xml.rels', docRels);

    return zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  async function buildOznameniDocx(record, photosB64, pachatel){
    // Viz stejný komentář u buildVyzvaDopisDocx — appka do hlavičky i
    // podpisu dává dořešujícího strážníka, ne zakladatele záznamu.
    const officerForDoc = currentOfficerName() || record.resolvedByOfficer || record.officerName || '';
    const offenseCitation = record.offenseCitation || '';
    const offenseLabel = record.offenseLabel || '';
    // Přesunuto sem (dřív se deklarovalo až u fotek) — appka teď relEntries
    // potřebuje dřív, kvůli prokliknutelnému GPS odkazu v "Popisu skutku".
    const mediaFiles = [];
    const relEntries = [];
    let relId = 100;
    let docId = 1;

    let body = '';
    body += docxHeaderTable(
      ['Městský úřad Blansko', 'Odbor dopravy', 'Oddělení dopravních přestupků', 'Nám. Republiky 1', '678 01 BLANSKO'],
      [
        { raw: docxPlaceholderFieldPara('Naše  č. j.: MP ' + new Date().getFullYear() + '/', 'doplň Č.j.:', { size: 19 }) },
        'Vyřizuje: str. ' + officerForDoc,
        'Tel.: ' + OZNAMENI_TEL,
        'E-mail: ' + OZNAMENI_EMAIL,
        '',
        'Datum: ' + todayCz()
      ]
    );
    body += docxPara('', { size: 20 });
    body += docxPara('Oznámení přestupku', { bold: true, size: 28, align: 'center', spacingAfter: 200 });

    // Základní ustanovení (např. § 4 písm. c)) a sankční ustanovení
    // (§ 125c...) appka potřebuje zvlášť (na dvou různých místech textu,
    // každé jednou s celým "zákona č. ..." a podruhé jako "téhož zákona").
    // Když se citaci z nějakého důvodu nepodaří rozparsovat (neobvyklý/
    // ruční formát), appka použije celou citaci tak, jak je, a "téhož
    // zákona" triky vynechá.
    const parsedCitation = parseOffenseCitation(offenseCitation);
    const offenseLabelLower = offenseLabel ? (offenseLabel.charAt(0).toLowerCase() + offenseLabel.slice(1)) : '';

    const introCite = parsedCitation
      ? (parsedCitation.sankce || parsedCitation.ref) + ' zákona č. ' + parsedCitation.law
      : offenseCitation;
    const intro = parsedCitation
      ? ('Podle § 10 odst. 2 zákona č. 553/1991 Sb., o obecní policii, ve znění pozdějších předpisů, ' +
         'Vám oznamuji podezření ze spáchání přestupku podle ' + introCite + ', porušením ' + parsedCitation.ref +
         ' téhož zákona' + (offenseLabelLower ? ' (' + offenseLabelLower + ')' : '') +
         ', kterého se dopustil dosud neustanovený řidič vozidla níže uvedené RZ a tovární značky, jehož jste provozovatelem.')
      : ('Podle § 10 odst. 2 zákona č. 553/1991 Sb., o obecní policii, ve znění pozdějších předpisů, ' +
         'Vám oznamuji podezření ze spáchání přestupku podle ' + introCite +
         (offenseLabelLower ? ' (' + offenseLabelLower + ')' : '') +
         ', kterého se dopustil dosud neustanovený řidič vozidla níže uvedené RZ a tovární značky, jehož jste provozovatelem.');
    body += docxPara(intro, { size: 20, spacingAfter: 200 });

    body += docxLabelValuePara('Registrační značka:', record.plate || '', { size: 20, spacingAfter: 200, valueBold: true });
    if(record.brand || record.color){
      body += docxLabelValuePara('Tovární značka, barva:', [record.brand, record.color].filter(Boolean).join(', '), { size: 20, spacingAfter: 200, valueBold: true });
    }
    // Jméno/datum narození se vyplní, pokud je má appka z dialogu
    // "Pachatel" (ručně zadané nebo ze skenu OP).
    const pachatelJmeno = pachatel ? [pachatel.prijmeni, pachatel.jmeno].filter(Boolean).join(' ') : '';
    body += docxLabelValuePara('Příjmení a jméno:', pachatelJmeno, { size: 20, spacingAfter: 200, valueBold: true });
    body += docxLabelValuePara('Datum narození:', (pachatel && pachatel.datumNarozeni) || '', { size: 20, spacingAfter: 200, valueBold: true });
    // Číslo OP appka do Oznámení záměrně nedává (na výslovné přání).
    // Bydliště na dvou řádcích (ulice+č.p. / PSČ+obec — pachatel.mesto už
    // je appkou uložené jako spojené "PSČ, Obec"), obojí tučně.
    const bydlisteUlice = pachatelBydlisteRadek1(pachatel);
    body += docxLabelValuePara('Bydliště:', bydlisteUlice, { size: 20, spacingAfter: 0, valueBold: true });
    body += docxLabelValuePara('', (pachatel && pachatel.mesto) || '', { size: 20, spacingAfter: 200, valueBold: true });

    body += docxPara('Popis skutku:', { bold: true, size: 20, spacingAfter: 100 });
    // GPS appka dává jako prokliknutelný odkaz na mapy.com (oficiální,
    // bezklíčové URL — viz https://mapy.com/fnc/v1/showmap) — relId se
    // registruje do stejného relEntries pole jako fotky, jen s typem
    // 'hyperlink' (viz docRels níž). Podle vzoru appka GPS odkaz nechává
    // běžným (netučným) řezem — proklik ale zůstává funkční stejně jako
    // předtím.
    let gpsRunXml = '';
    if(record.lat != null && record.lng != null){
      const gpsText = 'GPS: ' + Number(record.lat).toFixed(6) + ', ' + Number(record.lng).toFixed(6);
      const mapyUrl = 'https://mapy.com/fnc/v1/showmap?center=' + Number(record.lng) + ',' + Number(record.lat) + '&marker=true&zoom=17';
      relEntries.push({ id: relId, target: mapyUrl, type: 'hyperlink', targetMode: 'External' });
      gpsRunXml = docxHyperlinkRun(relId, gpsText, { size: 20 });
      relId++;
    }
    // Skutek appka staví zrcadlově k úvodnímu odstavci — tam měla "téhož
    // zákona" základní ustanovení, tady ho má sankční (aby se stejný
    // "zákon č. ..." v jednom souvislém textu neopakoval dvakrát zbytečně).
    const skutekSankceCite = parsedCitation
      ? (parsedCitation.sankce ? (parsedCitation.sankce + ' téhož zákona') : ('§ 125c odst. 1 téhož zákona'))
      : offenseCitation;
    const skutekBaseCite = parsedCitation ? (parsedCitation.ref + ' zákona č. ' + parsedCitation.law) : offenseCitation;
    // Slovesný tvar appka dostává přímo ze záznamu (record.offenseVerb —
    // appka ho ukládá už z index.html, viz katalog OFFENSES/offenseVerbForm)
    // — u starších záznamů, které tohle pole ještě nemají, appka spadne
    // zpátky na podstatné jméno (offenseLabelLower), aby dokument šel
    // vygenerovat i za cenu drobně horší gramatiky.
    const offenseVerbText = record.offenseVerb || offenseLabelLower;
    // Datum+čas, SPZ a právní kvalifikace appka dává tučně (na výslovné
    // přání) — zbytek věty běžným řezem.
    let skutekRuns = docxRun('Dne ', { size: 20 }) +
      docxRun(formatDateCz(record.date) + ' v ' + (record.time || '—'), { size: 20, bold: true }) +
      docxRun(' hodin se dosud neustanovený řidič vozidla registrační značky ', { size: 20 }) +
      docxRun(record.plate || '', { size: 20, bold: true }) +
      docxRun(' v ulici ' + (record.address || ''), { size: 20 });
    if(gpsRunXml){
      skutekRuns += docxRun(' (', { size: 20 }) + gpsRunXml + docxRun(')', { size: 20 });
    }
    skutekRuns += docxRun(' dopustil jednání v rozporu s ' + skutekBaseCite + ' tím, že ', { size: 20 }) +
      docxRun(offenseVerbText, { size: 20, bold: true }) +
      docxRun(', čímž naplnil znaky přestupku podle ' + skutekSankceCite + '.', { size: 20 });
    body += '<w:p><w:pPr><w:spacing w:before="0" w:after="200"/></w:pPr>' + skutekRuns + '</w:p>';


    body += docxPara('Lustrací byl(a) jako provozovatel výše uvedeného vozidla zjištěn(a) výše jmenovaný(á).', { size: 20, spacingAfter: 400 });

    // Podpisový blok + přílohy appka dává do patičky STRÁNKY 1 (Word
    // "different first page footer": w:titlePg + footerReference
    // type="first", viz sectPr/footer1.xml níž) — ne do běžného toku
    // textu. To je jediný spolehlivý způsob, jak to mít vždycky
    // fyzicky na spodním okraji stránky 1, ať je textu skutku nad tím
    // málo nebo hodně (umělá "spacingBefore" mezera to dřív u delšího
    // textu uměla přetéct na druhou stranu, viz screenshot) — a
    // zároveň se to nezopakuje na dalších stránkách (fotky/výzva/mapa),
    // protože appka pro ně žádnou "default" patičku nedefinuje.
    let footerBody = '';
    footerBody += docxPara('Ing. Martin Lepka', { size: 20 });
    footerBody += docxPara('ředitel MP Blansko', { size: 20, spacingAfter: 400 });
    footerBody += docxPara('Přílohy:', { size: 20 });
    footerBody += docxPara('- Výzva', { size: 20 });
    footerBody += docxPara('- Fotodokumentace', { size: 20 });
    footerBody += docxPara('- mapa místa přestupku', { size: 20 });

    // Fotky — každá na vlastní A4 stránce v běžné velikosti.
    if(photosB64.length){
      body += docxPara('Fotodokumentace', { bold: true, size: 24, align: 'center', spacingAfter: 200, pageBreakBefore: true });
      for(let i=0;i<photosB64.length;i++){
        const dims = await getImagePixelSize('data:image/jpeg;base64,' + photosB64[i]);
        const filename = 'image' + (i + 1) + '.jpeg';
        mediaFiles.push({ name: filename, bytes: base64ToUint8Array(photosB64[i]) });
        relEntries.push({ id: relId, target: 'media/' + filename });
        // První fotka má o něco nižší povolenou výšku než ostatní (220 mm
        // místo 240 mm) — jinak by se v plné výšce nevešla pod nadpis
        // "Fotodokumentace" na stejnou stránku a Word by ji sám přesunul
        // na další (prázdný nadpis nahoře, fotka sama o stránku dál).
        body += docxImageParagraph(relId, dims.w, dims.h, 170, i === 0 ? 220 : 240, docId, i > 0);
        relId++; docId++;
      }
    }

    // Výzva — úzký orámovaný blok v šíři 58 mm (odpovídá reálné šířce tiskárny).
    // Obsah je záměrně stejný jako to, co appka posílá na tepelnou tiskárnu
    // (viz buildEposPrintXml výše) — jméno strážníka tu ale zůstává celé
    // (na tisku je jen služební číslo, viz officerPrintLabel).
    const isBoticka = record.docType === 'boticka';
    body += docxPara('Výzva', { bold: true, size: 24, align: 'center', spacingAfter: 200, pageBreakBefore: true });
    let inner = '';
    inner += docxPara(isBoticka ? 'OZNÁMENÍ' : 'VÝZVA', { bold: true, size: 22, align: 'center' });
    inner += docxPara(isBoticka ? 'o použití technického prostředku k zabránění odjezdu vozidla' : 'pro nepřítomného pachatele přestupku', { size: 14, align: 'center' });
    if(record.noticeNumber) inner += docxPara(record.noticeNumber, { size: 24, align: 'center', spacingAfter: 100 });
    inner += docxPara(record.plate || '', { bold: true, size: 32, align: 'center' });
    inner += docxPara('Datum: ' + formatDateCz(record.date) + '  Čas: ' + (record.time || '—'), { size: 14, align: 'center', spacingAfter: 100 });
    if(record.address){
      inner += docxPara('Místo přestupku', { bold: true, size: 13, align: 'center' });
      inner += docxPara(record.address, { size: 14, align: 'center', spacingAfter: 100 });
    }
    if(offenseLabel){
      inner += docxPara('Právní kvalifikace', { bold: true, size: 13, align: 'center' });
      inner += docxPara(offenseLabel, { size: 14, align: 'center' });
      if(offenseCitation) inner += docxPara(offenseCitation, { size: 11, align: 'center', spacingAfter: 100 });
    }

    if(isBoticka){
      inner += docxPara(
        'Oznamuji Vám, že na výše uvedeném vozidle byl umístěn technický prostředek k zabránění ' +
        'odjezdu vozidla (TPZOV) dle § 17a zákona č. 553/1991 Sb., o obecní policii, a to z důvodu ' +
        'porušení pravidel uvedených výše.',
        { size: 14, align: 'center', spacingAfter: 100 }
      );
      inner += docxPara('pořízena fotodokumentace', { bold: true, size: 14, align: 'center', spacingAfter: 100 });
      inner += docxPara('POUČENÍ', { bold: true, size: 13, align: 'center' });
      inner += docxPara(
        'Technický prostředek bude odstraněn po projednání přestupku, nebo po zjištění totožnosti ' +
        'osoby, která vozidlo na místě ponechala, nebo po provedení nezbytných úkonů ke zjištění ' +
        'totožnosti této osoby.',
        { size: 14, align: 'center', spacingAfter: 100 }
      );
    } else {
      inner += docxPara(
        'Dostavte se proto ve vlastním zájmu, a to neprodleně na Městskou policii Blansko, Sadová 2. ' +
        'Tuto výzvu vezměte s sebou.',
        { size: 14, align: 'center', spacingAfter: 100 }
      );
      inner += docxPara('pořízena fotodokumentace', { bold: true, size: 14, align: 'center', spacingAfter: 100 });
      inner += docxPara('POUČENÍ', { bold: true, size: 13, align: 'center' });
      inner += docxPara(
        'Dle § 11/odst. 1 a 2, zák. 553/1991 Sb., o obecní policii je osoba povinna výzvě vyhovět. ' +
        'Nedostavíte-li se bez dostatečné omluvy, můžete být dle § 11/odst. 8 výše uvedeného zákona ' +
        'předveden(a) nebo může být přestupek oznámen příslušnému správnímu orgánu k projednání.',
        { size: 14, align: 'center', spacingAfter: 100 }
      );
    }

    if(officerForDoc){
      inner += docxPara('str. ' + officerForDoc, { bold: true, size: 14, align: 'center' });
    }
    inner += docxPara('Městská policie Blansko', { bold: true, size: 14, align: 'center' });
    inner += docxPara('Sadová 149/2, 678 01 Blansko', { size: 13, align: 'center' });
    inner += docxPara('Tel.: 775 859 486, 516 418 418', { size: 13, align: 'center', spacingAfter: 100 });
    inner += docxPara('vygenerováno aplikací', { size: 11, align: 'center' });
    inner += docxPara('RZ Scanner © Šuraj', { size: 11, align: 'center' });

    body += docxNarrowBoxTable(58, inner);

    // Mapa místa přestupku — poslední stránka dokumentu (za fotkami a
    // Výzvou), jen když appka má souřadnice. Mapy.com Static Maps API
    // (stejný účet/klíč jako Suggest/rgeocode výš) vrátí přímo obrázek
    // s vyznačeným bodem — appka ho vloží úplně stejně jako fotky.
    // Když se o obrázek z nějakého důvodu nepodaří (výpadek API, chybný
    // klíč, CORS...), appka mapu vynechá a zbytek dokumentu tím není
    // dotčený — ale NAVÍC (dočasně, kvůli ladění na mobilu bez
    // DevTools) appka přesnou chybu ukáže přes alert(), ať appka nemusí
    // sahat po Safari Web Inspectoru na počítači.
    if(record.lat != null && record.lng != null){
      try{
        const staticMapUrl = 'https://api.mapy.com/v1/static/map?' + new URLSearchParams({
          lon: String(record.lng), lat: String(record.lat), zoom: '17',
          width: '640', height: '480', mapset: 'basic',
          markers: 'color:red;size:normal;' + record.lng + ',' + record.lat,
          apikey: MAPY_API_KEY
        }).toString();
        const mapRes = await fetch(staticMapUrl);
        if(mapRes.ok){
          const mapBytes = new Uint8Array(await mapRes.arrayBuffer());
          const contentType = mapRes.headers.get('content-type') || 'image/jpeg';
          const ext = contentType.includes('png') ? 'png' : 'jpeg';
          const mapFilename = 'map.' + ext;
          mediaFiles.push({ name: mapFilename, bytes: mapBytes });
          relEntries.push({ id: relId, target: 'media/' + mapFilename });
          const mapDims = await getImagePixelSize('data:' + contentType + ';base64,' + uint8ArrayToBase64(mapBytes));
          body += docxPara('Mapa místa přestupku', { bold: true, size: 24, align: 'center', spacingAfter: 200, pageBreakBefore: true });
          body += docxImageParagraph(relId, mapDims.w, mapDims.h, 170, 240, docId, false);
          relId++; docId++;
        } else {
          alert('Mapa se nepodařila (HTTP ' + mapRes.status + ' ' + mapRes.statusText + ') — dokument bude bez mapy. URL: ' + staticMapUrl);
        }
      }catch(e){
        alert('Mapa se nepodařila (' + (e && e.message ? e.message : e) + ') — dokument bude bez mapy. Nejpravděpodobněji jde o CORS blokaci Static Maps endpointu prohlížečem.');
        console.error('Mapy.com static map selhala (appka mapu do dokumentu nepřidá):', e);
      }
    }

    const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<w:body>' + body +
      '<w:sectPr><w:footerReference w:type="first" r:id="rIdFooter1"/><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/>' +
      '<w:titlePg/>' +
      '</w:sectPr></w:body></w:document>';

    // Patička jen pro stránku 1 (w:titlePg výše zapíná odlišnou "first
    // page" patičku — appka žádnou "default" patičku pro další stránky
    // nedefinuje, takže se tam nic neopakuje).
    const footerXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
      footerBody +
      '</w:ftr>';

    const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Default Extension="jpeg" ContentType="image/jpeg"/>' +
      '<Default Extension="png" ContentType="image/png"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '<Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/>' +
      '</Types>';

    const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';

    const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rIdFooter1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>' +
      relEntries.map(e => e.type === 'hyperlink'
        ? '<Relationship Id="rId' + e.id + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="' + xmlEscape(e.target) + '" TargetMode="External"/>'
        : '<Relationship Id="rId' + e.id + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="' + e.target + '"/>'
      ).join('') +
      '</Relationships>';

    const zip = new JSZip();
    zip.file('[Content_Types].xml', contentTypes);
    zip.file('_rels/.rels', rootRels);
    zip.file('word/document.xml', documentXml);
    zip.file('word/footer1.xml', footerXml);
    zip.file('word/_rels/document.xml.rels', docRels);
    mediaFiles.forEach(m => zip.file('word/media/' + m.name, m.bytes));

    return zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  // window.open(blobUrl) nechá prohlížeč vymyslet vlastní název (obvykle
  // náhodné UUID blobu, ne skutečný název souboru) — anchor s atributem
  // download je jediný spolehlivý způsob, jak prohlížeči napovědět
  // požadované jméno stahovaného souboru.
  function downloadBlobWithFilename(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 60000);
  }

  async function exportOznameni(record, pachatel, filenameOverride){
    try{
      if(typeof JSZip === 'undefined'){
        setDetailNote('Export do Wordu se nepodařilo načíst (chybí knihovna JSZip — zkontrolujte připojení k internetu).', 'err');
        return false;
      }
      // Fotky mohly být v této session už dřív načtené (viz openDetail /
      // loadAndShowPhotos) — jinak je stejným způsobem dotáhneme teď.
      let photosB64 = record._resolvedPhotos;
      if(!photosB64 && record.hasPhotos){
        const doc = await db.collection('prestupky').doc(record.id).collection('data').doc('photos').get();
        const data = doc.exists ? doc.data() : null;
        photosB64 = (data && data.photos) || [];
        record._resolvedPhotos = photosB64;
        record._resolvedMime = (data && data.photoMime) || 'image/jpeg';
      }
      const blob = await buildOznameniDocx(record, photosB64 || [], pachatel);
      const filename = filenameOverride || ('Oznameni_' + (record.plate || 'prestupek').replace(/\s+/g,'') + '.docx');
      try{
        const file = new File([blob], filename, { type: blob.type });
        if(navigator.canShare && navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file] });
          return true;
        }
      }catch(e){
        // Uživatel sdílení zrušil nebo API není k dispozici — spadneme na
        // stažení pod skutečným názvem, stejně jako u ukládání fotek.
      }
      downloadBlobWithFilename(blob, filename);
      return true;
    }catch(e){
      console.error('Export Oznámení selhal:', e);
      setDetailNote('Vytvoření dokumentu se nezdařilo (' + e.message + ').', 'err');
      return false;
    }
  }

  function escapeXml(str){
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Zalomí text na mezerách po ~32 znacích (šířka řádku na 58mm papíře
  // TM-P20II), ať tiskárna nedělí slova napůl — viz stejná funkce a
  // podrobný komentář v index.html.
  function wrapWords(text, width){
    width = width || 32;
    return String(text == null ? '' : text).split('\n').map(function(line){
      if(line.length <= width) return line;
      const words = line.split(' ');
      const lines = [];
      let cur = '';
      words.forEach(function(w){
        if(cur === ''){
          cur = w;
        } else if((cur + ' ' + w).length <= width){
          cur += ' ' + w;
        } else {
          lines.push(cur);
          cur = w;
        }
      });
      if(cur) lines.push(cur);
      return lines.join('\n');
    }).join('\n');
  }

  function textEl(data, opts){
    opts = opts || {};
    const align = opts.align || 'left';
    const em = opts.em ? 'true' : 'false';
    const width = opts.width || 1;
    const height = opts.height || 1;
    return '<text align="' + align + '" em="' + em + '" width="' + width + '" height="' + height + '">' +
      escapeXml(data) + '</text>';
  }
