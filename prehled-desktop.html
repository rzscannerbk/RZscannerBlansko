  function epsonSoapEnvelope(innerXml){
    return '<?xml version="1.0" encoding="utf-8"?>' +
      '<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/">' +
      '<s:Body>' +
      '<epos-print xmlns="http://www.epson-pos.com/schemas/2011/03/epos-print">' +
      innerXml +
      '</epos-print>' +
      '</s:Body>' +
      '</s:Envelope>';
  }

  function epsonPrinterEndpoint(){
    const host = getPrinterHost();
    if(!host) return '';
    const base = /^https?:\/\//i.test(host) ? host.replace(/\/+$/, '') : 'https://' + host;
    return base + '/cgi-bin/epos/service.cgi?devid=local_printer&timeout=10000';
  }

  // Vrací Promise<boolean> — true jen když tiskárna potvrdí úspěšný tisk.
  // Díky tomu může volající (tlačítko Tisk i potvrzovací dialog u tlačítka
  // zpět) čekat na výsledek a reagovat na něj (např. teprve po úspěchu
  // opustit obrazovku detailu).
  function printViaEpson(record){
    return new Promise(async (resolve)=>{
      const host = getPrinterHost();
      if(!host){
        setDetailNote('Tiskárna není nastavená — otevři index.html appky a nastav IP tiskárny (⚙ Nastavit tiskárnu).', 'err');
        resolve(false);
        return;
      }
      setDetailNote('Tisknu…', '');

      const endpoint = epsonPrinterEndpoint();
      const body = epsonSoapEnvelope(buildEposPrintXml(record));

      async function attempt(mode){
        const controller = new AbortController();
        const timeoutId = setTimeout(()=>controller.abort(), 12000);
        try{
          const resp = await fetch(endpoint, {
            method: 'POST',
            mode,
            headers: { 'Content-Type': 'text/plain' },
            body,
            signal: controller.signal
          });
          clearTimeout(timeoutId);
          return { ok: true, resp };
        }catch(e){
          clearTimeout(timeoutId);
          return { ok: false, error: e };
        }
      }

      let result = await attempt('cors');
      if(result.ok){
        try{
          const text = await result.resp.text();
          const xml = new DOMParser().parseFromString(text, 'text/xml');
          const responseEl = xml.getElementsByTagName('response')[0];
          const success = !!responseEl && /^(1|true)$/i.test(responseEl.getAttribute('success') || '');
          if(success){
            setDetailNote('✓ Vytištěno', 'ok');
            currentRecordPrinted = true;
            resolve(true);
            return;
          }
          const code = responseEl ? responseEl.getAttribute('code') : null;
          setDetailNote('Tiskárna nahlásila chybu' + (code ? ' (' + code + ')' : '') + '.', 'err');
          resolve(false);
          return;
        }catch(e){
          // Odpověď dorazila, ale nešla přečíst (typicky CORS) — spadneme
          // do "no-cors" pokusu níže.
        }
      }

      const fallback = await attempt('no-cors');
      if(fallback.ok){
        setDetailNote('⚠ Tisk odeslán, ale tiskárna potvrzení nevrátila (CORS). Zkontroluj výtisk.', 'ok');
        currentRecordPrinted = true;
        resolve(true);
        return;
      }

      const bareHost = host.replace(/^https?:\/\//i, '').replace(/\/+$/, '');
      const msg = fallback.error && fallback.error.name === 'AbortError'
        ? 'Tiskárna neodpověděla včas — zkontroluj, že je zapnutá a telefon je připojený na stejnou síť/Wi-Fi Direct.'
        : 'Spojení s tiskárnou selhalo. Pokud jsi ještě v Safari nenavštívil https://' + bareHost + '/ ' +
          'a nepotvrdil certifikát tiskárny, udělej to nejdřív (stačí jednou).';
      setDetailNote(msg, 'err');
      resolve(false);
    });
  }


  // ---------- Lazy náhledy fotek v seznamu (jen desktop) ----------
  // Na mobilu je .record-thumb schovaný přes display:none, takže sem
  // IntersectionObserver kvůli chybějícímu layoutu vůbec nic nepošle —
  // appka tak na mobilu žádné fotky navíc nedotahuje (viz poznámka o
  // rychlosti seznamu u loadAndShowPhotos výše). Na desktopu se náhled
  // fotky dotáhne, teprve když řádek doopravdy vjede do viewportu.
  const thumbObserver = ('IntersectionObserver' in window)
    ? new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          if(!entry.isIntersecting) return;
          const el = entry.target;
          thumbObserver.unobserve(el);
          loadThumbFor(el, el.__record);
        });
      }, { rootMargin: '200px' })
    : null;

  function observeThumb(thumbEl, record){
    thumbEl.__record = record;
    if(thumbObserver){
      thumbObserver.observe(thumbEl);
    } else {
      // Prohlížeč bez IntersectionObserver (vzácné) — rovnou dotáhnout.
      loadThumbFor(thumbEl, record);
    }
  }

  // Sdílené dotažení fotek záznamu (subkolekce Firestore) — používá ho
  // jak líný náhled v řádku seznamu, tak fullscreen prohlížeč po kliknutí
  // na náhled. Výsledek se cachuje na record._resolvedPhotos, ať appka
  // fotky nedotahuje opakovaně.
  async function ensurePhotosLoaded(record){
    if(record._resolvedPhotos) return { photos: record._resolvedPhotos, mime: record._resolvedMime || 'image/jpeg' };
    const doc = await db.collection('prestupky').doc(record.id).collection('data').doc('photos').get();
    const data = doc.exists ? doc.data() : null;
    const photos = (data && data.photos) || [];
    const mime = (data && data.photoMime) || 'image/jpeg';
    record._resolvedPhotos = photos;
    record._resolvedMime = mime;
    return { photos, mime };
  }

  async function loadThumbFor(thumbEl, record){
    try{
      const { photos, mime } = await ensurePhotosLoaded(record);
      if(!photos.length){
        thumbEl.innerHTML = '<span class="record-thumb-placeholder">—</span>';
        thumbEl.classList.add('empty');
        return;
      }
      const img = document.createElement('img');
      img.src = 'data:' + mime + ';base64,' + photos[0];
      img.alt = 'Fotodokumentace';
      thumbEl.innerHTML = '';
      thumbEl.appendChild(img);
      if(photos.length > 1){
        const count = document.createElement('span');
        count.className = 'record-thumb-count';
        count.textContent = '+' + (photos.length - 1);
        thumbEl.appendChild(count);
      }
    }catch(e){
      console.error('Náhled fotky se nepodařilo načíst:', e);
      thumbEl.innerHTML = '<span class="record-thumb-placeholder">?</span>';
    }
  }

  // ---------- Fullscreen prohlížeč fotek ----------
  let lightboxPhotos = [];
  let lightboxMime = 'image/jpeg';
  let lightboxIndex = 0;

  function renderLightbox(){
    const img = document.getElementById('lightboxImg');
    img.src = 'data:' + lightboxMime + ';base64,' + lightboxPhotos[lightboxIndex];
    document.getElementById('lightboxCounter').textContent = (lightboxIndex + 1) + ' / ' + lightboxPhotos.length;
    const multi = lightboxPhotos.length > 1;
    document.getElementById('lightboxPrev').style.display = multi ? 'flex' : 'none';
    document.getElementById('lightboxNext').style.display = multi ? 'flex' : 'none';
    document.getElementById('lightboxCounter').style.display = multi ? 'block' : 'none';
  }

  async function openLightbox(record, thumbEl){
    if(thumbEl) thumbEl.classList.add('loading');
    try{
      const { photos, mime } = await ensurePhotosLoaded(record);
      if(thumbEl) thumbEl.classList.remove('loading');
      if(!photos.length) return;
      lightboxPhotos = photos;
      lightboxMime = mime;
      lightboxIndex = 0;
      renderLightbox();
      document.getElementById('lightboxOverlay').classList.add('open');
    }catch(e){
      if(thumbEl) thumbEl.classList.remove('loading');
      console.error('Fullscreen náhled se nepodařilo otevřít:', e);
    }
  }

  document.getElementById('lightboxOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'lightboxOverlay') closeLightbox();
  });
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightboxPrev').addEventListener('click', ()=>{
    lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
    renderLightbox();
  });
  document.getElementById('lightboxNext').addEventListener('click', ()=>{
    lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
    renderLightbox();
  });
  function closeLightbox(){
    document.getElementById('lightboxOverlay').classList.remove('open');
  }
  document.addEventListener('keydown', (e)=>{
    if(!document.getElementById('lightboxOverlay').classList.contains('open')) return;
    if(e.key === 'Escape') closeLightbox();
    if(e.key === 'ArrowLeft') document.getElementById('lightboxPrev').click();
    if(e.key === 'ArrowRight') document.getElementById('lightboxNext').click();
  });

  // Zkracuje opakující se úvod řady kvalifikací přestupků ("Řidič nesmí
  // zastavit a stát ..." / "Řidič smí zastavit a stát jen ...") jen pro
  // zobrazení v řádku seznamu — appka tím ušetří místo, protože tahle
  // fráze je naprosto stejná u drtivé většiny položek. Uložená data (a
  // detail/tisk/export) zůstávají beze změny, zkracuje se jen tenhle
  // jeden štítek v tabulce.
  function shortOffenseLabel(label){
    if(!label) return '';
    return label
      .replace(/^Řidič nesmí zastavit a stát /, '')
      .replace(/^Řidič smí zastavit a stát jen /, '');
  }

  // ---------- Filtry (postranní panel + rychlé datumové karty) ----------
  let filterStatus = 'all';   // 'all' | 'pending' | 'oznameni' | 'prikaz'
  let filterType = 'all';     // 'all' | 'vyzva' | 'boticka'
  let filterOfficer = 'all';  // 'all' | jméno strážníka
  let filterRange = 'all';    // 'all' | 'today' | 'week'

  function recordStatusKey(r){
    if(!r.resolved) return 'pending';
    if(r.resolvedMethod === 'oznameni') return 'oznameni';
    if(r.resolvedMethod === 'prikaz') return 'prikaz';
    if(r.resolvedMethod === 'domluva') return 'domluva';
    return 'prikaz'; // starší záznamy bez uloženého resolvedMethod
  }

  function passesFilters(r){
    if(filterStatus !== 'all' && recordStatusKey(r) !== filterStatus) return false;
    if(filterType !== 'all' && (r.docType || 'vyzva') !== filterType) return false;
    if(filterOfficer !== 'all' && r.officerName !== filterOfficer) return false;
    if(filterRange !== 'all'){
      if(!r.date) return false;
      const today = todayCz ? todayIso() : new Date().toISOString().slice(0,10);
      if(filterRange === 'today' && r.date !== today) return false;
      if(filterRange === 'week'){
        const d = new Date(r.date + 'T00:00:00');
        const now = new Date(); now.setHours(0,0,0,0);
        const diffDays = Math.round((now - d) / 86400000);
        if(isNaN(diffDays) || diffDays < 0 || diffDays > 6) return false;
      }
    }
    return true;
  }

  function todayIso(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
  }

  function renderRail(){
    const rail = document.getElementById('rail');
    const base = allRecords; // počty vždy z celé sady, ne z aktuálně filtrovaného pohledu
    const statusCounts = { pending:0, oznameni:0, prikaz:0, domluva:0 };
    const typeCounts = { vyzva:0, boticka:0 };
    const officerCounts = {};
    base.forEach(r=>{
      statusCounts[recordStatusKey(r)]++;
      typeCounts[(r.docType || 'vyzva') === 'boticka' ? 'boticka' : 'vyzva']++;
      if(r.officerName) officerCounts[r.officerName] = (officerCounts[r.officerName] || 0) + 1;
    });
    const officers = Object.keys(officerCounts).sort((a,b)=> officerCounts[b]-officerCounts[a]);

    function item(label, count, active, onClick, dotColor){
      const el = document.createElement('button');
      el.type = 'button';
      el.className = 'rail-item' + (active ? ' active' : '');
      el.innerHTML = (dotColor ? '<span class="dot" style="background:' + dotColor + '"></span>' : '') + '<span class="label">' + escapeHtml(label) + '</span>';
      const countEl = document.createElement('span');
      countEl.className = 'count';
      countEl.textContent = count;
      el.appendChild(countEl);
      el.addEventListener('click', onClick);
      return el;
    }
    function group(title){
      const g = document.createElement('div');
      g.className = 'rail-group';
      const t = document.createElement('div');
      t.className = 'rail-title';
      t.textContent = title;
      g.appendChild(t);
      return g;
    }

    rail.innerHTML = '';

    const gStatus = group('Stav');
    gStatus.appendChild(item('Vše', base.length, filterStatus === 'all', ()=>{ filterStatus='all'; refreshView(); }));
    gStatus.appendChild(item('Nevyřešené', statusCounts.pending, filterStatus === 'pending', ()=>{ filterStatus='pending'; refreshView(); }, 'var(--faint)'));
    gStatus.appendChild(item('Oznámeno', statusCounts.oznameni, filterStatus === 'oznameni', ()=>{ filterStatus='oznameni'; refreshView(); }, '#8FB6FF'));
    gStatus.appendChild(item('Dořešeno příkazem', statusCounts.prikaz, filterStatus === 'prikaz', ()=>{ filterStatus='prikaz'; refreshView(); }, 'var(--good)'));
    gStatus.appendChild(item('Dořešeno domluvou', statusCounts.domluva, filterStatus === 'domluva', ()=>{ filterStatus='domluva'; refreshView(); }, '#D9A94E'));
    rail.appendChild(gStatus);

    const gType = group('Typ dokumentu');
    gType.appendChild(item('Parkovačka', typeCounts.vyzva, filterType === 'vyzva', ()=>{ filterType = filterType==='vyzva' ? 'all' : 'vyzva'; refreshView(); }));
    gType.appendChild(item('Botička', typeCounts.boticka, filterType === 'boticka', ()=>{ filterType = filterType==='boticka' ? 'all' : 'boticka'; refreshView(); }));
    rail.appendChild(gType);

    const gOfficer = group('Strážník');
    if(officers.length === 0){
      const empty = document.createElement('div');
      empty.className = 'rail-empty';
      empty.textContent = 'Zatím žádné záznamy';
      gOfficer.appendChild(empty);
    } else {
      officers.forEach(name=>{
        gOfficer.appendChild(item(name, officerCounts[name], filterOfficer === name, ()=>{ filterOfficer = filterOfficer===name ? 'all' : name; refreshView(); }));
      });
    }
    rail.appendChild(gOfficer);
  }

  // Katalog přestupků pro našeptávač ve vyhledávání — sestavený z toho, co
  // appka skutečně ve Firestore vidí (ne z pevného seznamu 34 položek
  // v appce RZ Scanner), ať se nabízí jen to, co má smysl hledat.
  let offenseCatalog = [];
  function rebuildOffenseCatalog(){
    const counts = {};
    allRecords.forEach(r=>{
      if(!r.offenseLabel) return;
      counts[r.offenseLabel] = (counts[r.offenseLabel] || 0) + 1;
    });
    offenseCatalog = Object.keys(counts)
      .map(label=>({ label, count: counts[label] }))
      .sort((a,b)=> b.count - a.count || a.label.localeCompare(b.label, 'cs'));
  }

  function refreshView(){
    rebuildOffenseCatalog();
    renderRail();
    renderList(document.getElementById('searchInput').value);
  }

  document.getElementById('dateTabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-range]');
    if(!btn) return;
    filterRange = btn.dataset.range;
    document.querySelectorAll('#dateTabs button').forEach(b=>b.classList.toggle('active', b === btn));
    refreshView();
  });

  function renderList(filterText){
    const container = document.getElementById('listBody');
    const statusEl = document.getElementById('listStatus');
    const q = (filterText || '').trim().toLowerCase();

    let filtered = allRecords.filter(passesFilters);
    if(q){
      filtered = filtered.filter(r=>
        (r.plate || '').toLowerCase().includes(q) ||
        (r.address || '').toLowerCase().includes(q) ||
        (r.noticeNumber || '').toLowerCase().includes(q) ||
        (r.officerName || '').toLowerCase().includes(q) ||
        (r.offenseLabel || '').toLowerCase().includes(q)
      );
    }

    container.innerHTML = '';
    if(allRecords.length === 0){
      statusEl.textContent = 'Zatím žádné odeslané přestupky.';
      container.appendChild(statusEl);
      return;
    }
    if(filtered.length === 0){
      statusEl.textContent = q ? ('Žádná shoda pro „' + filterText + '“.') : 'Žádné záznamy neodpovídají zvolenému filtru.';
      container.appendChild(statusEl);
      return;
    }

    const statusLabel = { pending:'Nevyřešeno', oznameni:'Oznámeno', prikaz:'Dořešeno příkazem', domluva:'Dořešeno domluvou' };
    const statusDot = { pending:'var(--faint)', oznameni:'#8FB6FF', prikaz:'var(--good)', domluva:'#D9A94E' };

    filtered.forEach(r=>{
      const sKey = recordStatusKey(r);
      const isBoticka = (r.docType || 'vyzva') === 'boticka';

      const item = document.createElement('div');
      item.className = 'record-item' + (isBoticka ? ' boticka' : '') + (sKey !== 'pending' ? ' resolved' : '') + (r.id === (currentDetailRecord && currentDetailRecord.id) ? ' selected' : '');

      const stripe = document.createElement('span');
      stripe.className = 'stripe';
      item.appendChild(stripe);

      const plateCol = document.createElement('span');
      plateCol.className = 'record-plate-col';
      const plate = document.createElement('span');
      plate.className = 'record-plate mono';
      plate.textContent = r.plate || 'NEZNÁMÁ SPZ';
      plateCol.appendChild(plate);
      if(r.noticeNumber){
        const num = document.createElement('span');
        num.className = 'record-notice-number';
        num.textContent = r.noticeNumber;
        plateCol.appendChild(num);
      }
      item.appendChild(plateCol);

      const doctype = document.createElement('span');
      doctype.className = 'record-doctype-badge' + (isBoticka ? ' boticka' : '');
      doctype.textContent = isBoticka ? 'Botička' : 'Parkovačka';
      item.appendChild(doctype);

      const addr = document.createElement('span');
      addr.className = 'record-addr';
      addr.textContent = r.address || '—';
      item.appendChild(addr);

      const offense = document.createElement('span');
      offense.className = 'record-offense';
      offense.textContent = shortOffenseLabel(r.offenseLabel) || '—';
      if(r.offenseLabel) offense.title = r.offenseLabel;
      item.appendChild(offense);

      const status = document.createElement('span');
      status.className = 'record-status st-' + sKey;
      status.innerHTML = '<span class="dot" title="' + escapeHtml(statusLabel[sKey]) + '"></span>' + escapeHtml(statusLabel[sKey]);
      item.appendChild(status);

      const sentCol = document.createElement('span');
      sentCol.className = 'record-sent-col';
      const sentDate = document.createElement('span');
      sentDate.className = 'record-sent-date';
      sentDate.textContent = formatDateCz(r.date);
      sentCol.appendChild(sentDate);
      const sentTime = document.createElement('span');
      sentTime.className = 'record-sent-time';
      sentTime.textContent = (r.time || '') + (r.officerName ? ' · ' + r.officerName.split(' ')[0] : '');
      sentCol.appendChild(sentTime);
      item.appendChild(sentCol);

      // Náhled fotky — dotahuje se líně, teprve když řádek vjede do
      // viewportu (viz IntersectionObserver / observeThumb níže), ať
      // appka nezpomalí kvůli fotkám, které nikdo ani neuvidí. Kliknutí
      // na náhled otevře fullscreen prohlížeč místo detailu záznamu.
      const thumb = document.createElement('div');
      thumb.className = 'record-thumb';
      if(r.hasPhotos){
        thumb.innerHTML = '<span class="record-thumb-placeholder">📷</span>';
        observeThumb(thumb, r);
        thumb.addEventListener('click', (e)=>{
          e.stopPropagation();
          openLightbox(r, thumb);
        });
      } else {
        thumb.classList.add('empty');
        thumb.innerHTML = '<span class="record-thumb-placeholder">—</span>';
      }
      item.appendChild(thumb);

      item.addEventListener('click', ()=>{
        document.querySelectorAll('.record-item.selected').forEach(el=>el.classList.remove('selected'));
        item.classList.add('selected');
        openDetail(r);
      });
      container.appendChild(item);
    });
  }

  const searchInputEl = document.getElementById('searchInput');
  const searchSuggestionsEl = document.getElementById('searchSuggestions');

  function hideSuggestions(){
    searchSuggestionsEl.classList.remove('open');
    searchSuggestionsEl.innerHTML = '';
  }

  function showSuggestionsFor(query){
    const q = query.trim().toLowerCase();
    if(q.length < 2){ hideSuggestions(); return; }
    const matches = offenseCatalog.filter(o=> o.label.toLowerCase().includes(q)).slice(0, 8);
    if(!matches.length){ hideSuggestions(); return; }
    searchSuggestionsEl.innerHTML = '';
    matches.forEach(m=>{
      const item = document.createElement('div');
      item.className = 'search-suggestion-item';
      item.innerHTML = escapeHtml(m.label) + '<span class="suggestion-count">' + m.count + '×</span>';
      item.addEventListener('mousedown', (e)=>{
        // mousedown (ne click) — proběhne dřív než blur pole, ať se
        // dropdown nezavře dřív, než appka stihne zaregistrovat výběr.
        e.preventDefault();
        searchInputEl.value = m.label;
        hideSuggestions();
        renderList(m.label);
        searchInputEl.focus();
      });
      searchSuggestionsEl.appendChild(item);
    });
    searchSuggestionsEl.classList.add('open');
  }

  searchInputEl.addEventListener('input', (e)=>{
    renderList(e.target.value);
    showSuggestionsFor(e.target.value);
  });
  searchInputEl.addEventListener('focus', (e)=> showSuggestionsFor(e.target.value));
  searchInputEl.addEventListener('blur', ()=> setTimeout(hideSuggestions, 120));
  searchInputEl.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') hideSuggestions();
  });

  // ---------- Detail ----------
  let currentDetailRecord = null;
  let currentRecordPrinted = false;

  // Sazby pokut ukládaných příkazem na místě (§ 125c odst. 7 zákona
  // č. 361/2000 Sb., ve znění od 1. 1. 2026, pro položky 1-32; položka 33
  // je podle § 5 odst. 1 písm. g) zákona č. 251/2016 Sb., o některých
  // přestupcích). Klíč = přesný text label z OFFENSES v index.html
  // (uložený v record.offenseLabel), ať appka umí dohledat částku ke
  // konkrétnímu záznamu bez nutnosti ukládat nové pole do Firestore.
  const OFFENSE_PENALTIES = {
    'Řidič nesmí zastavit a stát v nepřehledné zatáčce a v její těsné blízkosti.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát před nepřehledným vrcholem stoupání, na něm a za ním.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát na přechodu pro chodce / přejezdu pro cyklisty nebo do 5 m před nimi.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát na křižovatce nebo do 5 m před a za její hranicí.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát v připojovacím nebo odbočovacím pruhu.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát v prostoru zastávky tramvaje, autobusu nebo trolejbusu.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát na železničním přejezdu, v podjezdu/tunelu nebo do 15 m od nich.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát v místě, kde vozidlo zakrývá dopravní značku.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát ve vyhrazeném jízdním pruhu nebo pruhu pro cyklisty.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát v jízdních pruzích mimo pravého jízdního pruhu.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát do 5 m od souvislé čáry nebo nástupního ostrůvku.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát na mostě.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát v tunelu (mimo vyznačené nouzové stání).': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát před vjezdem na komunikaci z polní nebo lesní cesty.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát na vyhrazeném parkovišti (jiné vozidlo, než pro které je vyhrazeno).': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát na tramvajovém pásu.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát na silniční vegetaci.': 'do 1 500 Kč',
    'Řidič nesmí zastavit a stát na jiném místě, kde je tím ohrožena bezpečnost provozu.': 'do 1 500 Kč',
    'Stání bez volného pruhu 3,5 m od tramvajové koleje (5:00–19:00)': 'do 1 500 Kč',
    'Mimo obec na silnici I., II. nebo III. třídy mimo vyznačené parkoviště': 'do 1 500 Kč',
    'Stání na dopravním okruhu ("Okruh" / "Změna směru okruhu")': 'do 1 500 Kč',
    'Řidič smí zastavit a stát jen vpravo ve směru jízdy co nejblíže k okraji pozemní komunikace.': 'do 1 500 Kč',
    'Řidič smí zastavit a stát jen v jedné řadě a rovnoběžně s okrajem pozemní komunikace.': 'do 1 500 Kč',
    'Nedodržení volného jízdního pruhu 3 m při zastavení/stání': 'do 1 500 Kč',
    'Stání na chodníku bez povolení dopravní značkou (IP 11d–IP 11g)': 'do 1 500 Kč',
    'Neoprávněné stání na parkovišti vyhrazeném pro ZTP (invalidy)': '2 500–3 500 Kč',
    'Zastavení nebo stání a způsobení překážky provozu': '2 500–3 500 Kč',
    'Porušení zákazu zastavení — B28': 'do 1 500 Kč',
    'Porušení zákazu stání — B29': 'do 1 500 Kč',
    'Nedovolené zastavení nebo stání vozidla (obecná kategorie)': 'do 1 500 Kč',
    'Porušení zákazu vjezdu — B1 (zákaz vjezdu všech vozidel)': 'do 1 500 Kč',
    'Porušení zákazu vjezdu — B2 (zákaz vjezdu všech motorových vozidel)': 'do 1 500 Kč',
    'Poškození nebo neoprávněný zábor veřejného prostranství': 'do 10 000 Kč',
  };
  function getOffensePenaltyText(record){
    const penalty = record && record.offenseLabel ? OFFENSE_PENALTIES[record.offenseLabel] : null;
    return penalty ? ('Příkaz na místě (' + penalty + ')') : 'Příkaz na místě';
  }

  // Na desktopu funguje běžné stažení přes <a download> spolehlivě (na
  // rozdíl od mobilního Safari, kde appka RZ Scanner / Přehled kvůli
  // tomu používá Web Share API) — soubor tak jde rovnou do složky
  // Stažené soubory, místo aby appka otevírala sdílecí okno Windows.
  function downloadPhoto(dataUrl, filename){
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function renderPhotoGallery(record, photos, mime){
    const gallery = document.getElementById('photoGallery');
    gallery.innerHTML = '';
    photos.forEach((b64, idx)=>{
      const dataUrl = 'data:' + mime + ';base64,' + b64;
      const filename = (record.plate || 'prestupek') + '_' + (idx + 1) + '.jpg';
      const item = document.createElement('div');
      item.className = 'photo-item';

      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = 'Fotodokumentace';
      item.appendChild(img);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'download-link';
      btn.textContent = 'Stáhnout fotku' + (photos.length > 1 ? ' ' + (idx + 1) : '');
      btn.addEventListener('click', ()=> downloadPhoto(dataUrl, filename));
      item.appendChild(btn);

      gallery.appendChild(item);
    });
  }

  function buildDetailHeadHtml(record){
    const parts = [];
    parts.push('<span class="detail-head-plate mono">' + escapeHtml(record.plate || 'NEZNÁMÁ SPZ') + '</span>');
    if(record.noticeNumber) parts.push('<span class="detail-head-meta mono">' + escapeHtml(record.noticeNumber) + '</span>');
    if(record.address) parts.push('<span class="detail-head-meta">' + escapeHtml(record.address) + '</span>');
    const dateTime = [record.date ? formatDateCz(record.date) : null, record.time || null].filter(Boolean).join(' ');
    if(dateTime) parts.push('<span class="detail-head-meta">' + escapeHtml(dateTime) + '</span>');
    if(record.officerName) parts.push('<span class="detail-head-meta">' + escapeHtml(record.officerName) + '</span>');
    let html = '<div class="detail-head-line1">' + parts.join('<span class="detail-head-meta">·</span>') + '</div>';
    if(record.offenseLabel) html += '<div class="detail-head-offense">' + escapeHtml(record.offenseLabel) + '</div>';
    return html;
  }

  function openDetail(record){
    currentDetailRecord = record;
    document.getElementById('detailHeadInfo').innerHTML = buildDetailHeadHtml(record);
    document.getElementById('noticeCardContainer').innerHTML = buildNoticeHtml(record);

    const photoToggleRow = document.getElementById('photoToggleRow');
    const photoToggleBtn = document.getElementById('photoToggleBtn');
    const photoWrap = document.getElementById('photoWrap');
    document.getElementById('photoGallery').innerHTML = '';
    photoWrap.classList.remove('open');
    photoToggleBtn.textContent = 'Foto';
    photoToggleBtn.disabled = false;

    // Older records still keep photos inline on the main document; newer
    // ones only have a `hasPhotos` flag and the actual bytes live in a
    // subcollection, fetched lazily below when "Foto" is tapped — this is
    // what keeps opening a record (and loading the list before it) fast.
    const legacyPhotos = record.photos && record.photos.length ? record.photos
      : (record.photoBase64 ? [record.photoBase64] : []);

    if(record._resolvedPhotos){
      // Fotky už byly v této session jednou staženy (ze subkolekce nebo
      // starého formátu) — obnovíme je z cache místo opětovného fetchování
      // a místo prázdné galerie po návratu do detailu.
      renderPhotoGallery(record, record._resolvedPhotos, record._resolvedMime || 'image/jpeg');
      photoToggleBtn.textContent = 'Foto' + (record._resolvedPhotos.length > 1 ? ' (' + record._resolvedPhotos.length + ')' : '');
      photoToggleRow.style.display = 'block';
      photoWrap.classList.add('open');
    } else if(legacyPhotos.length){
      record._resolvedPhotos = legacyPhotos;
      record._resolvedMime = record.photoMime || 'image/jpeg';
      renderPhotoGallery(record, legacyPhotos, record._resolvedMime);
      photoToggleBtn.textContent = 'Foto' + (legacyPhotos.length > 1 ? ' (' + legacyPhotos.length + ')' : '');
      photoToggleRow.style.display = 'block';
      photoWrap.classList.add('open');
    } else if(record.hasPhotos){
      // Appka teď fotky rovnou dotáhne a zobrazí, místo aby čekala na
      // klepnutí na "Foto" — stačí tedy jen zavolat stejnou logiku, kterou
      // by jinak spustil klik na tlačítko.
      photoToggleRow.style.display = 'block';
      loadAndShowPhotos(record);
    } else {
      photoToggleRow.style.display = 'none';
    }

    updateResolveBtn(record);
    setDetailNote('', '');
    currentRecordPrinted = false;
    prepareOznameniPreview(record);

    document.getElementById('detailModalOverlay').classList.add('open');
  }

  // Rovnou (na pozadí) připraví soubor Oznámení pro tenhle záznam, ať je
  // tlačítko "Otevřít" pod fotkami hned použitelné, bez čekání — používá
  // stejnou funkci jako běžný export z nabídky Dořešit → Oznámení.
  let currentOznameniBlob = null;
  async function prepareOznameniPreview(record){
    currentOznameniBlob = null;
    const statusEl = document.getElementById('docxPreviewStatus');
    const btn = document.getElementById('docxOpenBtn');
    statusEl.textContent = 'Připravuji náhled…';
    btn.disabled = true;
    try{
      if(typeof JSZip === 'undefined'){
        statusEl.textContent = 'Nepodařilo se načíst knihovnu pro Word.';
        return;
      }
      let photosB64 = record._resolvedPhotos;
      if(!photosB64 && record.hasPhotos){
        const res = await ensurePhotosLoaded(record);
        photosB64 = res.photos;
      }
      const blob = await buildOznameniDocx(record, photosB64 || []);
      // Modál mezitím mohl přepnout na jiný záznam — starý (už neplatný)
      // náhled v tom případě zahodíme.
      if(currentDetailRecord !== record) return;
      currentOznameniBlob = blob;
      statusEl.textContent = 'Náhled připraven';
      btn.disabled = false;
    }catch(e){
      console.error('Příprava náhledu Oznámení selhala:', e);
      if(currentDetailRecord === record) statusEl.textContent = 'Náhled se nepodařilo připravit.';
    }
  }

  document.getElementById('docxOpenBtn').addEventListener('click', async ()=>{
    if(!currentOznameniBlob || !currentDetailRecord) return;
    const url = URL.createObjectURL(currentOznameniBlob);
    window.open(url, '_blank');
    setTimeout(()=> URL.revokeObjectURL(url), 60000);
    if(!currentDetailRecord.resolved) await markResolved(currentDetailRecord, 'oznameni');
  });

  function updateResolveBtn(record){
    const menuBtn = document.getElementById('resolveMenuBtn');
    const vyresenoBtn = document.getElementById('menuVyresenoBtn');
    const domluvaBtn = document.getElementById('menuDomluvaBtn');
    const penaltyText = getOffensePenaltyText(record);
    if(record.resolved){
      // Text u horního tlačítka "Dořešit" se liší podle toho, jak byl
      // přestupek doopravdy vyřešen — starší záznamy bez uloženého
      // resolvedMethod (z appky před touhle úpravou) spadnou na obecné
      // "Dořešeno".
      if(record.resolvedMethod === 'oznameni'){
        menuBtn.textContent = '✓ Oznámeno';
      } else if(record.resolvedMethod === 'prikaz'){
        menuBtn.textContent = '✓ Dořešeno příkazem';
      } else if(record.resolvedMethod === 'domluva'){
        menuBtn.textContent = '✓ Dořešeno domluvou';
      } else {
        menuBtn.textContent = '✓ Dořešeno';
      }
      vyresenoBtn.textContent = '✓ ' + penaltyText;
      vyresenoBtn.disabled = true;
      domluvaBtn.textContent = record.resolvedMethod === 'domluva' ? '✓ Domluva' : 'Domluva';
      domluvaBtn.disabled = true;
    } else {
      menuBtn.textContent = 'Dořešit';
      vyresenoBtn.textContent = penaltyText;
      vyresenoBtn.disabled = false;
      domluvaBtn.textContent = 'Domluva';
      domluvaBtn.disabled = false;
    }
  }

  // Sdílené označení přestupku jako vyřešeného — volá se jak po úspěšném
  // otevření dokumentu "Oznámení", tak po klepnutí na "Příkaz na místě".
  // "method" rozlišuje, jaký text appka pak zobrazí (viz updateResolveBtn
  // a vykreslení odznaku v seznamu).
  async function markResolved(record, method){
    if(!record || record.resolved) return;
    // Shortens this record's Firestore TTL from the default 90 days
    // (set when it was created) to 60 days from now — the "expireAt"
    // field is what the TTL policy actually watches, so updating it is
    // enough; no need to move the document anywhere.
    const expireAt = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 60*24*60*60*1000));
    await db.collection('prestupky').doc(record.id).update({
      resolved: true,
      resolvedMethod: method,
      resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
      expireAt: expireAt
    });
    record.resolved = true;
    record.resolvedMethod = method;
    updateResolveBtn(record);
    refreshView();
  }

  // Zatím jen placeholder — šablona dokumentu "Výzva" (jiný typ než
  // stávající Oznámení) ještě není připravená. Až Lukáš dodá podklad,
  // nahradí se tělo této funkce skutečným generováním .docx stejně jako
  // u exportOznameni().
  async function exportVyzva(record){
    setDetailNote('Dokument „Výzva" zatím není připravený — tahle možnost bude funkční později.', 'err');
  }

  document.getElementById('resolveMenuBtn').addEventListener('click', ()=>{
    document.getElementById('resolveMenuOverlay').classList.add('open');
  });

  document.getElementById('menuCancelBtn').addEventListener('click', ()=>{
    document.getElementById('resolveMenuOverlay').classList.remove('open');
  });

  document.getElementById('menuOznameniBtn').addEventListener('click', async ()=>{
    document.getElementById('resolveMenuOverlay').classList.remove('open');
    const record = currentDetailRecord;
    if(!record) return;
    const opened = await exportOznameni(record);
    // Jen když se dokument doopravdy otevřel/stáhnul (ne při chybě) a jen
    // pokud přestupek ještě nebyl vyřešený jiným způsobem dřív.
    if(opened) markResolved(record, 'oznameni');
  });

  document.getElementById('menuVyzvaBtn').addEventListener('click', ()=>{
    document.getElementById('resolveMenuOverlay').classList.remove('open');
    if(currentDetailRecord) exportVyzva(currentDetailRecord);
  });

  document.getElementById('menuVyresenoBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record || record.resolved) return;
    document.getElementById('resolveMenuOverlay').classList.remove('open');
    const btn = document.getElementById('menuVyresenoBtn');
    btn.disabled = true;
    btn.textContent = 'Ukládám…';
    try{
      await markResolved(record, 'prikaz');
    }catch(e){
      console.error('Označení jako dořešeno selhalo:', e);
      btn.disabled = false;
      btn.textContent = 'Vyřešeno (chyba, zkuste znovu)';
    }
  });

  document.getElementById('menuDomluvaBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record || record.resolved) return;
    document.getElementById('resolveMenuOverlay').classList.remove('open');
    const btn = document.getElementById('menuDomluvaBtn');
    btn.disabled = true;
    btn.textContent = 'Ukládám…';
    try{
      await markResolved(record, 'domluva');
    }catch(e){
      console.error('Označení jako dořešeno selhalo:', e);
      btn.disabled = false;
      btn.textContent = 'Domluva (chyba, zkuste znovu)';
    }
  });

  // Sdílená logika stažení fotek ze subkolekce — volá ji jak automatické
  // otevření detailu (viz openDetail), tak ruční klik na tlačítko "Foto"
  // (např. po chybě, kdy je potřeba zkusit znovu).
  async function loadAndShowPhotos(record){
    const photoWrap = document.getElementById('photoWrap');
    const photoToggleBtn = document.getElementById('photoToggleBtn');
    photoToggleBtn.disabled = true;
    photoToggleBtn.textContent = 'Načítám…';
    try{
      const doc = await db.collection('prestupky').doc(record.id).collection('data').doc('photos').get();
      const data = doc.exists ? doc.data() : null;
      const photos = (data && data.photos) || [];
      const mime = (data && data.photoMime) || 'image/jpeg';
      record._resolvedPhotos = photos;
      record._resolvedMime = mime;
      renderPhotoGallery(record, photos, mime);
      photoToggleBtn.textContent = 'Foto' + (photos.length > 1 ? ' (' + photos.length + ')' : '');
      photoToggleBtn.disabled = false;
      photoWrap.classList.add('open');
    }catch(e){
      console.error('Načtení fotek selhalo:', e);
      photoToggleBtn.textContent = 'Foto (chyba)';
      photoToggleBtn.disabled = false;
    }
  }

  document.getElementById('photoToggleBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record) return;
    const photoWrap = document.getElementById('photoWrap');

    if(record._resolvedPhotos){
      photoWrap.classList.toggle('open');
      return;
    }

    await loadAndShowPhotos(record);
  });

  function closeDetailModal(){
    document.getElementById('detailModalOverlay').classList.remove('open');
    document.querySelectorAll('.record-item.selected').forEach(el=>el.classList.remove('selected'));
    currentDetailRecord = null;
  }
  document.getElementById('detailCloseBtn').addEventListener('click', closeDetailModal);
  document.getElementById('detailModalOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'detailModalOverlay') closeDetailModal();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && document.getElementById('detailModalOverlay').classList.contains('open')) closeDetailModal();
  });

})();
</script>
