<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RZ Scanner — Přehled (desktop)</title>
<meta name="theme-color" content="#0A0C10">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js" onerror="console.warn('JSZip se nenačetl — export Oznámení jako .docx nebude funkční.')"></script>
<!--
  Tisk na Epson TM-P20II přes ePOS-Print XML — stejná logika jako v
  index.html, žádný externí SDK soubor tu není potřeba (viz komentář
  u printViaEpson() níže).
-->
<style>
  :root{
    --asphalt:#0A0C10;
    --asphalt-2:#14171D;
    --asphalt-3:#1D2129;
    --asphalt-4:#262B33;
    --ink:#111214;
    --amber:#FFB020;
    --amber-dim:#7A5713;
    --amber-glow:rgba(255,176,32,.14);
    --text:#ECEDEF;
    --muted:#8B92A0;
    --faint:#5A6270;
    --good:#33D399;
    --good-glow:rgba(51,211,153,.13);
    --bad:#FF6058;
    --line:#262B33;
    --line-soft:#1B1F27;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{
    background:
      radial-gradient(1200px 800px at 50% -10%, rgba(255,176,32,.05), transparent 60%),
      var(--asphalt);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Roboto Mono',monospace;}
  h1,h2{font-family:'Oswald',sans-serif; font-weight:600; letter-spacing:.02em; margin:0;}

  #app{height:100vh; display:flex; flex-direction:column;}
  .view{display:none; flex:1; min-height:0; flex-direction:column;}
  .view.active{display:flex;}

  .btn{
    padding:10px 18px; border-radius:10px; font-size:13.5px; font-weight:600;
    border:1px solid var(--line); cursor:pointer; font-family:inherit;
    background:var(--asphalt-3); color:var(--text);
  }
  .btn-primary{background:var(--amber); border-color:var(--amber); color:#241a00;}
  .btn-ghost{background:transparent;}
  .btn:hover{border-color:var(--faint);}
  .btn-primary:hover{opacity:.92; border-color:var(--amber);}
  .btn[disabled]{opacity:.5; pointer-events:none;}
  .submit-note{margin-top:12px; text-align:center; font-size:12.5px; font-family:'Roboto Mono',monospace; display:none;}
  .submit-note.ok{color:var(--good);}
  .submit-note.err{color:var(--bad);}

  /* ---------- LOGIN ---------- */
  #loginScreen.view.active{display:flex; align-items:center; justify-content:center; padding:32px;}
  #loginScreen .login-box{
    width:100%; max-width:400px; background:var(--asphalt-2); border:1px solid var(--line);
    border-radius:20px; padding:40px 36px; box-shadow:0 24px 70px rgba(0,0,0,.5);
  }
  #loginScreen h1{font-size:22px; text-transform:uppercase; margin-bottom:6px;}
  #loginScreen p.hint{color:var(--muted); font-size:13px; line-height:1.5; margin:0 0 26px;}
  .field{background:var(--asphalt-3); border:1px solid var(--line); border-radius:12px; padding:10px 14px; margin-bottom:14px;}
  .field label{display:block; font-size:10.5px; color:var(--muted); font-family:'Roboto Mono',monospace; letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px;}
  .field input{width:100%; background:transparent; border:none; color:var(--text); font-size:15px; font-family:'Inter',sans-serif; padding:2px 0; outline:none;}
  #loginError{color:var(--bad); font-size:12.5px; margin:10px 0 0; display:none; line-height:1.4;}

  /* ---------- TOPBAR ---------- */
  .topbar{
    height:64px; flex:0 0 64px; display:flex; align-items:center; gap:24px;
    padding:0 26px; border-bottom:1px solid var(--line); background:var(--asphalt-2);
  }
  .brand{display:flex; align-items:baseline; gap:10px; flex:0 0 auto; text-decoration:none; color:inherit;}
  .brand .mark{
    width:30px; height:30px; border-radius:7px;
    background:linear-gradient(155deg, var(--amber), #C4790E);
    display:flex; align-items:center; justify-content:center;
    font-family:'Roboto Mono',monospace; font-weight:700; font-size:12.5px; color:#1A1200;
  }
  .brand .word{font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; letter-spacing:.02em;}
  .brand .word span{color:var(--muted); font-weight:400; font-family:'Inter',sans-serif; letter-spacing:0;}

  .searchbox-wrap{position:relative; flex:1 1 auto; max-width:440px;}
  .searchbox{
    display:flex; align-items:center; gap:9px;
    background:var(--asphalt-3); border:1px solid var(--line); border-radius:9px;
    padding:0 13px; height:37px;
  }
  .searchbox svg{flex:0 0 auto; opacity:.5;}
  .searchbox input{background:none; border:none; outline:none; color:var(--text); font-family:inherit; font-size:13.5px; width:100%;}
  .searchbox input::placeholder{color:var(--faint);}

  .search-suggestions{
    display:none; position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:40;
    background:var(--asphalt-3); border:1px solid var(--line); border-radius:10px;
    box-shadow:0 14px 34px rgba(0,0,0,.45); max-height:300px; overflow-y:auto;
  }
  .search-suggestions.open{display:block;}
  .search-suggestion-item{
    padding:10px 14px; font-size:12.5px; color:var(--text); cursor:pointer;
    border-bottom:1px solid var(--line-soft); line-height:1.4;
  }
  .search-suggestion-item:last-child{border-bottom:none;}
  .search-suggestion-item:hover, .search-suggestion-item.active{background:var(--asphalt-4);}
  .search-suggestion-item .suggestion-count{color:var(--faint); font-family:'Roboto Mono',monospace; font-size:10.5px; margin-left:6px;}

  .date-tabs{display:flex; gap:2px; background:var(--asphalt-3); border:1px solid var(--line); border-radius:8px; padding:3px; flex:0 0 auto;}
  .date-tabs button{border:none; background:none; color:var(--muted); font-family:inherit; font-size:12.5px; font-weight:500; padding:6px 13px; border-radius:6px; cursor:pointer;}
  .date-tabs button.active{background:var(--asphalt-4); color:var(--text);}

  .topbar-spacer{flex:1;}
  .backlink{color:var(--muted); font-size:13px; text-decoration:none; flex:0 0 auto; padding:8px 4px;}
  .backlink:hover{color:var(--text);}
  .icon-btn{
    flex:0 0 auto; width:34px; height:34px; border-radius:9px; background:var(--asphalt-3);
    border:1px solid var(--line); color:var(--muted); font-size:16px; cursor:pointer; line-height:1;
  }
  .icon-btn:hover{color:var(--text); border-color:var(--faint);}
  .icon-btn.active{color:var(--amber); border-color:var(--amber-dim); background:var(--amber-glow);}
  .shift-pill{display:flex; align-items:center; gap:9px; flex:0 0 auto; padding:5px 6px 5px 5px; border:1px solid var(--line); border-radius:20px; background:var(--asphalt-3);}
  .shift-pill .avatar{
    width:26px; height:26px; border-radius:50%; background:var(--amber-glow); color:var(--amber);
    border:1px solid var(--amber-dim); display:flex; align-items:center; justify-content:center;
    font-family:'Roboto Mono',monospace; font-size:10.5px; font-weight:700;
  }
  .shift-pill .txt{font-size:12px; line-height:1.25;}
  .shift-pill .txt b{display:block; font-weight:600;}
  .shift-pill button.logout{
    border:none; background:none; color:var(--faint); font-family:inherit; font-size:11px;
    cursor:pointer; padding:4px 8px 4px 2px; text-decoration:underline;
  }
  .shift-pill button.logout:hover{color:var(--bad);}

  /* ---------- BODY LAYOUT ---------- */
  .body-row{flex:1; display:flex; min-height:0;}

  /* ---------- RAIL ---------- */
  .rail{width:230px; flex:0 0 230px; border-right:1px solid var(--line); background:var(--asphalt-2); padding:20px 14px; overflow-y:auto;}
  .rail-group{margin-bottom:24px;}
  .rail-title{font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); padding:0 10px 8px;}
  .rail-item{display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:7px; cursor:pointer; font-size:13.5px; color:#D7DAE1; margin-bottom:1px; border:none; background:none; width:100%; font-family:inherit; text-align:left;}
  .rail-item:hover{background:var(--asphalt-3);}
  .rail-item.active{background:var(--amber-glow); color:var(--amber); font-weight:600;}
  .rail-item .label{display:flex; align-items:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .rail-item .count{font-family:'Roboto Mono',monospace; font-size:11px; color:var(--faint); background:var(--asphalt-4); border-radius:10px; padding:1px 7px; flex:0 0 auto; margin-left:8px;}
  .rail-item.active .count{color:var(--amber); background:rgba(255,176,32,.16);}
  .rail-item .dot{width:7px; height:7px; border-radius:50%; margin-right:9px; flex:0 0 auto;}
  .rail-empty{color:var(--faint); font-size:12px; padding:6px 10px;}

  /* ---------- LIST ---------- */
  .list-area{flex:1; min-width:0; display:flex; flex-direction:column;}
  .list-head{
    display:grid; grid-template-columns: 3px 122px 96px 100px 1fr 150px 130px 64px;
    padding:0 22px; height:36px; align-items:center; flex:0 0 auto;
    font-size:10.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--faint); border-bottom:1px solid var(--line); gap:0 10px;
  }
  .list-head span{text-align:center;}
  .list-head span.head-left{text-align:left;}
  #listBody{flex:1; overflow-y:auto;}
  .list-empty{text-align:center; color:var(--muted); font-size:13.5px; margin-top:60px; line-height:1.6;}

  .record-item{
    display:grid; grid-template-columns: 3px 122px 96px 100px 1fr 150px 130px 64px;
    align-items:start; padding:12px 22px; min-height:74px; cursor:pointer;
    border-bottom:1px solid var(--line-soft); position:relative; gap:0 10px;
    background:rgba(51,211,153,.05);
  }
  .record-item:hover{background:var(--asphalt-2);}
  .record-item.selected{background:var(--asphalt-3);}
  .record-item.resolved{background:rgba(0,0,0,.3);}
  .record-item.resolved:hover{background:rgba(0,0,0,.16);}
  .record-item.resolved .record-plate,
  .record-item.resolved .record-addr,
  .record-item.resolved .record-offense,
  .record-item.resolved .record-sent-date,
  .record-item.resolved .record-sent-time{color:var(--faint);}
  .record-item .stripe{width:3px; align-self:stretch; border-radius:2px; background:#5D9CFF;}
  .record-item.boticka .stripe{background:var(--amber);}

  .record-plate-col{display:flex; flex-direction:column; gap:3px; padding-top:1px;}
  .record-plate{font-family:'Roboto Mono',monospace; font-weight:700; font-size:15px; letter-spacing:.02em; line-height:1.3;}
  .record-notice-number{font-family:'Roboto Mono',monospace; font-size:10.5px; color:var(--faint); letter-spacing:.02em;}

  .record-doctype-badge{font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; width:fit-content; letter-spacing:.02em; color:#8FB6FF; background:rgba(93,156,255,.14); margin-top:2px; justify-self:center;}
  .record-doctype-badge.boticka{color:var(--amber); background:var(--amber-glow);}

  .record-addr{font-size:12.5px; color:var(--muted); line-height:1.4; padding-top:3px; padding-right:10px; text-align:center;}

  .record-offense{
    font-size:12.5px; color:#C7CBD3; line-height:1.4; padding-right:16px; padding-top:3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:help;
  }

  .record-status{display:flex; align-items:center; gap:8px; padding-top:5px; font-size:12px; color:var(--muted);}
  .record-status .dot{width:10px; height:10px; border-radius:50%; flex:0 0 auto; background:var(--faint); cursor:help;}
  .record-status.st-oznameno .dot{background:#8FB6FF;}
  .record-status.st-prikaz .dot{background:var(--good);}

  .record-sent-col{display:flex; flex-direction:column; align-items:center; gap:3px; padding-top:1px; text-align:center;}
  .record-sent-date{font-family:'Roboto Mono',monospace; font-size:11px; color:var(--faint);}
  .record-sent-time{font-family:'Roboto Mono',monospace; font-size:12px; color:var(--muted);}

  .record-thumb{
    width:52px; height:52px; border-radius:9px; background:var(--asphalt-4); border:1px solid var(--line);
    overflow:hidden; display:flex; align-items:center; justify-content:center; justify-self:end;
    color:var(--faint); font-size:16px; position:relative; cursor:zoom-in;
  }
  .record-thumb:hover{border-color:var(--faint);}
  .record-thumb.empty{cursor:default;}
  .record-thumb.loading{opacity:.5; cursor:wait;}
  .record-thumb img{width:100%; height:100%; object-fit:cover;}
  .record-thumb-count{
    position:absolute; right:2px; bottom:2px; background:rgba(0,0,0,.7); color:#fff;
    font-size:9px; font-weight:700; padding:0 4px; border-radius:7px; font-family:'Roboto Mono',monospace;
  }

  /* ---------- FULLSCREEN PROHLÍŽEČ FOTEK ---------- */
  .lightbox-overlay{
    display:none; position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.92);
    align-items:center; justify-content:center;
  }
  .lightbox-overlay.open{display:flex;}
  .lightbox-img{max-width:88vw; max-height:88vh; border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .lightbox-close{
    position:absolute; top:22px; right:26px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#fff;
    font-size:16px; cursor:pointer;
  }
  .lightbox-close:hover{background:rgba(255,255,255,.16);}
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:52px; height:52px; border-radius:50%;
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:#fff;
    font-size:26px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .lightbox-nav:hover{background:rgba(255,255,255,.16);}
  .lightbox-nav.prev{left:26px;}
  .lightbox-nav.next{right:26px;}
  .lightbox-counter{
    position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    font-family:'Roboto Mono',monospace; font-size:12.5px; color:rgba(255,255,255,.7);
    background:rgba(255,255,255,.08); padding:5px 12px; border-radius:20px;
  }

  /* ---------- DETAIL MODAL ---------- */
  .detail-modal-overlay{
    display:none; position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6);
    align-items:center; justify-content:center; padding:32px;
  }
  .detail-modal-overlay.open{display:flex;}
  .detail-modal{
    width:100%; max-width:780px; max-height:88vh; display:flex; flex-direction:column;
    background:var(--asphalt-2); border:1px solid var(--line); border-radius:16px;
    box-shadow:0 30px 90px rgba(0,0,0,.6); overflow:hidden;
  }
  .panel-head{position:relative; display:flex; align-items:center; justify-content:center; padding:16px 48px; border-bottom:1px solid var(--line); flex:0 0 auto; gap:14px;}
  .panel-head .id{font-size:12px; color:var(--faint);}
  .detail-head-info{display:flex; flex-direction:column; align-items:center; gap:5px; min-width:0; text-align:center;}
  .detail-head-line1{display:flex; align-items:baseline; justify-content:center; flex-wrap:wrap; gap:5px 10px; color:#fff; font-weight:700;}
  .detail-head-plate{font-weight:800; font-size:14px; color:#fff; letter-spacing:.02em;}
  .detail-head-meta{font-size:12px; color:#fff; font-weight:700; white-space:nowrap;}
  .detail-head-offense{font-size:12px; color:#fff; font-weight:600; line-height:1.35;}
  .panel-head button{position:absolute; right:22px; top:50%; transform:translateY(-50%); background:none; border:1px solid var(--line); color:var(--muted); width:28px; height:28px; border-radius:7px; cursor:pointer; font-size:13px;}
  .panel-head button:hover{color:var(--text); border-color:var(--faint);}
  #detailPreviewWrap{
    flex:1; overflow-y:auto; padding:28px 26px; background:transparent;
    display:flex; flex-direction:row; align-items:flex-start; justify-content:center;
    gap:26px; flex-wrap:wrap;
  }
  #noticeCardContainer{flex:1 1 340px; max-width:400px;}
  .panel-actions{display:flex; justify-content:center; padding:16px 22px; border-top:1px solid var(--line); flex:0 0 auto;}
  .panel-actions .btn{flex:0 0 auto; padding:10px 28px;}

  .status-line{
    display:flex; align-items:center; gap:9px; margin-top:18px; padding:11px 13px; border-radius:9px;
    background:var(--asphalt-3); border:1px solid var(--line); font-size:12.5px; color:var(--muted); font-weight:600;
  }
  .status-line.ok{background:var(--good-glow); border-color:rgba(51,211,153,.25); color:var(--good);}
  .status-line .dot{width:7px; height:7px; border-radius:50%; background:currentColor;}

  /* ---------- NOTICE CARD (stejný vzhled jako v appce Přehled na mobilu) ---------- */
  .notice-card{
    background:#ffffff; color:#141414; border-radius:14px; padding:28px 22px 24px;
    font-family:'Inter',sans-serif; text-align:center; width:100%; margin:0;
    box-shadow:0 14px 34px rgba(0,0,0,.35);
  }
  .notice-title{font-family:'Oswald',sans-serif; font-weight:700; font-size:25px; letter-spacing:.03em; margin:0 0 4px; text-transform:uppercase;}
  .notice-subtitle{color:#777; font-size:12px; margin:0 0 17px;}
  .notice-subtitle-boticka{font-size:17px; font-weight:700; color:#333;}
  .notice-number{color:#666; font-size:22px; letter-spacing:.03em; margin:-9px 0 17px; font-weight:800;}
  .notice-officer{font-weight:600; font-size:11px; color:#555; margin-bottom:4px;}
  .notice-label{color:#999; font-weight:700; font-size:11px; letter-spacing:.08em; text-transform:uppercase; margin-bottom:8px;}
  .notice-platebox{
    display:inline-block; border:1.6px solid #181818; border-radius:10px;
    padding:11px 22px; font-family:'Oswald',sans-serif; font-weight:700; font-size:27px;
    letter-spacing:.03em; margin-bottom:14px;
  }
  .notice-vehicle{font-size:14px; color:#555; margin:-8px 0 18px; font-weight:600;}
  .notice-datetime{font-size:15.5px; margin-bottom:20px; color:#222;}
  .notice-section{margin-bottom:16px;}
  .notice-heading{font-weight:700; font-size:12px; display:inline-block; border-bottom:1.5px solid #181818; padding-bottom:3px; margin-bottom:8px;}
  .notice-address{font-size:14.5px; color:#333;}
  .notice-offense-label{font-size:13.5px; color:#333; line-height:1.45;}
  .notice-offense-ref{font-size:12px; color:#555; margin-top:4px;}
  .notice-instructions{margin-top:18px; padding-top:14px; border-top:1px solid #eee; font-size:11.5px; line-height:1.55; color:#333; text-align:center;}
  .notice-instructions b{font-weight:700;}
  .notice-instructions .heading-caps{font-weight:700; letter-spacing:.04em; text-transform:uppercase; display:block; margin:10px 0 6px;}
  .notice-footer{margin-top:22px; padding-top:14px; border-top:1px solid #eee;}
  .notice-footer .authority{font-weight:700; font-size:10px; color:#555;}
  .notice-footer .authority-addr{font-size:9.5px; color:#999; margin-top:2px;}
  .notice-footer .authority-phone{font-size:9.5px; color:#999; margin-top:2px;}
  .notice-footer .generated-by{font-size:9.5px; color:#aaa; margin-top:10px;}

  .photo-toggle-row{display:none !important;}
  .notice-photo-wrap{margin-top:18px; display:block;}

  .docx-preview{
    margin-top:14px; display:flex; align-items:center; gap:10px;
    background:var(--asphalt-3); border:1px solid var(--line); border-radius:11px; padding:10px 12px;
  }
  .docx-preview-icon{font-size:22px; flex:0 0 auto;}
  .docx-preview-info{flex:1; min-width:0;}
  .docx-preview-title{font-size:12.5px; font-weight:600; color:var(--text);}
  .docx-preview-status{font-size:11px; color:var(--faint); margin-top:2px;}
  .docx-preview .btn{flex:0 0 auto; padding:8px 16px; font-size:12.5px;}
  .photo-item{margin-bottom:14px;}
  .photo-item:last-child{margin-bottom:0;}
  .photo-item img{width:100%; border-radius:12px; display:block;}
  .photo-item a.download-link, .photo-item button.download-link{
    display:block; width:100%; text-align:center; margin-top:6px; font-size:12px;
    color:var(--muted); text-decoration:underline; background:none; border:none;
    font-family:inherit; cursor:pointer; padding:5px 0;
  }

  /* ---------- DOŘEŠIT dialog (beze změny oproti appce na mobilu) ---------- */
  .confirm-overlay{
    display:none; position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.55);
    align-items:center; justify-content:center; padding:24px;
  }
  .confirm-overlay.open{display:flex;}
  .confirm-box{
    background:var(--asphalt-2); border:1px solid var(--line); border-radius:16px;
    padding:22px 20px; max-width:320px; width:100%; text-align:center;
  }
  .confirm-text{font-size:15.5px; color:var(--text); margin-bottom:18px; line-height:1.4;}
  .confirm-btns{display:flex; gap:12px;}
  .confirm-btns-col{flex-direction:column;}
  .confirm-btn{
    flex:1; padding:11px 12px; border-radius:10px; font-family:'Inter',sans-serif;
    font-weight:600; font-size:14.5px; cursor:pointer; line-height:1.3; border:none;
  }
  .confirm-no{background:transparent; border:1.5px solid var(--line); color:var(--text);}
  .confirm-no:hover{border-color:var(--faint);}
  .confirm-yes{background:#2F6FED; border:1.5px solid #2F6FED; color:#fff;}
  .confirm-yes:hover{opacity:.9;}
  .confirm-cancel{background:transparent; border:none; color:var(--muted); font-size:13.5px; margin-top:4px; cursor:pointer; font-family:inherit;}

  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--asphalt-4); border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
</style>

<script>
(function(){
  // ---------- Oprava výšky viewportu na iOS Safari ----------
  // Stejný fix jako v index.html — iOS Safari nespolehlivě počítá výšku
  // pro position:fixed;inset:0, po sbalení adresního řádku appka
  // nezaplní celou obrazovku a dole zůstane černá mezera. JS změří
  // skutečnou výšku viditelné plochy a uloží ji do CSS proměnné
  // --app-height, na kterou jsou obrazovky (.screen) navázané.
  function setAppHeight(){
    const h = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', ()=>setTimeout(setAppHeight, 100));
  window.addEventListener('load', setAppHeight);
  document.addEventListener('pageshow', setAppHeight);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setAppHeight(); });
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', setAppHeight);
  }
  // Appka spuštěná z plochy (standalone) hlásí při startu na iOS občas
  // ještě neustálenou výšku (probíhá spouštěcí animace) — přeměříme
  // ještě několikrát s prodlevou, ať se appka doopravdy natáhne na celou
  // obrazovku i po doběhnutí přechodu.
  [50, 150, 300, 600, 1000, 1500].forEach(ms => setTimeout(setAppHeight, ms));

  // Respektuje volbu tématu nastavenou v index.html (4s podržení loga na
  // úvodní obrazovce appky) — samotné gesto tady není, jen se drží stejná
  // paleta jako zbytek appky.
  try{
    if(localStorage.getItem('rzTheme') === 'light'){
      document.documentElement.classList.add('light-theme');
    }
  }catch(e){}

  const screens = {
    login: document.getElementById('loginScreen'),
    main: document.getElementById('mainScreen'),
  };
  function show(name){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[name].classList.add('active');
  }

  // ---------- Firebase ----------
  const firebaseConfig = {
    apiKey: "AIzaSyCXin_qIc785nooY8Qqejt5BU_X6f9it6c",
    authDomain: "rz-scanner.firebaseapp.com",
    projectId: "rz-scanner",
    storageBucket: "rz-scanner.firebasestorage.app",
    messagingSenderId: "299287620862",
    appId: "1:299287620862:web:bd3b7b2d7304ecb27149af",
    measurementId: "G-0V2HSNXW2L"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  let allRecords = [];

  // ---------- Auth ----------
  auth.onAuthStateChanged(user=>{
    if(user){
      show('main');
      const name = user.email || '';
      const initials = name.slice(0, 2).toUpperCase();
      document.getElementById('shiftAvatar').textContent = initials || '—';
      document.getElementById('shiftName').textContent = name || '—';
      loadRecords();
    } else {
      show('login');
    }
  });

  document.getElementById('loginSubmitBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    if(!email || !password){
      errEl.textContent = 'Vyplňte e-mail i heslo.';
      errEl.style.display = 'block';
      return;
    }
    const btn = document.getElementById('loginSubmitBtn');
    btn.disabled = true;
    try{
      await auth.signInWithEmailAndPassword(email, password);
      document.getElementById('loginPassword').value = '';
    }catch(e){
      errEl.textContent = 'Přihlášení se nezdařilo — zkontrolujte e-mail a heslo.';
      errEl.style.display = 'block';
    }finally{
      btn.disabled = false;
    }
  });

  document.getElementById('loginPassword').addEventListener('keydown', (e)=>{
    if(e.key === 'Enter') document.getElementById('loginSubmitBtn').click();
  });

  // Na desktopu appku neobsluhuje jen jedna sdílená osoba, co appku drží v
  // ruce (jako na mobilu) — odhlášení tu proto může být rovnou viditelné
  // tlačítko místo skrytého gesta.
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    if(confirm('Opravdu se chceš odhlásit?')) auth.signOut();
  });

  // Celá obrazovka — schová lišty prohlížeče i systému (Fullscreen API).
  // Tlačítko se přebarví, když je appka doopravdy na celé obrazovce
  // (funguje i když se z ní vyjde jinak než tímhle tlačítkem, např. Esc).
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  fullscreenBtn.addEventListener('click', ()=>{
    if(document.fullscreenElement){
      document.exitFullscreen();
    } else {
      document.documentElement.requestFullscreen().catch((e)=>{
        console.error('Celou obrazovku se nepodařilo zapnout:', e);
      });
    }
  });
  document.addEventListener('fullscreenchange', ()=>{
    const on = !!document.fullscreenElement;
    fullscreenBtn.classList.toggle('active', on);
    fullscreenBtn.title = on ? 'Ukončit celou obrazovku' : 'Celá obrazovka';
  });

  // ---------- List ----------
  // Real-time listener — appka se sama překreslí, kdykoliv se ve Firestore
  // něco změní (nový přestupek odeslaný z RZ Scanner, dořešení odjinud
  // apod.), bez nutnosti stránku ručně obnovovat. onSnapshot se navíc
  // jednou zavolá hned na začátku se stávajícími daty, takže nahrazuje
  // i původní jednorázové načtení.
  function loadRecords(){
    const statusEl = document.getElementById('listStatus');
    statusEl.style.display = 'block';
    statusEl.textContent = 'Načítám…';
    let first = true;
    db.collection('prestupky').orderBy('createdAt', 'desc').limit(500)
      .onSnapshot(snap=>{
        allRecords = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        console.log('[živý přenos]', first ? 'počáteční načtení' : 'změna dat', '—', allRecords.length, 'záznamů');
        first = false;
        rebuildOffenseCatalog();
        renderRail();
        renderList(document.getElementById('searchInput').value);
      }, e=>{
        console.error('Načtení přehledu selhalo:', e);
        statusEl.textContent = 'Načtení se nezdařilo (' + (e && e.message ? e.message : 'chyba sítě') + ').';
        statusEl.style.display = 'block';
      });
  }

  function formatCreatedAt(ts){
    if(!ts || !ts.toDate) return '';
    const d = ts.toDate();
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function formatDateCz(iso){
    if(!iso) return '—';
    const parts = iso.split('-');
    if(parts.length !== 3) return iso;
    const [y, m, d] = parts.map(Number);
    if(!y || !m || !d) return iso;
    return d + '. ' + m + '. ' + y;
  }

  function escapeHtml(s){
    return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function buildNoticeHtml(record){
    const isBoticka = record.docType === 'boticka';
    const addressBlock = record.address ? `
      <div class="notice-section">
        <div class="notice-heading">Místo přestupku</div>
        <div class="notice-address">${escapeHtml(record.address)}</div>
      </div>` : '';
    const offenseBlock = record.offenseLabel ? `
      <div class="notice-section">
        <div class="notice-heading">Právní kvalifikace přestupku</div>
        <div class="notice-offense-label">${escapeHtml(record.offenseLabel)}</div>
        ${record.offenseCitation ? `<div class="notice-offense-ref">${escapeHtml(record.offenseCitation)}</div>` : ''}
      </div>` : '';
    const numberBlock = record.noticeNumber ? `
      <div class="notice-number"><b>${escapeHtml(record.noticeNumber)}</b></div>` : '';
    const officerBlock = record.officerName ? `
      <div class="notice-officer">str. ${escapeHtml(record.officerName)}</div>` : '';
    const vehicleBlock = (record.brand || record.color) ? `
      <div class="notice-vehicle">${escapeHtml([record.brand, record.color].filter(Boolean).join(', '))}</div>` : '';
    const instructionsHtml = isBoticka ? `
          Oznamuji Vám, že na výše uvedeném vozidle byl <b>umístěn technický prostředek k zabránění odjezdu vozidla (TPZOV)</b> dle § 17a zákona č. 553/1991 Sb., o obecní policii, a to z důvodu porušení pravidel uvedeného níže.
          <b style="display:block; margin:10px 0 6px;">pořízena fotodokumentace</b>
          <span class="heading-caps">Poučení</span>
          Technický prostředek bude odstraněn po zaplacení nákladů spojených s jeho použitím a odstraněním, a to na Městské policii Blansko, Sadová 2.
        ` : `
          Dostavte se proto ve vlastním zájmu, <b>a to neprodleně</b> na Městskou policii Blansko, Sadová 2. Tuto výzvu vezměte s sebou.
          <b style="display:block; margin:10px 0 6px;">pořízena fotodokumentace</b>
          <span class="heading-caps">Poučení</span>
          Dle § 11/odst. 1 a 2, zák. 553/1991 Sb., o obecní policii je osoba povinna výzvě vyhovět. Nedostavíte-li se bez dostatečné omluvy, můžete být dle § 11/odst. 8 výše uvedeného zákona předveden(a) nebo může být přestupek oznámen příslušnému správnímu orgánu k projednání.
        `;
    return `
      <div class="notice-card">
        <div class="notice-title">${isBoticka ? 'Oznámení' : 'Výzva'}</div>
        <div class="notice-subtitle${isBoticka ? ' notice-subtitle-boticka' : ''}">${isBoticka ? 'o použití technického prostředku k zabránění odjezdu vozidla' : 'pro nepřítomného pachatele přestupku'}</div>
        ${numberBlock}
        <div class="notice-label">Registrační značka</div>
        <div class="notice-platebox">${escapeHtml(record.plate || '')}</div>
        ${vehicleBlock}
        <div class="notice-datetime">Datum: ${escapeHtml(formatDateCz(record.date))}&nbsp;&nbsp;&nbsp;Čas: ${escapeHtml(record.time || '—')}</div>
        ${addressBlock}
        ${offenseBlock}
        <div class="notice-instructions">
          ${instructionsHtml}
        </div>
        <div class="notice-footer">
          ${officerBlock}
          <div class="authority">Městská policie Blansko</div>
          <div class="authority-addr">Sadová 149/2, 678 01 Blansko</div>
          <div class="authority-phone">Tel.: 775 859 486, 516 418 418</div>
          <div class="generated-by">Vygenerováno aplikací RZ Scanner</div>
        </div>
      </div>`;
  }

  function setDetailNote(text, kind){
    const note = document.getElementById('detailNote');
    note.textContent = text;
    note.className = 'submit-note' + (kind ? ' ' + kind : '');
    note.style.display = text ? 'block' : 'none';
  }

  // ---------- Export "Oznámení přestupku" jako skutečný .docx ----------
  // Skutečný OOXML (.docx) balíček přes JSZip (CDN, žádný build krok) —
  // ne RTF ani HTML převlečené za .doc. Dvousloupcové rozvržení hlavičky
  // (adresa úřadu vlevo, č.j./vyřizuje/tel/e-mail/datum vpravo) je běžná
  // Word tabulka bez viditelných ohraničení.
  //
  // Šablona vychází z reálného vzoru "Oznámení přestupku" (Městský úřad
  // Blansko, odbor dopravy). Appka doplní jen to, co sama zná — číslo
  // jednací, strážníka, dnešní datum vytvoření, a v textu datum/čas/značku/
  // adresu (+GPS pokud je uložené)/přestupek. Údaje o provozovateli vozidla
  // (jméno, datum narození, bydliště) appka nemá k dispozici (zjišťují se
  // až lustrací na úřadě) — zůstávají prázdné pro ruční doplnění.
  const OZNAMENI_TEL = '775 859 486, 516 418 418';
  const OZNAMENI_EMAIL = 'mp@blansko.cz';

  function xmlEscape(str){
    return String(str == null ? '' : str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&apos;');
  }

  function todayCz(){
    const d = new Date();
    const pad = n => String(n).padStart(2,'0');
    return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear();
  }

  function mmToTwips(mm){ return Math.round(mm * 56.6929); }
  function mmToEmu(mm){ return Math.round(mm * 36000); }

  function docxRun(text, opts){
    opts = opts || {};
    let props = '<w:sz w:val="' + (opts.size || 20) + '"/>';
    if(opts.bold) props += '<w:b/>';
    if(opts.italic) props += '<w:i/>';
    if(opts.underline) props += '<w:u w:val="single"/>';
    return '<w:r><w:rPr>' + props + '</w:rPr><w:t xml:space="preserve">' + xmlEscape(text) + '</w:t></w:r>';
  }

  function docxPara(text, opts){
    opts = opts || {};
    let pPr = '';
    if(opts.align) pPr += '<w:jc w:val="' + opts.align + '"/>';
    if(opts.pageBreakBefore) pPr += '<w:pageBreakBefore/>';
    pPr += '<w:spacing w:before="' + (opts.spacingBefore != null ? opts.spacingBefore : 0) +
           '" w:after="' + (opts.spacingAfter != null ? opts.spacingAfter : 0) + '"/>';
    const r = text != null ? docxRun(text, opts) : '';
    return '<w:p><w:pPr>' + pPr + '</w:pPr>' + r + '</w:p>';
  }

  // Odstavec "štítek" + skutečný tabulátor na pevnou pozici + "hodnota" —
  // na rozdíl od ručně vyťukaných mezer se tak hodnoty u různě dlouhých
  // štítků (RZ vs. tovární značka/barva) zarovnají přesně pod sebe.
  function docxLabelValuePara(label, value, opts){
    opts = opts || {};
    const tabPos = opts.tabPos != null ? opts.tabPos : 2600;
    const pPr = '<w:tabs><w:tab w:val="left" w:pos="' + tabPos + '"/></w:tabs>' +
      '<w:spacing w:before="' + (opts.spacingBefore != null ? opts.spacingBefore : 0) +
      '" w:after="' + (opts.spacingAfter != null ? opts.spacingAfter : 0) + '"/>';
    const labelRun = docxRun(label, { size: opts.size || 20 });
    const tabRun = '<w:r><w:rPr><w:sz w:val="' + (opts.size || 20) + '"/></w:rPr><w:tab/></w:r>';
    const valueRun = docxRun(value, { size: opts.size || 20, bold: opts.valueBold });
    return '<w:p><w:pPr>' + pPr + '</w:pPr>' + labelRun + tabRun + valueRun + '</w:p>';
  }

  function docxHeaderTable(leftLines, rightLines){
    // Mezisloupec (gutter) mezi adresou úřadu a blokem s č.j. — bez něj by
    // sloupce splývaly těsně vedle sebe. Pravý blok tak začíná výrazně
    // víc vpravo, blíž k pravému okraji stránky.
    const leftW = 3600, gutterW = 2200, rightW = 3226;
    const cell = (lines, w) => '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/></w:tcPr>' +
      lines.map(t => docxPara(t, { size: 19, spacingAfter: 20 })).join('') + '</w:tc>';
    const emptyCell = (w) => '<w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/></w:tcPr>' + docxPara('', { size: 19 }) + '</w:tc>';
    return '<w:tbl><w:tblPr><w:tblW w:w="9026" w:type="dxa"/><w:tblBorders>' +
      '<w:top w:val="nil"/><w:left w:val="nil"/><w:bottom w:val="nil"/><w:right w:val="nil"/>' +
      '<w:insideH w:val="nil"/><w:insideV w:val="nil"/></w:tblBorders>' +
      '<w:tblLayout w:type="fixed"/></w:tblPr>' +
      '<w:tblGrid><w:gridCol w:w="' + leftW + '"/><w:gridCol w:w="' + gutterW + '"/><w:gridCol w:w="' + rightW + '"/></w:tblGrid>' +
      '<w:tr>' + cell(leftLines, leftW) + emptyCell(gutterW) + cell(rightLines, rightW) + '</w:tr></w:tbl>';
  }

  function docxNarrowBoxTable(widthMm, innerXml){
    const w = mmToTwips(widthMm);
    return '<w:tbl><w:tblPr><w:tblW w:w="' + w + '" w:type="dxa"/><w:jc w:val="center"/><w:tblBorders>' +
      '<w:top w:val="single" w:sz="8" w:color="000000"/><w:left w:val="single" w:sz="8" w:color="000000"/>' +
      '<w:bottom w:val="single" w:sz="8" w:color="000000"/><w:right w:val="single" w:sz="8" w:color="000000"/>' +
      '</w:tblBorders><w:tblLayout w:type="fixed"/></w:tblPr>' +
      '<w:tblGrid><w:gridCol w:w="' + w + '"/></w:tblGrid>' +
      '<w:tr><w:tc><w:tcPr><w:tcW w:w="' + w + '" w:type="dxa"/></w:tcPr>' + innerXml + '</w:tc></w:tr></w:tbl>';
  }

  function docxImageParagraph(relId, widthPx, heightPx, maxWmm, maxHmm, docId, pageBreakBefore){
    const aspect = heightPx / widthPx;
    let wMm = maxWmm, hMm = wMm * aspect;
    if(hMm > maxHmm){ hMm = maxHmm; wMm = hMm / aspect; }
    const emuW = mmToEmu(wMm), emuH = mmToEmu(hMm);
    const drawing = '<w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0">' +
      '<wp:extent cx="' + emuW + '" cy="' + emuH + '"/>' +
      '<wp:docPr id="' + docId + '" name="Photo' + docId + '"/>' +
      '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">' +
      '<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">' +
      '<pic:nvPicPr><pic:cNvPr id="' + docId + '" name="Photo' + docId + '"/><pic:cNvPicPr/></pic:nvPicPr>' +
      '<pic:blipFill><a:blip r:embed="rId' + relId + '" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"/>' +
      '<a:stretch><a:fillRect/></a:stretch></pic:blipFill>' +
      '<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="' + emuW + '" cy="' + emuH + '"/></a:xfrm>' +
      '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic>' +
      '</a:graphicData></a:graphic></wp:inline></w:drawing>';
    const pPr = '<w:pPr>' + (pageBreakBefore ? '<w:pageBreakBefore/>' : '') + '<w:jc w:val="center"/></w:pPr>';
    return '<w:p>' + pPr + '<w:r>' + drawing + '</w:r></w:p>';
  }

  function getImagePixelSize(dataUrl){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=> resolve({ w: img.naturalWidth || 800, h: img.naturalHeight || 600 });
      img.onerror = ()=> resolve({ w: 800, h: 600 });
      img.src = dataUrl;
    });
  }

  function base64ToUint8Array(base64){
    const raw = atob(base64);
    const arr = new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) arr[i] = raw.charCodeAt(i);
    return arr;
  }

  // Appka ukládá do Firestore jen spojenou citaci (např. "§ 27 odst. 1
  // písm. a) — přestupek dle § 125c odst. 1 písm. k) (zákon č. 361/2000
  // Sb.)"), ne samostatně základní paragraf a sankci. Pro "Popis skutku"
  // je ale potřeba mít obě části zvlášť (základní paragraf hned za
  // "ustanovení", sankce až u "dle" na konci) — tahle funkce citaci zpět
  // rozparsuje. Funguje na starých i nových záznamech (formát citace se
  // neměnil, jen její použití v textu skutku).
  function parseOffenseCitation(citation){
    if(!citation) return null;
    const m = citation.match(/^(.+?)(?: — přestupek dle (.+?))? \(zákon č\. (.+?)\)$/);
    if(!m) return null;
    return { ref: m[1], sankce: m[2] || null, law: m[3] };
  }

  async function buildOznameniDocx(record, photosB64){
    const offenseCitation = record.offenseCitation || '';

    let body = '';

        'E-mail: ' + OZNAMENI_EMAIL,
        '',

    body += docxPara('', { size: 20 });

    const intro = 'Podle § 10 odst. 2 zák. č. 553/91 Sb., o obecní policii, ve znění pozdějších předpisů, ' +
      'Vám oznamuji podezření ze spáchání přestupku: Zákon č. 361/2000 Sb., o provozu na ' +
      'pozemních komunikacích – ' + offenseCitation + ', jímž se dopustil(a) jednání – ' + offenseLabel +

    body += docxPara('Popis skutku:', { bold: true, size: 20, spacingAfter: 100 });

    // Základní ustanovení (např. § 27 odst. 1 písm. a)) hned za "ustanovení",
    // sankční ustanovení (§ 125c...) až na konci u "dle" — viz komentář u
    // parseOffenseCitation výše. Když se citaci z nějakého důvodu nepodaří
    // rozparsovat (neobvyklý/ruční formát), appka se vrátí k původnímu
    // chování a použije celou citaci na obou místech.
    const parsedCitation = parseOffenseCitation(offenseCitation);
    const baseCite = parsedCitation ? (parsedCitation.ref + ' (zákon č. ' + parsedCitation.law + ')') : offenseCitation;
    const sankceCite = parsedCitation

    // Fotky — každá na vlastní A4 stránce v běžné velikosti.

    if(photosB64.length){

        const dims = await getImagePixelSize('data:image/jpeg;base64,' + photosB64[i]);
        const filename = 'image' + (i + 1) + '.jpeg';
        mediaFiles.push({ name: filename, bytes: base64ToUint8Array(photosB64[i]) });
        relEntries.push({ id: relId, target: 'media/' + filename });
        // První fotka má o něco nižší povolenou výšku než ostatní (220 mm

        // "Fotodokumentace" na stejnou stránku a Word by ji sám přesunul
        // na další (prázdný nadpis nahoře, fotka sama o stránku dál).
        body += docxImageParagraph(relId, dims.w, dims.h, 170, i === 0 ? 220 : 240, docId, i > 0);
        relId++; docId++;

    // Výzva — úzký orámovaný blok v šíři 58 mm (odpovídá reálné šířce tiskárny).
    // Obsah je záměrně stejný jako to, co appka posílá na tepelnou tiskárnu

    inner += docxPara(record.plate || '', { bold: true, size: 32, align: 'center' });
    inner += docxPara('Datum: ' + formatDateCz(record.date) + '  Čas: ' + (record.time || '—'), { size: 14, align: 'center', spacingAfter: 100 });
    if(record.address){
      inner += docxPara('Místo přestupku', { bold: true, size: 13, align: 'center' });
      inner += docxPara(record.address, { size: 14, align: 'center', spacingAfter: 100 });

    if(offenseLabel){
      inner += docxPara('Právní kvalifikace', { bold: true, size: 13, align: 'center' });
      inner += docxPara(offenseLabel, { size: 14, align: 'center' });
      if(offenseCitation) inner += docxPara(offenseCitation, { size: 11, align: 'center', spacingAfter: 100 });

    if(isBoticka){
      inner += docxPara(
        'Oznamuji Vám, že na výše uvedeném vozidle byl umístěn technický prostředek k zabránění ' +
        'odjezdu vozidla (TPZOV) dle § 17a zákona č. 553/1991 Sb., o obecní policii, a to z důvodu ' +
        'porušení pravidel uvedeného výše.',
        { size: 14, align: 'center', spacingAfter: 100 }
      );
      inner += docxPara('pořízena fotodokumentace', { bold: true, size: 14, align: 'center', spacingAfter: 100 });
      inner += docxPara('POUČENÍ', { bold: true, size: 13, align: 'center' });
      inner += docxPara(
        'Technický prostředek bude odstraněn po zaplacení nákladů spojených s jeho použitím a ' +
        'odstraněním, a to na Městské policii Blansko, Sadová 2.',
        { size: 14, align: 'center', spacingAfter: 100 }
      );
    } else {
      inner += docxPara(
        'Dostavte se proto ve vlastním zájmu, a to neprodleně na Městskou policii Blansko, Sadová 2. ' +
        'Tuto výzvu vezměte s sebou.',
        { size: 14, align: 'center', spacingAfter: 100 }
      );
      inner += docxPara('pořízena fotodokumentace', { bold: true, size: 14, align: 'center', spacingAfter: 100 });
      inner += docxPara('POUČENÍ', { bold: true, size: 13, align: 'center' });
      inner += docxPara(
        'Dle § 11/odst. 1 a 2, zák. 553/1991 Sb., o obecní policii je osoba povinna výzvě vyhovět. ' +
        'Nedostavíte-li se bez dostatečné omluvy, můžete být dle § 11/odst. 8 výše uvedeného zákona ' +
        'předveden(a) nebo může být přestupek oznámen příslušnému správnímu orgánu k projednání.',
        { size: 14, align: 'center', spacingAfter: 100 }
      );
    }

    if(record.officerName){
      inner += docxPara('str. ' + record.officerName, { bold: true, size: 14, align: 'center' });
    }
    inner += docxPara('Městská policie Blansko', { bold: true, size: 14, align: 'center' });
    inner += docxPara('Sadová 149/2, 678 01 Blansko', { size: 13, align: 'center' });
    inner += docxPara('Tel.: 775 859 486, 516 418 418', { size: 13, align: 'center', spacingAfter: 100 });
    inner += docxPara('vygenerováno aplikací', { size: 11, align: 'center' });

      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';

      relEntries.map(e => '<Relationship Id="rId' + e.id + '" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="' + e.target + '"/>').join('') +

    const zip = new JSZip();
    zip.file('[Content_Types].xml', contentTypes);
    zip.file('_rels/.rels', rootRels);
    zip.file('word/document.xml', documentXml);
    zip.file('word/_rels/document.xml.rels', docRels);
    mediaFiles.forEach(m => zip.file('word/media/' + m.name, m.bytes));

    return zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  async function exportOznameni(record){
    const btn = document.getElementById('menuOznameniBtn');
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Připravuji…';
    try{
      if(typeof JSZip === 'undefined'){
        setDetailNote('Export do Wordu se nepodařilo načíst (chybí knihovna JSZip — zkontrolujte připojení k internetu).', 'err');
        return false;
      }
      // Fotky mohly být v této session už dřív načtené (viz openDetail /
      // loadAndShowPhotos) — jinak je stejným způsobem dotáhneme teď.
      let photosB64 = record._resolvedPhotos;
      if(!photosB64 && record.hasPhotos){
        const doc = await db.collection('prestupky').doc(record.id).collection('data').doc('photos').get();
        const data = doc.exists ? doc.data() : null;
        photosB64 = (data && data.photos) || [];
        record._resolvedPhotos = photosB64;
        record._resolvedMime = (data && data.photoMime) || 'image/jpeg';
      }
      const blob = await buildOznameniDocx(record, photosB64 || []);
      const filename = 'Oznameni_' + (record.plate || 'prestupek').replace(/\s+/g,'') + '.docx';
      try{
        const file = new File([blob], filename, { type: blob.type });
        if(navigator.canShare && navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file] });
          return true;
        }
      }catch(e){
        // Uživatel sdílení zrušil nebo API není k dispozici — spadneme na
        // otevření v nové kartě, stejně jako u ukládání fotek.
      }
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=> URL.revokeObjectURL(url), 60000);
      return true;
    }catch(e){
      console.error('Export Oznámení selhal:', e);
      setDetailNote('Vytvoření dokumentu se nezdařilo (' + e.message + ').', 'err');
      return false;
    }finally{
      btn.disabled = false;
      btn.textContent = originalText;
    }
  }

  // ---------- Tisk na Epson TM-P20II přes Wi-Fi (ePOS-Print XML) ----------
  // Stejná logika jako v index.html (viz tam podrobný komentář o HTTPS/
  // certifikátu/CORS) — adresu tiskárny appka bere ze stejného
  // localStorage klíče ('eposPrinterHost'), který se nastavuje v
  // index.html (⚙ Nastavit tiskárnu), protože obě stránky běží na stejné
  // doméně a localStorage si tedy mezi sebou přirozeně sdílí.
  //
  // Služební čísla strážníků — na vytištěné výzvě (fyzicky vydávané) se
  // z bezpečnostních důvodů posílá jen služební číslo, ne celé jméno.
  // Jméno zůstává beze změny v appce samotné (přehled, detail, export
  // Oznámení do Wordu) — mění se jen text, co jde do tiskárny.
  const OFFICER_BADGE_NUMBERS = {
    'Adámek Jaroslav': '995',
    'Grénar Martin': '1774',
    'Havel Radek': '1794',
    'Hlaváček Michal': '177',
    'Hofman Radek': '1744',
    'Chalupa Martin': '1781',
    'Juračka Lukáš': '1048',
    'Liška Michal': '2053',
    'Menšík Jaroslav': '202',
    'Parolek Antonín': '611',
    'Přikryl Miroslav': '1996',
    'Sehnal Petr': '182',
    'Šenk Kamil': '723',
    'Škvařil Libor': '1564',
    'Tesař Libor': '188',
    'Tóth Ondřej': '2401',
    'Tóth Pavel': '775',
    'Vašíček Zdeněk': '1255',
  };

  function officerPrintLabel(officerName){
    const badge = OFFICER_BADGE_NUMBERS[officerName];
    return badge ? ('str. ' + badge) : ('str. ' + officerName);
  }

  function getPrinterHost(){
    return (localStorage.getItem('eposPrinterHost') || '').trim();
  }

  function escapeXml(str){
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Zalomí text na mezerách po ~32 znacích (šířka řádku na 58mm papíře
  // TM-P20II), ať tiskárna nedělí slova napůl — viz stejná funkce a
  // podrobný komentář v index.html.
  function wrapWords(text, width){
    width = width || 32;
    return String(text == null ? '' : text).split('\n').map(function(line){
      if(line.length <= width) return line;
      const words = line.split(' ');
      const lines = [];
      let cur = '';
      words.forEach(function(w){
        if(cur === ''){
          cur = w;
        } else if((cur + ' ' + w).length <= width){
          cur += ' ' + w;
        } else {
          lines.push(cur);
          cur = w;
        }
      });
      if(cur) lines.push(cur);
      return lines.join('\n');
    }).join('\n');
  }

  function textEl(data, opts){
    opts = opts || {};
    const align = opts.align || 'left';
    const em = opts.em ? 'true' : 'false';
    const width = opts.width || 1;
    const height = opts.height || 1;
    return '<text align="' + align + '" em="' + em + '" width="' + width + '" height="' + height + '">' +
      escapeXml(data) + '</text>';
  }

  function buildEposPrintXml(record){
    const isBoticka = record.docType === 'boticka';
    let x = '';

    x += textEl((isBoticka ? 'OZNÁMENÍ' : 'VÝZVA') + '\n', { align: 'center', width: 2, height: 2, em: true });
    x += textEl(wrapWords(isBoticka ? 'o použití technického prostředku k zabránění odjezdu vozidla' : 'pro nepřítomného pachatele přestupku') + '\n', { align: 'center' });
    if(record.noticeNumber){
      x += textEl(record.noticeNumber + '\n', { align: 'center', em: true, width: 2, height: 2 });
    }
    x += textEl('\nREGISTRAČNÍ ZNAČKA\n', { align: 'center' });
    x += textEl((record.plate || '') + '\n', { align: 'center', width: 3, height: 3, em: true });
    if(record.brand || record.color){
      x += textEl([record.brand, record.color].filter(Boolean).join(', ') + '\n', { align: 'center' });
    }
    x += textEl('--------------------------------\n', { align: 'center' });
