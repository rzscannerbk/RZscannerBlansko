    rail.appendChild(gOfficer);

    const gSummaries = group('Souhrny směn');
    const summariesContainer = document.createElement('div');
    summariesContainer.id = 'shiftSummaryFolder';
    gSummaries.appendChild(summariesContainer);
    rail.appendChild(gSummaries);
    renderShiftSummaryFolder(shiftSummaryDocsCache);
  }

  // Katalog přestupků pro našeptávač ve vyhledávání — sestavený z toho, co
  // appka skutečně ve Firestore vidí (ne z pevného seznamu 34 položek
  // v appce RZ Scanner), ať se nabízí jen to, co má smysl hledat.
  let offenseCatalog = [];
  function rebuildOffenseCatalog(){
    const counts = {};
    allRecords.forEach(r=>{
      if(!r.offenseLabel) return;
      counts[r.offenseLabel] = (counts[r.offenseLabel] || 0) + 1;
    });
    offenseCatalog = Object.keys(counts)
      .map(label=>({ label, count: counts[label] }))
      .sort((a,b)=> b.count - a.count || a.label.localeCompare(b.label, 'cs'));
  }

  function refreshView(){
    rebuildOffenseCatalog();
    renderRail();
    renderList(document.getElementById('searchInput').value);
  }

  document.getElementById('dateTabs').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-range]');
    if(!btn) return;
    filterRange = btn.dataset.range;
    document.querySelectorAll('#dateTabs button').forEach(b=>b.classList.toggle('active', b === btn));
    refreshView();
  });

  // Řazení seznamu kliknutím na hlavičku sloupce — null = výchozí pořadí
  // (podle createdAt sestupně, jak přichází z Firestore dotazu).
  let sortKey = null;
  let sortDir = 1;
  const STATUS_ORDER = ['pending', 'oznameni', 'prikaz', 'domluva'];

  function sortRecords(records){
    if(!sortKey) return records;
    const arr = records.slice();
    arr.sort((a, b)=>{
      let va, vb;
      if(sortKey === 'plate'){ va = a.plate || ''; vb = b.plate || ''; }
      else if(sortKey === 'type'){ va = (a.docType || 'vyzva'); vb = (b.docType || 'vyzva'); }
      else if(sortKey === 'address'){ va = a.address || ''; vb = b.address || ''; }
      else if(sortKey === 'offense'){ va = a.offenseLabel || ''; vb = b.offenseLabel || ''; }
      else if(sortKey === 'status'){ va = STATUS_ORDER.indexOf(recordStatusKey(a)); vb = STATUS_ORDER.indexOf(recordStatusKey(b)); }
      else if(sortKey === 'sent'){
        va = (a.createdAt && a.createdAt.toDate) ? a.createdAt.toDate().getTime() : 0;
        vb = (b.createdAt && b.createdAt.toDate) ? b.createdAt.toDate().getTime() : 0;
      }
      if(typeof va === 'string') va = va.toLowerCase();
      if(typeof vb === 'string') vb = vb.toLowerCase();
      if(va < vb) return -1 * sortDir;
      if(va > vb) return 1 * sortDir;
      return 0;
    });
    return arr;
  }

  document.querySelectorAll('.list-head span.sortable').forEach(span=>{
    span.addEventListener('click', ()=>{
      const key = span.dataset.sort;
      if(sortKey === key){
        sortDir = -sortDir;
      } else {
        sortKey = key;
        sortDir = 1;
      }
      document.querySelectorAll('.list-head span.sortable').forEach(s=>{
        s.classList.remove('sort-active');
        const existingArrow = s.querySelector('.sort-arrow');
        if(existingArrow) existingArrow.remove();
      });
      span.classList.add('sort-active');
      const arrow = document.createElement('span');
      arrow.className = 'sort-arrow';
      arrow.textContent = sortDir === 1 ? '▲' : '▼';
      span.appendChild(arrow);
      renderList(document.getElementById('searchInput').value);
    });
  });

  // Záznamy nevyřešené déle než tento počet dní dostanou v seznamu
  // červený proužek/SPZ, ať na ně strážník při předávání směny snáz narazí.
  const STALE_DAYS_THRESHOLD = 3;
  function isStale(r){
    if(recordStatusKey(r) !== 'pending') return false;
    const ts = r.createdAt && r.createdAt.toDate ? r.createdAt.toDate() : null;
    if(!ts) return false;
    return (Date.now() - ts.getTime()) > STALE_DAYS_THRESHOLD * 24 * 60 * 60 * 1000;
  }

  // Aktuálně vykreslené záznamy v pořadí zobrazení — používá klávesová
  // navigace (šipky/Enter) níže, ať ví, na co ukazuje.
  let currentRenderedRecords = [];

  function renderList(filterText){
    const container = document.getElementById('listBody');
    const statusEl = document.getElementById('listStatus');
    const q = (filterText || '').trim().toLowerCase();

    let filtered = allRecords.filter(passesFilters);
    if(q){
      filtered = filtered.filter(r=>
        (r.plate || '').toLowerCase().includes(q) ||
        (r.address || '').toLowerCase().includes(q) ||
        (r.noticeNumber || '').toLowerCase().includes(q) ||
        (r.officerName || '').toLowerCase().includes(q) ||
        (r.offenseLabel || '').toLowerCase().includes(q)
      );
    }
    filtered = sortRecords(filtered);
    currentRenderedRecords = filtered;
    keyboardFocusIndex = -1;

    container.innerHTML = '';
    if(allRecords.length === 0){
      statusEl.textContent = 'Zatím žádné odeslané přestupky.';
      container.appendChild(statusEl);
      return;
    }
    if(filtered.length === 0){
      statusEl.textContent = q ? ('Žádná shoda pro „' + filterText + '“.') : 'Žádné záznamy neodpovídají zvolenému filtru.';
      container.appendChild(statusEl);
      return;
    }

    const statusLabel = { pending:'Nevyřešeno', oznameni:'Oznámeno', prikaz:'Dořešeno příkazem', domluva:'Dořešeno domluvou' };
    const statusDot = { pending:'var(--faint)', oznameni:'#8FB6FF', prikaz:'var(--good)', domluva:'#D9A94E' };

    filtered.forEach(r=>{
      const sKey = recordStatusKey(r);
      const isBoticka = (r.docType || 'vyzva') === 'boticka';
      const stale = isStale(r);

      const item = document.createElement('div');
      item.className = 'record-item' + (isBoticka ? ' boticka' : '') + (sKey !== 'pending' ? ' resolved' : '') + (stale ? ' stale' : '') + (r.id === (currentDetailRecord && currentDetailRecord.id) ? ' selected' : '');

      const stripe = document.createElement('span');
      stripe.className = 'stripe';
      item.appendChild(stripe);

      const plateCol = document.createElement('span');
      plateCol.className = 'record-plate-col';
      const plate = document.createElement('span');
      plate.className = 'record-plate mono';
      plate.textContent = r.plate || 'NEZNÁMÁ SPZ';
      if(r.plate){
        plate.title = 'Kliknutím zkopírovat SPZ';
        plate.style.cursor = 'pointer';
        plate.addEventListener('click', (e)=>{
          e.stopPropagation();
          navigator.clipboard.writeText(r.plate).then(()=>{
            const original = plate.textContent;
            plate.textContent = 'Zkopírováno ✓';
            setTimeout(()=>{ plate.textContent = original; }, 900);
          }).catch(()=>{});
        });
      }
      plateCol.appendChild(plate);
      if(r.noticeNumber){
        const num = document.createElement('span');
        num.className = 'record-notice-number';
        num.textContent = r.noticeNumber;
        plateCol.appendChild(num);
      }
      item.appendChild(plateCol);

      const doctype = document.createElement('span');
      doctype.className = 'record-doctype-badge' + (isBoticka ? ' boticka' : '');
      doctype.textContent = isBoticka ? 'Botička' : 'Parkovačka';
      item.appendChild(doctype);

      const addr = document.createElement('span');
      addr.className = 'record-addr';
      addr.textContent = r.address || '—';
      if(r.address){
        addr.title = 'Otevřít na Mapy.cz';
        addr.style.cursor = 'pointer';
        addr.style.textDecoration = 'underline';
        addr.style.textDecorationColor = 'transparent';
        addr.addEventListener('mouseenter', ()=>{ addr.style.textDecorationColor = 'currentColor'; });
        addr.addEventListener('mouseleave', ()=>{ addr.style.textDecorationColor = 'transparent'; });
        addr.addEventListener('click', (e)=>{
          e.stopPropagation();
          window.open('https://mapy.cz/zakladni?q=' + encodeURIComponent(r.address + ', Blansko'), '_blank');
        });
      }
      item.appendChild(addr);

      const offense = document.createElement('span');
      offense.className = 'record-offense';
      offense.textContent = shortOffenseLabel(r.offenseLabel) || '—';
      if(r.offenseLabel) offense.title = r.offenseLabel;
      item.appendChild(offense);

      const status = document.createElement('span');
      status.className = 'record-status st-' + sKey;
      status.innerHTML = '<span class="dot" title="' + escapeHtml(statusLabel[sKey]) + '"></span>' + escapeHtml(statusLabel[sKey]);
      item.appendChild(status);

      const sentCol = document.createElement('span');
      sentCol.className = 'record-sent-col';
      const sentDate = document.createElement('span');
      sentDate.className = 'record-sent-date';
      sentDate.textContent = formatDateCz(r.date);
      sentCol.appendChild(sentDate);
      const sentTime = document.createElement('span');
      sentTime.className = 'record-sent-time';
      sentTime.textContent = (r.time || '') + (r.officerName ? ' · ' + r.officerName.split(' ')[0] : '');
      sentCol.appendChild(sentTime);
      item.appendChild(sentCol);

      // Náhled fotky — dotahuje se líně, teprve když řádek vjede do
      // viewportu (viz IntersectionObserver / observeThumb níže), ať
      // appka nezpomalí kvůli fotkám, které nikdo ani neuvidí. Kliknutí
      // na náhled otevře fullscreen prohlížeč místo detailu záznamu.
      const thumb = document.createElement('div');
      thumb.className = 'record-thumb';
      if(r.hasPhotos){
        thumb.innerHTML = '<span class="record-thumb-placeholder">📷</span>';
        observeThumb(thumb, r);
        thumb.addEventListener('click', (e)=>{
          e.stopPropagation();
          openLightbox(r, thumb);
        });
      } else {
        thumb.classList.add('empty');
        thumb.innerHTML = '<span class="record-thumb-placeholder">—</span>';
      }
      item.appendChild(thumb);

      item.addEventListener('click', ()=>{
        document.querySelectorAll('.record-item.selected').forEach(el=>el.classList.remove('selected'));
        item.classList.add('selected');
        openDetail(r);
      });
      container.appendChild(item);
    });
  }

  const searchInputEl = document.getElementById('searchInput');
  const searchSuggestionsEl = document.getElementById('searchSuggestions');

  function hideSuggestions(){
    searchSuggestionsEl.classList.remove('open');
    searchSuggestionsEl.innerHTML = '';
  }

  function showSuggestionsFor(query){
    const q = query.trim().toLowerCase();
    if(q.length < 2){ hideSuggestions(); return; }
    const matches = offenseCatalog.filter(o=> o.label.toLowerCase().includes(q)).slice(0, 8);
    if(!matches.length){ hideSuggestions(); return; }
    searchSuggestionsEl.innerHTML = '';
    matches.forEach(m=>{
      const item = document.createElement('div');
      item.className = 'search-suggestion-item';
      item.innerHTML = escapeHtml(m.label) + '<span class="suggestion-count">' + m.count + '×</span>';
      item.addEventListener('mousedown', (e)=>{
        // mousedown (ne click) — proběhne dřív než blur pole, ať se
        // dropdown nezavře dřív, než appka stihne zaregistrovat výběr.
        e.preventDefault();
        searchInputEl.value = m.label;
        hideSuggestions();
        renderList(m.label);
        searchInputEl.focus();
      });
      searchSuggestionsEl.appendChild(item);
    });
    searchSuggestionsEl.classList.add('open');
  }

  searchInputEl.addEventListener('input', (e)=>{
    renderList(e.target.value);
    showSuggestionsFor(e.target.value);
  });
  searchInputEl.addEventListener('focus', (e)=> showSuggestionsFor(e.target.value));
  searchInputEl.addEventListener('blur', ()=> setTimeout(hideSuggestions, 120));
  searchInputEl.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') hideSuggestions();
  });

  // Klávesové zkratky pro pohyb v seznamu — "/" dá focus na vyhledávání,
  // šipky nahoru/dolů posouvají zvýraznění mezi řádky (bez nutnosti myši),
  // Enter otevře detail zvýrazněného řádku. Aktivní jen mimo běžné psaní
  // textu (aby "/" nebo šipky nerozbíjely psaní ve vyhledávání/jinde) —
  // výjimkou je samotné pole vyhledávání, kde šipky/Enter dávají smysl i
  // po zadání filtru.
  let keyboardFocusIndex = -1;
  document.addEventListener('keydown', (e)=>{
    const active = document.activeElement;
    const inSearchField = active === searchInputEl;
    const isTypingElsewhere = active && !inSearchField &&
      (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
    if(isTypingElsewhere) return;

    if(e.key === '/' && !inSearchField){
      e.preventDefault();
      searchInputEl.focus();
      return;
    }

    const items = document.querySelectorAll('#listBody .record-item');
    if(!items.length) return;

    if(e.key === 'ArrowDown'){
      e.preventDefault();
      keyboardFocusIndex = Math.min(keyboardFocusIndex + 1, items.length - 1);
      items.forEach(el=>el.classList.remove('kbd-focus'));
      items[keyboardFocusIndex].classList.add('kbd-focus');
      items[keyboardFocusIndex].scrollIntoView({ block: 'nearest' });
    } else if(e.key === 'ArrowUp'){
      e.preventDefault();
      keyboardFocusIndex = Math.max(keyboardFocusIndex - 1, 0);
      items.forEach(el=>el.classList.remove('kbd-focus'));
      items[keyboardFocusIndex].classList.add('kbd-focus');
      items[keyboardFocusIndex].scrollIntoView({ block: 'nearest' });
    } else if(e.key === 'Enter' && keyboardFocusIndex >= 0 && keyboardFocusIndex < currentRenderedRecords.length){
      e.preventDefault();
      items.forEach(el=>el.classList.remove('selected'));
      items[keyboardFocusIndex].classList.add('selected');
      openDetail(currentRenderedRecords[keyboardFocusIndex]);
    }
  });

  // ---------- Souhrn směny ----------
  // Dvě pevné směny: denní 7:00–19:00 a noční 19:00–7:00 (přechází přes
  // půlnoc — vždy se datuje dnem, kdy směna ZAČALA, ne kdy skončila).
  const SHIFT_DAY_START_HOUR = 7;
  const SHIFT_NIGHT_START_HOUR = 19;
  const SHIFT_TYPE_LABEL = { denni: 'denní', nocni: 'noční' };

  function pad2(n){ return String(n).padStart(2, '0'); }
  function dateToIso(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }

  // Vrátí přesné hranice (Date) směny daného typu, která začíná v den dateStr.
  function shiftWindowForDate(type, dateStr){
    const [y, m, d] = dateStr.split('-').map(Number);
    if(type === 'denni'){
      const start = new Date(y, m-1, d, SHIFT_DAY_START_HOUR, 0, 0, 0);
      const end = new Date(y, m-1, d, SHIFT_NIGHT_START_HOUR, 0, 0, 0);
      return { type, dateStr, start, end };
    }
    const start = new Date(y, m-1, d, SHIFT_NIGHT_START_HOUR, 0, 0, 0);
    const end = new Date(start); end.setDate(end.getDate() + 1); end.setHours(SHIFT_DAY_START_HOUR, 0, 0, 0);
    return { type, dateStr, start, end };
  }

  // Zjistí, do jaké směny patří zadaný okamžik (výchozí: teď) — používá se
  // pro výchozí výběr v dialogu a pro dopočítání "poslední právě skončivší
  // směny" při automatickém generování níže.
  function shiftWindowContaining(now){
    const h = now.getHours();
    if(h >= SHIFT_DAY_START_HOUR && h < SHIFT_NIGHT_START_HOUR){
      return shiftWindowForDate('denni', dateToIso(now));
    }
    const startDate = new Date(now);
    if(h < SHIFT_DAY_START_HOUR) startDate.setDate(startDate.getDate() - 1);
    return shiftWindowForDate('nocni', dateToIso(startDate));
  }

  function previousShiftWindow(now){
    const current = shiftWindowContaining(now);
    return shiftWindowContaining(new Date(current.start.getTime() - 60000));
  }

  // Přestupek zařadí do směny podle skutečného času spáchání (record.date +
  // record.time), ne podle toho, kdy se stihl odeslat do Firestore — u
  // noční směny těsně po půlnoci to může být rozdíl v řádu minut, ale
  // typicky ne víc.
  function recordDateTime(r){
    if(!r.date) return null;
    const d = new Date(r.date + 'T' + (r.time || '00:00') + ':00');
    return isNaN(d.getTime()) ? null : d;
  }

  function recordsInWindow(win){
    return allRecords.filter(r=>{
      const d = recordDateTime(r);
      return d && d >= win.start && d < win.end;
    });
  }

  function computeStatsForRecords(records){
    const statusCounts = { pending:0, oznameni:0, prikaz:0, domluva:0 };
    const officers = {};
    records.forEach(r=>{
      const sKey = recordStatusKey(r);
      statusCounts[sKey] = (statusCounts[sKey] || 0) + 1;
      const name = r.officerName || 'Neuvedeno';
      if(!officers[name]) officers[name] = { total:0, resolved:0, unresolved:0 };
      officers[name].total++;
      if(sKey === 'pending') officers[name].unresolved++;
      else officers[name].resolved++;
    });
    const officerRows = Object.keys(officers)
      .map(name=>({ name, ...officers[name] }))
      .sort((a,b)=> b.total - a.total || a.name.localeCompare(b.name, 'cs'));
    return { total: records.length, statusCounts, officerRows };
  }

  function formatShiftHeading(win){
    const [y, m, d] = win.dateStr.split('-');
    return d + '.' + m + '.' + y + ' · ' + (win.type === 'denni' ? 'denní služba 7:00 – 19:00' : 'noční služba 19:00 – 7:00');
  }

  // ---- Ruční dialog "Souhrn směny" ----
  let shiftSummaryType = 'denni';

  function currentModalWindow(){
    const dateStr = document.getElementById('shiftSummaryDate').value || todayIso();
    return shiftWindowForDate(shiftSummaryType, dateStr);
  }

  function renderShiftSummary(){
    const win = currentModalWindow();
    const stats = computeStatsForRecords(recordsInWindow(win));
    const content = document.getElementById('shiftSummaryContent');
    if(stats.total === 0){
      content.innerHTML = '<div class="shift-summary-empty">Žádné přestupky za ' + escapeHtml(formatShiftHeading(win)) + '.</div>';
      return;
    }
    let html = '<div class="shift-summary-stats">' +
      '<div class="shift-stat"><div class="num">' + stats.total + '</div><div class="lbl">Celkem</div></div>' +
      '<div class="shift-stat"><div class="num">' + stats.statusCounts.pending + '</div><div class="lbl">Nevyřešeno</div></div>' +
      '<div class="shift-stat"><div class="num">' + (stats.statusCounts.oznameni + stats.statusCounts.prikaz + stats.statusCounts.domluva) + '</div><div class="lbl">Dořešeno</div></div>' +
      '<div class="shift-stat"><div class="num">' + stats.statusCounts.domluva + '</div><div class="lbl">Domluvou</div></div>' +
      '</div>';
    html += '<div class="shift-summary-title">Podle strážníka</div>';
    stats.officerRows.forEach(o=>{
      html += '<div class="shift-officer-row"><span class="name">' + escapeHtml(o.name) + '</span>' +
        '<span class="nums">' + o.total + ' celkem · ' + o.resolved + ' dořešeno · ' + o.unresolved + ' nevyřešeno</span></div>';
    });
    content.innerHTML = html;
  }

  // Výchozí datum v dialogu = datum směny, ve které je aktuální okamžik
  // (u noční směny je to den, kdy začala, i po půlnoci).
  function resetShiftSummaryModalDefaults(){
    const win = shiftWindowContaining(new Date());
    shiftSummaryType = win.type;
    document.querySelectorAll('#shiftSummaryRange button').forEach(b=>b.classList.toggle('active', b.dataset.type === win.type));
    document.getElementById('shiftSummaryDate').value = win.dateStr;
  }

  document.getElementById('shiftSummaryBtn').addEventListener('click', ()=>{
    resetShiftSummaryModalDefaults();
    document.getElementById('shiftSummaryOverlay').classList.add('open');
    renderShiftSummary();
  });
  document.getElementById('shiftSummaryCloseBtn').addEventListener('click', ()=>{
    document.getElementById('shiftSummaryOverlay').classList.remove('open');
  });
  document.getElementById('shiftSummaryRange').addEventListener('click', (e)=>{
    const btn = e.target.closest('button[data-type]');
    if(!btn) return;
    shiftSummaryType = btn.dataset.type;
    document.querySelectorAll('#shiftSummaryRange button').forEach(b=>b.classList.toggle('active', b === btn));
    renderShiftSummary();
  });
  document.getElementById('shiftSummaryDate').addEventListener('change', renderShiftSummary);

  // Souhrn jako .docx — jednoduchý textový report (bez fotek/tabulek OOXML),
  // znovupoužívá stejné docxPara/docxLabelValuePara helpery a stejné
  // sestavení balíčku (JSZip) jako export Oznámení výše. Používá se jak
  // z ručního dialogu, tak z automaticky vygenerovaných záznamů v levém
  // panelu (viz níže).
  async function buildShiftSummaryDocxForWindow(win, records){
    const stats = computeStatsForRecords(records);
    let body = '';
    body += docxPara('Souhrn směny', { bold: true, size: 28, align: 'center', spacingAfter: 100 });
    body += docxPara('Městská policie Blansko · ' + formatShiftHeading(win), { size: 18, align: 'center', spacingAfter: 300 });

    body += docxPara('Celkem přestupků: ' + stats.total, { size: 22, bold: true, spacingAfter: 100 });
    body += docxPara('Nevyřešeno: ' + stats.statusCounts.pending, { size: 20, spacingAfter: 40 });
    body += docxPara('Oznámeno: ' + stats.statusCounts.oznameni, { size: 20, spacingAfter: 40 });
    body += docxPara('Dořešeno příkazem: ' + stats.statusCounts.prikaz, { size: 20, spacingAfter: 40 });
    body += docxPara('Dořešeno domluvou: ' + stats.statusCounts.domluva, { size: 20, spacingAfter: 300 });

    body += docxPara('Podle strážníka', { bold: true, size: 22, spacingAfter: 150 });
    if(stats.officerRows.length === 0){
      body += docxPara('Žádné záznamy.', { size: 20 });
    }
    stats.officerRows.forEach(o=>{
      body += docxLabelValuePara(
        o.name + ':',
        o.total + ' celkem, ' + o.resolved + ' dořešeno, ' + o.unresolved + ' nevyřešeno',
        { size: 20, spacingAfter: 80, tabPos: 3200 }
      );
    });

    const documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
      'xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" ' +
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<w:body>' + body +
      '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
      '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/>' +
      '</w:sectPr></w:body></w:document>';

    const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
      '</Types>';

    const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
      '</Relationships>';

    const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>';

    const zip = new JSZip();
    zip.file('[Content_Types].xml', contentTypes);
    zip.file('_rels/.rels', rootRels);
    zip.file('word/document.xml', documentXml);
    zip.file('word/_rels/document.xml.rels', docRels);

    return zip.generateAsync({
      type: 'blob',
      mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
    });
  }

  function shiftSummaryFilename(win){
    return win.dateStr + ' - ' + SHIFT_TYPE_LABEL[win.type] + '.docx';
  }

  async function downloadShiftSummaryDocx(win, records, btn){
    const originalText = btn ? btn.textContent : null;
    if(btn){ btn.disabled = true; btn.textContent = 'Připravuji…'; }
    try{
      if(typeof JSZip === 'undefined'){
        alert('Export do Wordu se nepodařilo načíst (chybí knihovna JSZip — zkontrolujte připojení k internetu).');
        return;
      }
      const blob = await buildShiftSummaryDocxForWindow(win, records);
      const filename = shiftSummaryFilename(win);
      try{
        const file = new File([blob], filename, { type: blob.type });
        if(navigator.canShare && navigator.canShare({ files: [file] })){
          await navigator.share({ files: [file] });
          return;
        }
      }catch(e){
        // Sdílení zrušeno/nedostupné — spadneme na otevření v nové kartě.
      }
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      setTimeout(()=> URL.revokeObjectURL(url), 60000);
    }catch(e){
      console.error('Export souhrnu směny selhal:', e);
      alert('Vytvoření dokumentu se nezdařilo (' + e.message + ').');
    }finally{
      if(btn){ btn.disabled = false; btn.textContent = originalText; }
    }
  }

  // ---- Automatické generování po skončení směny + složka "Souhrny směn" ----
  //
  // DŮLEŽITÉ OMEZENÍ: appka běží čistě v prohlížeči na GitHub Pages, bez
  // vlastního serveru/Cloud Function na pozadí. "Automaticky" tedy značí:
  // jakmile někdo (kdokoli ze strážníků) příště otevře tenhle desktopový
  // přehled PO skončení směny, appka si všimne, že za tu směnu ještě není
  // záznam, dopočítá ho a uloží do Firestore (kolekce shiftSummaries) — ne
  // že by se to spustilo úplně samo v pozadí, když má appka zavřenou úplně
  // každý. Kontrola běží při načtení appky a pak každých 5 minut, dokud
  // je přehled otevřený.
  async function checkAndGenerateCompletedShiftSummary(){
    try{
      const win = previousShiftWindow(new Date());
      const docId = win.dateStr + '_' + win.type;
      const ref = db.collection('shiftSummaries').doc(docId);
      const snap = await ref.get();
      if(snap.exists) return;
      const records = recordsInWindow(win);
      const stats = computeStatsForRecords(records);
      await ref.set({
        dateStr: win.dateStr,
        type: win.type,
        generatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        total: stats.total,
        statusCounts: stats.statusCounts,
        officerRows: stats.officerRows
      });
    }catch(e){
      console.error('Automatické vygenerování souhrnu směny selhalo:', e);
    }
  }

  // Kontrola běží i periodicky, dokud je appka otevřená — ať se souhrn
  // objeví krátce po skončení směny, ne až když někdo příště appku znovu
  // otevře (může to samozřejmě být klidně o pár hodin/dny později, pokud
  // appka mezitím zavřená nebyla).
  setInterval(checkAndGenerateCompletedShiftSummary, 5 * 60 * 1000);

  // Vykreslí složku "Souhrny směn" v levém panelu — samostatný onSnapshot
  // posluchač (kolekce je malá, řádově desítky záznamů do roka, není
  // potřeba nic filtrovat/stránkovat).
  function renderShiftSummaryFolder(docs){
    const container = document.getElementById('shiftSummaryFolder');
    if(!container) return;
    if(docs.length === 0){
      container.innerHTML = '<div class="rail-empty">Zatím žádné souhrny</div>';
      return;
    }
    container.innerHTML = '';
    docs.forEach(data=>{
      const win = shiftWindowForDate(data.type, data.dateStr);
      const btn = document.createElement('button');
      btn.className = 'rail-summary-item';
      const [y, m, d] = data.dateStr.split('-');
      btn.innerHTML = '<span>' + d + '.' + m + '. ' + escapeHtml(SHIFT_TYPE_LABEL[data.type]) + '</span>' +
        '<span class="badge">' + data.total + '</span>';
      btn.title = 'Stáhnout ' + shiftSummaryFilename(win);
      btn.addEventListener('click', ()=>{
        downloadShiftSummaryDocx(win, recordsInWindow(win), null);
      });
      container.appendChild(btn);
    });
  }

  function getOffensePenaltyText(record){
    const penalty = record && record.offenseLabel ? OFFENSE_PENALTIES[record.offenseLabel] : null;
    return penalty ? ('Příkaz na místě (' + penalty + ')') : 'Příkaz na místě';
  }

  // Přestupky s finančním rozmezím (např. "2 500–3 500 Kč") jsou závažnější
  // — u nich domluva jako způsob řešení nepřipadá v úvahu, jen u přestupků
  // s pevným stropem ("do X Kč").
  function offenseHasPenaltyRange(record){
    const penalty = record && record.offenseLabel ? OFFENSE_PENALTIES[record.offenseLabel] : null;
    return !!(penalty && penalty.indexOf('–') !== -1);
  }

  // Na desktopu funguje běžné stažení přes <a download> spolehlivě (na
  // rozdíl od mobilního Safari, kde appka RZ Scanner / Přehled kvůli
  // tomu používá Web Share API) — soubor tak jde rovnou do složky
  // Stažené soubory, místo aby appka otevírala sdílecí okno Windows.
  function downloadPhoto(dataUrl, filename){
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  function renderPhotoGallery(record, photos, mime){
    const gallery = document.getElementById('photoGallery');
    gallery.innerHTML = '';
    photos.forEach((b64, idx)=>{
      const dataUrl = 'data:' + mime + ';base64,' + b64;
      const filename = (record.plate || 'prestupek') + '_' + (idx + 1) + '.jpg';
      const item = document.createElement('div');
      item.className = 'photo-item';

      const img = document.createElement('img');
      img.src = dataUrl;
      img.alt = 'Fotodokumentace';
      item.appendChild(img);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'download-link';
      btn.textContent = 'Stáhnout fotku' + (photos.length > 1 ? ' ' + (idx + 1) : '');
      btn.addEventListener('click', ()=> downloadPhoto(dataUrl, filename));
      item.appendChild(btn);

      gallery.appendChild(item);
    });
  }

  function buildDetailHeadHtml(record){
    const parts = [];
    parts.push('<span class="detail-head-plate mono">' + escapeHtml(record.plate || 'NEZNÁMÁ SPZ') + '</span>');
    if(record.noticeNumber) parts.push('<span class="detail-head-meta mono">' + escapeHtml(record.noticeNumber) + '</span>');
    if(record.address) parts.push('<span class="detail-head-meta">' + escapeHtml(record.address) + '</span>');
    const dateTime = [record.date ? formatDateCz(record.date) : null, record.time || null].filter(Boolean).join(' ');
    if(dateTime) parts.push('<span class="detail-head-meta">' + escapeHtml(dateTime) + '</span>');
    if(record.officerName) parts.push('<span class="detail-head-meta">' + escapeHtml(record.officerName) + '</span>');
    let html = '<div class="detail-head-line1">' + parts.join('<span class="detail-head-meta">·</span>') + '</div>';
    if(record.offenseLabel) html += '<div class="detail-head-offense">' + escapeHtml(record.offenseLabel) + '</div>';
    return html;

    document.getElementById('detailHeadInfo').innerHTML = buildDetailHeadHtml(record);
    document.getElementById('noticeCardContainer').innerHTML = buildNoticeHtml(record);

    const photoToggleBtn = document.getElementById('photoToggleBtn');
    const photoWrap = document.getElementById('photoWrap');
    document.getElementById('photoGallery').innerHTML = '';
    photoWrap.classList.remove('open');
    photoToggleBtn.textContent = 'Foto';
    photoToggleBtn.disabled = false;

    // Older records still keep photos inline on the main document; newer
    // ones only have a `hasPhotos` flag and the actual bytes live in a
    // subcollection, fetched lazily below when "Foto" is tapped — this is
    // what keeps opening a record (and loading the list before it) fast.
    const legacyPhotos = record.photos && record.photos.length ? record.photos
      : (record.photoBase64 ? [record.photoBase64] : []);

    if(record._resolvedPhotos){
      // Fotky už byly v této session jednou staženy (ze subkolekce nebo
      // starého formátu) — obnovíme je z cache místo opětovného fetchování
      // a místo prázdné galerie po návratu do detailu.
      renderPhotoGallery(record, record._resolvedPhotos, record._resolvedMime || 'image/jpeg');

      record._resolvedPhotos = legacyPhotos;

  async function prepareOznameniPreview(record){
    currentOznameniBlob = null;
    const statusEl = document.getElementById('docxPreviewStatus');
    const btn = document.getElementById('docxOpenBtn');
    statusEl.textContent = 'Připravuji náhled…';
    btn.disabled = true;
    try{
      if(typeof JSZip === 'undefined'){
        statusEl.textContent = 'Nepodařilo se načíst knihovnu pro Word.';
        return;
      }
      let photosB64 = record._resolvedPhotos;
      if(!photosB64 && record.hasPhotos){
        const res = await ensurePhotosLoaded(record);
        photosB64 = res.photos;
      }
      const blob = await buildOznameniDocx(record, photosB64 || []);
      // Modál mezitím mohl přepnout na jiný záznam — starý (už neplatný)
      // náhled v tom případě zahodíme.
      if(currentDetailRecord !== record) return;
      currentOznameniBlob = blob;
      statusEl.textContent = 'Náhled připraven';
      btn.disabled = false;
    }catch(e){
      console.error('Příprava náhledu Oznámení selhala:', e);
      if(currentDetailRecord === record) statusEl.textContent = 'Náhled se nepodařilo připravit.';

  document.getElementById('docxOpenBtn').addEventListener('click', async ()=>{

  function updateResolveBtn(record){
    const menuBtn = document.getElementById('resolveMenuBtn');
    const vyresenoBtn = document.getElementById('menuVyresenoBtn');
    const domluvaBtn = document.getElementById('menuDomluvaBtn');
    const penaltyText = getOffensePenaltyText(record);
    // U přestupků s finančním rozmezím (viz offenseHasPenaltyRange výše)
    // domluva jako způsob řešení nepřipadá v úvahu — tlačítko se v nabídce
    // vůbec nezobrazí, aby si ho strážník nemohl omylem zvolit.
    domluvaBtn.style.display = offenseHasPenaltyRange(record) ? 'none' : '';
    if(record.resolved){
      // Text u horního tlačítka "Dořešit" se liší podle toho, jak byl
      // přestupek doopravdy vyřešen — starší záznamy bez uloženého
      // resolvedMethod (z appky před touhle úpravou) spadnou na obecné
      // "Dořešeno".
      if(record.resolvedMethod === 'oznameni'){
        menuBtn.textContent = '✓ Oznámeno';
      } else if(record.resolvedMethod === 'prikaz'){
        menuBtn.textContent = '✓ Dořešeno příkazem';
      } else if(record.resolvedMethod === 'domluva'){
        menuBtn.textContent = '✓ Dořešeno domluvou';
      } else {
        menuBtn.textContent = '✓ Dořešeno';
      }
      vyresenoBtn.textContent = '✓ ' + penaltyText;
      vyresenoBtn.disabled = true;
      domluvaBtn.textContent = record.resolvedMethod === 'domluva' ? '✓ Domluva' : 'Domluva';
      domluvaBtn.disabled = true;
    } else {
      menuBtn.textContent = 'Dořešit';
      vyresenoBtn.textContent = penaltyText;
      vyresenoBtn.disabled = false;
      domluvaBtn.textContent = 'Domluva';
      domluvaBtn.disabled = false;
    }
  }

  // Sdílené označení přestupku jako vyřešeného — volá se jak po úspěšném
  // otevření dokumentu "Oznámení", tak po klepnutí na "Příkaz na místě".
  // "method" rozlišuje, jaký text appka pak zobrazí (viz updateResolveBtn
  // a vykreslení odznaku v seznamu).
  async function markResolved(record, method){
    if(!record || record.resolved) return;
    // Shortens this record's Firestore TTL from the default 90 days
    // (set when it was created) to 60 days from now — the "expireAt"
    // field is what the TTL policy actually watches, so updating it is
    // enough; no need to move the document anywhere.
    const expireAt = firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 60*24*60*60*1000));
    await db.collection('prestupky').doc(record.id).update({
      resolved: true,
      resolvedMethod: method,
      resolvedAt: firebase.firestore.FieldValue.serverTimestamp(),
      expireAt: expireAt
    });
    record.resolved = true;
    record.resolvedMethod = method;
    updateResolveBtn(record);
    refreshView();
  }

  // u exportOznameni().
  async function exportVyzva(record){

  document.getElementById('menuOznameniBtn').addEventListener('click', async ()=>{
    document.getElementById('resolveMenuOverlay').classList.remove('open');
    const record = currentDetailRecord;
    if(!record) return;
    const opened = await exportOznameni(record);
    // Jen když se dokument doopravdy otevřel/stáhnul (ne při chybě) a jen
    // pokud přestupek ještě nebyl vyřešený jiným způsobem dřív.
    if(opened) markResolved(record, 'oznameni');
  });

  document.getElementById('menuVyzvaBtn').addEventListener('click', ()=>{
    document.getElementById('resolveMenuOverlay').classList.remove('open');
    if(currentDetailRecord) exportVyzva(currentDetailRecord);
  });

  document.getElementById('menuVyresenoBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record || record.resolved) return;
    document.getElementById('resolveMenuOverlay').classList.remove('open');
    const btn = document.getElementById('menuVyresenoBtn');
    btn.disabled = true;
    btn.textContent = 'Ukládám…';
    try{
      await markResolved(record, 'prikaz');
    }catch(e){
      console.error('Označení jako dořešeno selhalo:', e);
      btn.disabled = false;
      btn.textContent = 'Vyřešeno (chyba, zkuste znovu)';
    }
  });

  document.getElementById('menuDomluvaBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record || record.resolved) return;
    document.getElementById('resolveMenuOverlay').classList.remove('open');
    const btn = document.getElementById('menuDomluvaBtn');
    btn.disabled = true;
    btn.textContent = 'Ukládám…';
    try{
      await markResolved(record, 'domluva');
    }catch(e){
      console.error('Označení jako dořešeno selhalo:', e);
      btn.disabled = false;
      btn.textContent = 'Domluva (chyba, zkuste znovu)';
    }
  });

  // Sdílená logika stažení fotek ze subkolekce — volá ji jak automatické
  // otevření detailu (viz openDetail), tak ruční klik na tlačítko "Foto"
  // (např. po chybě, kdy je potřeba zkusit znovu).
  async function loadAndShowPhotos(record){
    const photoWrap = document.getElementById('photoWrap');
    const photoToggleBtn = document.getElementById('photoToggleBtn');
    photoToggleBtn.disabled = true;
    photoToggleBtn.textContent = 'Načítám…';
    try{
      const doc = await db.collection('prestupky').doc(record.id).collection('data').doc('photos').get();
      const data = doc.exists ? doc.data() : null;
      const photos = (data && data.photos) || [];
      const mime = (data && data.photoMime) || 'image/jpeg';
      record._resolvedPhotos = photos;
      record._resolvedMime = mime;
      renderPhotoGallery(record, photos, mime);
      photoToggleBtn.textContent = 'Foto' + (photos.length > 1 ? ' (' + photos.length + ')' : '');
      photoToggleBtn.disabled = false;
      photoWrap.classList.add('open');
    }catch(e){
      console.error('Načtení fotek selhalo:', e);
      photoToggleBtn.textContent = 'Foto (chyba)';
      photoToggleBtn.disabled = false;
    }
  }

  document.getElementById('photoToggleBtn').addEventListener('click', async ()=>{
    const record = currentDetailRecord;
    if(!record) return;
    const photoWrap = document.getElementById('photoWrap');

    if(record._resolvedPhotos){
      photoWrap.classList.toggle('open');
      return;
    }

    await loadAndShowPhotos(record);
  });

  function closeDetailModal(){
    document.getElementById('detailModalOverlay').classList.remove('open');
    document.querySelectorAll('.record-item.selected').forEach(el=>el.classList.remove('selected'));
    currentDetailRecord = null;
  }
  document.getElementById('detailCloseBtn').addEventListener('click', closeDetailModal);
  document.getElementById('detailModalOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'detailModalOverlay') closeDetailModal();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && document.getElementById('detailModalOverlay').classList.contains('open')) closeDetailModal();
  });

})();
</script>
</body>
</html>
